#
# M5StickS3 (K150): every component, every pin and the net it is on, as the
# vendor's published schematic shows them, plus the Kleidos additions and
# corrections under "kleidos" (each with its source, marked on the drawing and
# listed on page 1). Facts only: what connects where and through what. The drawing in this folder (sticks3.kicad_sch) is generated from
# this file; README.md says how, and how the two are checked against each other.
#
# Read from: the four printed pages of the PDF below, and the netlist Altium
# wrote into the same PDF's bookmarks (Nets -> Pins per sheet), which every
# connection here matches. Values come from the printed pages only.
#
# Conventions:
# - pins are the vendor's pin numbers (BGA balls as A1, B2...);
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "renamed" with the name Altium generated for it;
# - NC is a pin the schematic leaves unconnected;
# - the daughterboard (page 4) reuses designators the main board has, so its
#   parts are numbered +100 here (U1 -> U101, CN1 -> CN101...); its own net
#   names, where they differ from the main board's, are under "aliases".

board: sticks3
source:
  title: K150 StickS3 schematic, project V0.6 (2025-11-11)
  url: https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/1207/K150_Stick_S3_PRJ_V0.6_20251111_2025_11_17_16_10_24.pdf
  listed_at: https://docs.m5stack.com/en/core/StickS3
  read_from: https://web.archive.org/web/20260308045411/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/1207/K150_Stick_S3_PRJ_V0.6_20251111_2025_11_17_16_10_24.pdf
  read_note: The vendor host refused connections from the machine that wrote this file on 2026-11-16; the Wayback Machine copy (captured 2026-03-08) was read instead.
  sha256: e5272c97bbe52d6937bde89c9c85bfddb7d1d076145e4d2b960ff596c20d0226
  checked: 2026-11-16
  pages:
    1: Block diagram, power network, power modes and I/O map (sheet 02_StickS3_Block diagram)
    2: Power management (sheet 03_Power_Management)
    3: MCU core and functions (sheet 04_MUC_Core and Function)
    4: HAT2 daughterboard with IR and speaker (StickS3_PRJ_FPC_V1.0_20251125, Sheet1)
  not_drawn: The PDF bookmarks also carry a second daughterboard, StickS3_PRJ_Lite_FPC_V1.0_20251105 (an LED in place of the IR parts), which no page prints; it is not in this file.
  also_read:
    - url: https://docs.m5stack.switch-science.com/en/core/StickS3
      mirror_of: https://docs.m5stack.com/en/core/StickS3
      used_for: I2C addresses, the PinMap, the HAT2 header pinout, the Grove wire colors, J3's HY2.0-4P part, LED1's color (green, "Download Mode")
      checked: 2026-11-17
    - url: https://github.com/m5stack/M5PM1/blob/main/docs/M5PM1_Datasheet_EN.pdf
      title: M5PM1 Chip User Manual V1.9 (M5Stack)
      used_for: the M5PM1's I2C address 0x6E (section I.2 (4), p. 1) (K9); its pin table (Table 1 p. 2, Table 2 p. 3)
      checked: 2026-11-17
    - url: https://documentation.espressif.com/esp32-s3-pico-1_datasheet_en.pdf
      title: ESP32-S3-PICO-1 Series Datasheet v1.2 (Espressif)
      used_for: SPICS1 (GPIO26) and GPIO33 to GPIO37 go to the N8R8's in-package Octal PSRAM (Table 2-1 note 4, p. 13) (K2 to K7)
      checked: 2026-11-17
    - title: Bosch Sensortec BMI270 datasheet BST-BMI270-DS000-08, revision 1.6
      where: bosch-sensortec.com
      used_for: address 0x68 with SDO on GND (section 6.5, p. 128); CSB on VDDIO selects I2C (section 6.3, p. 123; Table 17, p. 122) (K10)
      checked: 2026-11-17
    - url: https://files.waveshare.com/wiki/common/ES8311.DS.pdf
      title: Everest Semiconductor ES8311 datasheet, revision 10.0, January 2021 (a distributor's copy)
      used_for: address 0011 00x with x = CE; CE on AGND gives 0x18 (section 5, p. 8) (K11)
      checked: 2026-11-17
    - url: https://datasheet.lcsc.com/datasheet/pdf/a6e12bc064a50d5a017e9740df82b571.pdf
      title: Awinic AW329XX (AW32901) datasheet V1.1, September 2018 (LCSC's copy, part C401023)
      sha256: e44d055edf7a46f6a3fe935f898637785299c64036838fe64fd448f3c4c17e48
      used_for: with OVLO on GND (directly or through 0 ohm) U7 trips at its default 5.95 V rising, 5.83 to 6.07 V, 130 mV hysteresis (p. 1, the VIN_OVLO table p. 2, note 2 p. 4) (K1)
      checked: 2026-11-17
    - url: https://datasheet.lcsc.com/datasheet/pdf/1300ae41d9efc3741e3098a9a42c762d.pdf
      title: JCET CJ3439KDW datasheet, revision D, March 2016 (LCSC's copy, part C99824)
      sha256: 41cb3b3374616678b096dfab449a544e165c1878e2b6d7b2f0fbf1c70effcb66
      used_for: Q2's channels and pins, N-channel on 1 S, 2 G, 6 D and P-channel on 3 D, 4 S, 5 G (p. 1, equivalent circuit); the drawing agrees (no entry)
      checked: 2026-11-17
    - url: https://www.ickey.cn/static-pf/datasheet/32/b8/e731/32b8e731bcfd31639095bdc5f4bfa1d4.pdf
      title: Awinic AW8737A datasheet V1.2, July 2022 (a distributor's copy; Awinic lists it at https://www.awinic.com/en/productDetail/AW8737AFCR)
      sha256: 53f7263c943cb4b63bc587c9e34a6b829ebac80649b6ae8cd8a607d6d5e00d12
      used_for: U19 pin D3 (PVDD) is the charge pump's output, pin A4 (~SHDN) a one-wire pulse control (p. 3); the drawing agrees (no entry)
      checked: 2026-11-17
    - url: https://www.vishay.com/docs/82748/vsop383.pdf
      title: Vishay VSOP383.. datasheet, document 82748, revision 1.6, 2026-02-09
      used_for: U101's pinning (1, 4, 5 N.C., 2 VS, 3 OUT, 6, 8 GND, 7 IN for an outside photodiode, p. 2), the output's internal pull-up to VS (p. 1); the drawing agrees (no entry)
      checked: 2026-11-17
    - path: bench/2026-11-17-i2c-scan-l3b.md
      used_for: only 0x18, 0x68 and 0x6E answer on the bus; 0x18 leaves it with L3B (corroborates K9 to K11)
      checked: 2026-11-17
    - path: bench/2026-11-17-charge-status-pyg0.md
      used_for: PYG0 reads 0 while U15 charges the cell and 1 otherwise, with USB in (K8)
      checked: 2026-11-17
    - path: bench/2026-11-17-ir-rx-gpio42.md
      used_for: GPIO42 idles low with GROVE_5V up (no entry; which daughterboard is fitted stays open)
      checked: 2026-11-17
    - path: bench/2026-11-17-pmic-rails-and-led.md
      used_for: the M5PM1 switches LED1 (POWER_CONFIG bit 4); the rails through the M5PM1's ADC (no entry)
      checked: 2026-11-17

