kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. A bench path is under this folder; the datasheets are cited in full under source.also_read
  # and in README.md ("Kleidos additions and corrections"); improvements.md holds the triage.
  - id: K1
    kind: correction
    what: "U7 trips at its default 5.95 V rising (5.83-6.07 V), since OVLO is on GND through R8 0R (R7 not fitted)."
    vendor: "\"OVP = 5V\""
    element: {rail: 5VIN_L0}
    source:
      type: datasheet
      cite: "AW32901 datasheet V1.1, pp. 1, 2 and 4 (note 2)"
  - id: K2
    kind: addition
    what: "GPIO26 (SPICS1): taken by the in-package Octal PSRAM."
    element: {gpio: GPIO26}
    source:
      type: datasheet
      cite: "ESP32-S3-PICO-1 datasheet v1.2, p. 13"
  - id: K3
    kind: addition
    what: "GPIO33 (pin 38): taken by the in-package Octal PSRAM."
    element: {gpio: GPIO33}
    source:
      type: datasheet
      cite: "ESP32-S3-PICO-1 datasheet v1.2, p. 13"
  - id: K4
    kind: addition
    what: "GPIO34 (pin 39): taken by the in-package Octal PSRAM."
    element: {gpio: GPIO34}
    source:
      type: datasheet
      cite: "ESP32-S3-PICO-1 datasheet v1.2, p. 13"
  - id: K5
    kind: addition
    what: "GPIO35 (pin 40): taken by the in-package Octal PSRAM."
    element: {gpio: GPIO35}
    source:
      type: datasheet
      cite: "ESP32-S3-PICO-1 datasheet v1.2, p. 13"
  - id: K6
    kind: addition
    what: "GPIO36 (pin 41): taken by the in-package Octal PSRAM."
    element: {gpio: GPIO36}
    source:
      type: datasheet
      cite: "ESP32-S3-PICO-1 datasheet v1.2, p. 13"
  - id: K7
    kind: addition
    what: "GPIO37 (pin 42): taken by the in-package Octal PSRAM."
    element: {gpio: GPIO37}
    source:
      type: datasheet
      cite: "ESP32-S3-PICO-1 datasheet v1.2, p. 13"
  - id: K8
    kind: addition
    what: "With USB in, PYG0 (U15 CHRG) reads 0 while U15 charges and 1 while it does not."
    element: {gpio: PYG0, table: "M5PM1 GPIO (U16)"}
    source:
      type: bench
      cite: "bench/2026-11-17-charge-status-pyg0.md, 2026-11-17"
  - id: K9
    kind: addition
    what: "The M5PM1 U16 answers at I2C address 0x6E."
    element: {i2c: U16}
    source:
      type: vendor-doc
      cite: "M5PM1 manual V1.9, p. 1; bench/2026-11-17-i2c-scan-l3b.md"
  - id: K10
    kind: addition
    what: "The BMI270 U17 answers at 0x68 (SDO on GND), in I2C mode (CSB on VDDIO)."
    element: {i2c: U17}
    source:
      type: datasheet
      cite: "BMI270 datasheet rev 1.6, pp. 123, 128; bench/2026-11-17-i2c-scan-l3b.md"
  - id: K11
    kind: addition
    what: "The ES8311 U18 answers at 0x18 (CE on AGND) while 3V3_L3B_AU is up."
    element: {i2c: U18}
    source:
      type: datasheet
      cite: "ES8311 datasheet rev 10.0, p. 8; bench/2026-11-17-i2c-scan-l3b.md"

