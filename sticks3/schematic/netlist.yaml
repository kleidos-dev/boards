aliases:   # daughterboard (page 4) net name -> the main-board net it is mated to through J2/CN101
  5V_IN: HAT2_5VIN
  5V_VBUS: GROVE_5V
  BOOT_OUT: G0_BOOT_OUT
  EXT_BAT: VBAT_L0
  LED_RX: G42_IR_RX
  LED_TX: G46_IR_TX
  SYS_3V3: 3V3_L2

rails:   # nominal: the voltage the net's name states (3V3, 5V), USB's 5 V for VBUS, the
         # divider's 5.0 V for BOOST_OUT, the cell U15 (a Li-ion charger) charges for
         # VBAT_L0; VBUS_L0 is whichever of Internal_5V and VBAT_L0 is up
  VUSBIN_L0:
    nominal: "5 V"
    from: J1
    what: "USB-C VBUS (A4/B9, B4/A9)."
    pages: [2]
  5VIN_L0:
    nominal: "5 V"
    from: U7
    what: "U7 AW32901FCR over-voltage switch from VUSBIN_L0; OVLO on GND (R8 0R), so it trips at 5.95 V, not the printed \"OVP = 5V\" (K1)."
    enable: nEN tied to GND (always on)
    pages: [2]
  Internal_5V:
    nominal: "5 V"
    from: "U6, U11, D10"
    what: U6 CH213K from 5VIN_L0; U11 CH213K from HAT2_5VIN; U12 AW35122FDR + D10 from GROVE_5V.
    enable: U12 EN pulled up to GROVE_5V by R11 100K and pulled to GND by Q1 while EXT_5V_EN is high
    pages: [2]
  VBUS_L0:
    nominal: "5 V or VBAT_L0"
    from: "U13, U14"
    what: U13 CH213K from Internal_5V; U14 CH213K from VBAT_L0. The system supply every regulator below takes.
    pages: [2, 3]
  VBAT_L0:
    nominal: "Li-ion cell"
    from: J4
    what: Battery connector; charged by U15 LGS4056 from Internal_5V (190 mA printed).
    enable: "U15 CE = CHG_EN (M5PM1 pin 2), R18 1M to GND"
    pages: [2, 4]
  3V3_L0:
    nominal: "3.3 V"
    from: U3
    what: "U3 CM1801F33 LDO from VBUS_L0 (\"L0 always on\", Iq 0.8 uA printed). Supplies the M5PM1, the power key pull-up and the status LED."
    enable: EN tied to VIN
    pages: [2]
  3V3_L1:
    nominal: "3.3 V"
    from: U4
    what: U4 CM1801F33 LDO from VBUS_L0. Supplies the BMI270.
    enable: "3V3_L1_EN (M5PM1 pin 18 LDO3V3_EN_PP), R5 1M to GND"
    pages: [2, 3]
  3V3_L2:
    nominal: "3.3 V"
    from: U2
    what: "U2 JW5712 buck from VBUS_L0 through L1 2.2 uH. Supplies the ESP32-S3, the I2C pull-ups, the keys and HAT2 pin 9."
    enable: "3V3_L2_EN (M5PM1 pin 14 DCDC3V3_EN_PP), R2 1M to GND; VSEL1-3 tied to VBUS_L0"
    pages: [2, 3, 4]
  3V3_L3B:
    nominal: "3.3 V"
    from: U5
    what: U5 AW35122FDR load switch from 3V3_L2. Supplies the LCD and its backlight.
    enable: "PYG2_L3B_EN (M5PM1 pin 20), R1 100K to GND"
    pages: [2, 3]
  3V3_L3B_AU:
    nominal: "3.3 V"
    from: U1
    what: "U1 CM1801F33 LDO from VBUS_L0. Supplies the ES8311, the microphone and the audio side of the I2C isolator."
    enable: "PYG2_L3B_EN (M5PM1 pin 20), R1 100K to GND"
    pages: [2, 3]
  BOOST_OUT:
    nominal: "5.0 V"
    from: U9
    what: U9 SY7088 boost from VBUS_L0 through L2 2.2 uH; R13 147K / R14 46.4K set 5.0 V (Vout = 1.2 V x (1 + R13/R14)).
    enable: "EXT_5V_EN (M5PM1 pin 10 BOOST5V_EN_PP), R10 100K to GND"
    pages: [2]
  GROVE_5V:
    nominal: "5 V"
    from: U8
    what: U8 TPS22916C load switch from BOOST_OUT; or an outside 5 V fed in at the Grove port (J3 pin 2) or HAT2 pins 6/8.
    enable: EXT_5V_EN
    pages: [2, 4]
  HAT2_5VIN:
    nominal: "5 V"
    from: J2
    what: "Outside 5 V input on HAT2 pins 2/4 (header pin \"5V_IN\")."
    pages: [2, 4]
  AGND:
    nominal: "0 V"
    from: R35
    what: "Audio ground, joined to GND at one point through R35 0R."
    pages: [3]

i2c:
  bus: {sda: G47_SDA (GPIO47), scl: G48_SCL (GPIO48), pullups: "R39 (SDA) and R38 (SCL), 2.2K/1% to 3V3_L2"}
  devices:
    - {ref: U16, part: M5PM1, address: "0x6E", source: "M5PM1 manual V1.9, section I.2 (4), p. 1; docs PinMap \"M5PM1 (0x6e)\"; bench scan 2026-11-17 (K9)"}
    - {ref: U17, part: BMI270, address: "0x68", source: "BMI270 datasheet rev 1.6, section 6.5, p. 128 (SDO, pin 1, on GND); docs PinMap \"BMI270 (0x68)\"; bench scan 2026-11-17 (K10)"}
    - {ref: U18, part: ES8311, address: "0x18", source: "ES8311 datasheet rev 10.0, section 5, p. 8 (CE, pin 20, on AGND); docs PinMap \"ES8311 (0x18)\"; reached through Q4/Q5; bench scan 2026-11-17 (K11)"}
  also_on_bus: J6 pins 6 (SCL) and 8 (SDA), the LCD connector
  isolator: Q4 (SCL) and Q5 (SDA), 2N7002DW pairs back to back; their gates sit on 3V3_L2 and 3V3_L3B_AU, so the codec side (AUDIO_I2C_SCL/SDA, R33/R34 2.2K/1% to 3V3_L3B_AU) joins the bus only while both rails are up.

