root:
  title: Contents
  heading: "M5StickS3 (K150) schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page
        numbers at the bottom right of every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width.
        A dot joins lines; a cross on a pin end means the pin is not connected.
        Pins connect by net labels (the boxed names): pins whose labels carry
        the same name are on one net, on any page.
        [3/C4] after a label: page 3 carries that net too, its label in zone C4
        (column 4, row C of the border). Click it to land on that label.
        No [page/zone]: the net is on this page only.
        Click a part's reference to find its row in the parts list; the row's
        page/zone leads back. A part crossed out in red is not fitted (DNP).
        White: parts and their references. Grey: values, pin names, pin numbers.
        A dashed frame is a block of the circuit, titled at its top left.
        An amber K3 marks a Kleidos addition or correction: it leads to its row below.
    - title: Notes
      text: |
        Every part, pin and net of the M5StickS3, with the values the vendor
        documents: connectivity documented from the vendor's public documentation,
        with Kleidos additions and corrections listed on page 1
        (M5Stack's K150 StickS3 schematic V0.6, 2025-11-11, and its docs page,
        cited in README.md and netlist.yaml beside this file). Layout and
        symbols are this project's. No footprints, no PCB, no part numbers
        beyond the documented ones.
        Values are as the vendor prints them (10K/1%, 22uF/10V). A value of NC
        means not fitted: those parts are marked DNP.
        Reference designators are the vendor's, not renumbered. The daughterboard
        reuses the main board's, so its parts are numbered +100 here (its U1 is
        U101); J6, the LCD connector, carries no designator in the print.
        Nets the vendor left unnamed carry names of ours (U12_EN, SCL_ISO...).
        Zones: columns 1-8 and rows A-F, 50 mm apart, printed in the border.

sheets:
  - file: power_input.kicad_sch
    name: Power input and charging
    summary: "USB-C input, over-voltage switch, charger and battery, the ideal-diode power path, the voltage dividers to the M5PM1 ADC, the power key and the status LED."
    parts: "J1 USB-C, U7 AW32901FCR, U15 LGS4056 charger, J4 battery, U6 U11 U13 U14 CH213K, U12 AW35122FDR, Q2 CJ3439KDW, S1 power key, LED1"
    blocks:
      - title: USB-C input
        rows:
          - [J1, {col: [R3, R4, D1, D2]}]
      - title: Over-voltage switch
        rows:
          - [U7, {col: [R7, R8, C13, C19]}]
          - [U6]
      - title: Charger and battery
        rows:
          - [U15, {col: [C22, R12, R16, R18]}]
          - [J4, {col: [C26]}]
      - title: Power path (ideal diodes)
        rows:
          - [U13, U14, U11]
          - [U12, Q1, {col: [R11, C21, C25]}, {col: [D10]}]
      - title: Voltage sensing (to the M5PM1 ADC)
        rows:
          - ["Q2:A", "Q2:B", {cols: [[R9, R15], [R23, R24, C30]]}]
          - [{cols: [[R19, R20, C29], [R21, R22, C28]]}]
      - title: Power key and status LED
        rows:
          - [S1, {col: [R17, C27]}]
          - [LED1, Q3, {col: [R25, R28, R29]}]
  - file: rails_pmic.kicad_sch
    name: Rails and power management
    summary: "The M5PM1 power-management MCU, the 3.3 V rails L0, L1, L2, L3B and L3B_AU, and the 5 V boost and switch for the Grove port."
    parts: "U16 M5PM1 (PY32L020F15U6), U1 U3 U4 CM1801F33, U2 JW5712, U5 AW35122FDR, U9 SY7088, U8 TPS22916C"
    pwr_flags: [GND]
    blocks:
      - title: M5PM1 power-management MCU
        rows:
          - [U16, {col: [C31, C58]}]
      - title: L0 and L1 (3.3 V LDOs)
        rows:
          - [U3, {col: [C5, C10]}]
          - [U4, {col: [C4, C8, R5]}]
      - title: L2 (3.3 V buck)
        rows:
          - [U2, {cols: [[C2, C3, R2], [L1, C9, C11, C12]]}]
      - title: L3B (LCD and audio)
        rows:
          - [U1, {col: [C1, C6, R1]}]
          - [U5, {col: [C7, C14]}]
      - title: 5 V boost and Grove output
        rows:
          - [U9, {cols: [[L2, C16, C17, C18], [R10, R13, R14, C23, C24]]}]
          - [U8, {col: [C15, C20]}]
  - file: soc.kicad_sch
    name: ESP32-S3
    summary: "The ESP32-S3 module with its supply decoupling, RF path, reset, boot strap, USB, I2C pull-ups, the two keys and the test points."
    parts: "U20 ESP32-S3-PICO-1-N8R8, J5 antenna pad, FT1 SDMM0806H-2-900T, S2 S3 keys, test points TP1-TP6, TP8, TP9"
    blocks:
      - title: ESP32-S3-PICO-1-N8R8
        rows:
          - [U20]
      - title: Supply decoupling
        rows:
          - [{cols: [[C57, C54, C55, L4, C61], [C59, C62, C64, C66, C67, C68]]}]
      - title: RF path
        rows:
          - [J5, {cols: [[L3, L5], [C56, C69, C60, C63]]}]
      - title: Reset, boot strap, I2C pull-ups
        rows:
          - [{cols: [[R40, C50, R46], [R38, R39]]}]
      - title: USB
        rows:
          - [{col: [R45, R44]}, FT1]
      - title: Series resistors and test points
        rows:
          - [{cols: [[R47, R50, R51], [TP8, TP9]]}]
      - title: Keys
        rows:
          - [{cols: [[S2, S3], [R37, R36, C52, C53]]}]
      - title: Power-side test points
        rows:
          - [{cols: [[TP1, TP2, TP3], [TP4, TP5, TP6]]}]
  - file: hmi_audio.kicad_sch
    name: Display, IMU and audio
    summary: "The LCD connector and backlight switch, the BMI270 IMU, the I2C isolator, the ES8311 codec, the microphone and the speaker amplifier."
    parts: "J6 LCD connector, Q6 2N7002T, U17 BMI270, Q4 Q5 2N7002DW, U18 ES8311, U21 MSM381A3729H9BPC, U19 AW8737A"
    pwr_flags: [AGND]
