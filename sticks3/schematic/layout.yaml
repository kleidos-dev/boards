  - file: hat2.kicad_sch
    name: Connectors and HAT2 daughterboard
    summary: "The HAT2 socket and the Grove port on the main board; the daughterboard with its plug, the HAT2 header, the IR receiver and transmitter and the speaker."
    parts: "J2 HAT2 socket, J3 Grove; daughterboard: CN101 plug, CN102 HAT2 header, U101 VSOP38338, U103 IR LED, Q101, U104 speaker"
    blocks:
