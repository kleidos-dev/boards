#
# M5StickC Plus2 (K016-P2): every component, every pin and the net it is on, as
# the vendor's published schematic shows them, with the Kleidos additions and
# corrections listed under "kleidos" (each with its source, marked on the
# drawing and listed on page 1). Facts only: what connects where and through
# what. The drawing in this folder (m5stickc-plus2.kicad_sch) is generated from
# this file; README.md says how, and how the two are checked against each other.
#
# Read from: the three printed pages of the PDF below. The PDF carries no
# netlist (its bookmarks list each part and its pins, not the nets), so every
# connection was read off the printed pages: the wires, junctions, net labels
# and power ports, each pin at the place the PDF marks it. Values come from the
# printed pages (a value the print omits is said in the part's note).
#
# Conventions:
# - pins are the vendor's pin numbers; NC is a pin the schematic leaves unconnected;
# - net names are the vendor's (labels and power ports); a net the vendor left
#   unnamed gets a name of ours, listed under "unnamed";
# - a net that carries two vendor labels is drawn under one, the other is under
#   "aliases".

board: m5stickc-plus2
source:
  title: M5StickC Plus2 schematic v0.5 (Altium, 3 sheets)
  url: https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/512/Sch_M5StickC_Plus2_v0.5.pdf
  listed_at: https://docs.m5stack.com/en/core/StickC-Plus2
  read_from: https://web.archive.org/web/20260318085629/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/512/Sch_M5StickC_Plus2_v0.5.pdf
  read_note: The vendor host timed out from the machine that wrote this file on 2026-11-17; the Wayback Machine copy (captured 2026-03-18) was read instead.
  sha256: 75017af5c47c7e56904469f032e7d71a63803651a6e8af070d427f125e88e6cd
  created: "2025-10-31 (the PDF's creation date)"
  checked: 2026-11-17
  pages:
    1: ESP32-PICO-V3-02, USB-C and CH9102F, display, buttons, buzzer, headers and Grove port (sheet SoC.SchDoc)
    2: Power path, charger, regulators, power-off timer and RTC (sheet Power.SchDoc)
    3: IMU and microphone (sheet IMU_MIC.SchDoc)
  also_read:
    - url: https://docs.m5stack.switch-science.com/en/core/StickC-Plus2
      mirror_of: https://docs.m5stack.com/en/core/StickC-Plus2
      used_for: the PinMap (buttons A, B, C on G37, G39, G35; IR and red LED on G19; buzzer on G2), which the schematic agrees with
      checked: 2026-11-17
    - url: https://web.archive.org/web/20261031011628/https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/core/BM8563_V1.1_cn.pdf
      title: BM8563 real-time clock datasheet V1.1, as M5Stack hosts it
      used_for: the RTC's I2C address (write A2h, 0x51), which the schematic does not print; INT open-drain (K1, K14)
      checked: 2026-11-16
    - url: https://akizukidenshi.com/goodsaffix/ch9102.pdf
      title: WCH CH9102 datasheet CH9102DS1, version 1C (a mirror; WCH's own host timed out on 2026-11-17)
      sha256: 876966aa794ec18d850b622a76386d7565bd76e7f76fdb972b1602172062fb3a
      used_for: the CH9102F's QFN24 pin names, its built-in pulls and its V3 regulator (K2 to K6)
      checked: 2026-11-17
    - url: https://www.espressif.com/sites/default/files/documentation/esp32-pico_series_datasheet_en.pdf
      title: ESP32-PICO Series Datasheet v1.5 (Espressif)
      sha256: 177eb1517274eea5056ce725951091ebe8e2bce1d8635f064081fdad1cec0918
      used_for: VDD_SDIO, the in-package flash and PSRAM pins, the strapping and input-only pins (K7 to K13)
      checked: 2026-11-17
    - url: https://static.chipdip.ru/lib/495/DOC013495055.pdf
      title: LRC LP3218DT1G P-channel MOSFET datasheet Rev.B, May 2017 (a distributor's copy)
      sha256: 336b22f5df448eab6804ba03191fa0035faed5e4ecb915b193f9917f96553e49
      used_for: Q3 and Q4's pin configuration (the print's reading confirmed; no entry)
      checked: 2026-11-17
    - url: https://static.chipdip.ru/lib/913/DOC012913966.pdf
      title: Gainsil GS321/358/324 datasheet V2 (a distributor's copy)
      sha256: 59fba7a51d3ae6b8a84803d7fae7bcc5f66c91ccfba01907f3b02f9a6b5acab1
      used_for: U8's SOT23-5 pinout, which agrees with the print's numbering (no entry)
      checked: 2026-11-17
    - path: bench/2026-11-17-i2c-scan.md
      used_for: only 0x51 and 0x68 answer on the I2C bus (corroborates K1)
      checked: 2026-11-17
    - path: bench/2026-11-17-panel-readback-spird.md
      used_for: the panel drives data back on LCD connector pin 4, GPIO15's net (K15)
      checked: 2026-11-17

unnamed:   # nets the print leaves unnamed: our name -> what it is
  ANT_FEED: "antenna E1 to the matching network L1 / C1"
  BOOST_FB: "U6 FB: R25 160K / R27 47K"
  BOOST_IN: "U6 IN and EN, from VBAT_OUT through R22 0R; L2, C18, C19"
  BOOST_LX: "U6 LX (pins 1, 2) and L2"
  BOOST_OUT: "U6 OUT (pins 7, 8): R25, C17, D20 anode"
  BUCK_FB: "U7 FB: R32 68K / R33 15K"
  BUCK_LX: "U7 LX and L3"
  BUZ_DRV: "R19 470R from GPIO2 to the coupling capacitor C12"
  BUZ_N: "buzzer LS1 -, Q2 collector, D14 anode"
  BUZ_P: "buzzer LS1 +, R16 10R from +3.3V, D14 cathode"
  CH9102_RST: "U2 ~RST, R14 to +VDD"
  CH9102_VBUS: "U2 VDD5 and VBUS, fed from VBUS through D29, with C9"
  GPI35: "U1 pin 11 (VDET_2/I35): R6 to +3.3V, D1 to WAKE"
  IMU_REGOUT: "U10 REGOUT and C29"
  IO19_R: "U1 pin 38 (IO19) to R9 10R; the far side is the vendor net GPIO19"
  IR_A: "IR LED IR1 anode, R15 22R from VBAT_OUT"
  IR_LED_K: "Q5 collector: the cathodes of the red LED D24 and the IR LED IR1"
  LCD_SCK: "LCD connector SCK, from GPIO13 through R17 0R; C10 (NC) to GND"
  LCD_VLED: "LCD backlight supply: U4 SGM2578 output to the FPC VLED pin"
  LED1_A: "green LED1 anode, R39 2K from +5VOUT"
  LED_R_A: "red LED D24 anode, R30 300R from VBAT_OUT"
  LNA_IN: "U1 LNA_IN after L1, with C2 to GND"
  P1_5VIN: "STICKIO pin 8 (5VIN) to D2"
  Q1_B2: "Q1 pin 2 (base), R4 from RTS"
  Q1_B5: "Q1 pin 5 (base), R3 from DTR"
  Q2_B: "Q2 base after C12, D19 to GND"
  Q4_G: "Q4 gate: R24 to +VIN, pulled down by Q7 (HOLD), D22 (INT) and D23 (WAKE)"
  TIMER_IN: "U8 + input: R35 680K to +5VOUT, C25 to +5VOUT, R36 / D26 to WAKE, D27 to GND"
  TIMER_REF: "U8 - input: R37 / R38 10K divider of +5VOUT"
  TIMER_WAKE: "R36 270K to D26 anode"
  U0RXD: "U1 pin 40 (U0RXD/IO3) to R11 0R; the far side is URX"
  U0TXD: "U1 pin 41 (U0TXD/IO1) to R12 0R; the far side is UTX"
  U5_PROG: "U5 PROG, R26 3.3K to GND"
  U5_VCC: "U5 VCC, R21 0.8R from +5VIN, C14"
  USB_CC1: "J2 CC1, R18 5.1K to GND"
  USB_CC2: "J2 CC2, R20 5.1K to GND"
  USB_VBUS: "USB-C VBUS (J2 VCC) to the fuse F1"
  VDD_SDIO: "U1 VDD_SDIO and its capacitor C8"

aliases:   # a second vendor label on a net -> the label it is drawn under here
  "+3V3OUT": "+3.3V"
  GPIO25: GPI36
  HOLD: GPIO4
  RXD: UTX
  TXD: URX

rails:   # nominal: the voltage the net's name states, USB's 5 V, the boost's printed 5.3V,
         # the cell U5 (a Li-ion charger) charges, or the rail it follows
  USB_VBUS:
    nominal: "5 V"
    from: J2
    what: "USB-C VBUS (J2 VCC), before the fuse F1."
    pages: [1]
  VBUS:
    nominal: "5 V"
    from: F1
    what: "USB VBUS after F1 (6V/1A/PPTC); test pad JP3. Feeds +5VIN through D15 (SS34) and the CH9102F through D29."
    pages: [1]
  CH9102_VBUS:
    nominal: "VBUS through D29"
    from: D29
    what: "U2 VDD5 and VBUS (pins 7, 8), from VBUS through D29 (1N4148WT); C9 10uF."
    pages: [1]
  "+VDD":
    nominal: "3.3 V"
    from: U2
    what: "U2's own regulator output V3 (pin 6), which also feeds its VIO (pin 5), with C7 and C34 100nF and the R14 pull-up of ~RST; up only while USB feeds VDD5 through D29. Nothing else feeds it on the drawing."
    pages: [1]
  "+5VIN":
    nominal: "5 V"
    from: "D15, D2"
    what: "USB through D15, or the STICKIO header pin 8 (5VIN) through D2 (SS34). Feeds the charger U5 (through R21), the Q3 gate and, through D21, VBAT_OUT."
    pages: [1, 2]
  VBAT_IN:
    nominal: "Li-ion cell"
    from: "J3, U5"
    what: "Battery connector J3 (pin 2); charged by U5 TP4057 from +5VIN (R26 3.3K on PROG). Feeds Q3, the RTC U9, the GPI38 divider and STICKIO pin 6 (BAT)."
    enable: "U5 has no enable pin on the drawing"
    pages: [1, 2]
  "+VIN":
    nominal: VBAT_IN
    from: Q3
    what: "Q3 LP3218DT1G from VBAT_IN; its gate sits on +5VIN (R28 100K to GND)."
    enable: "Q3 conducts while +5VIN is low"
    pages: [2]
  VBAT_OUT:
    nominal: "VBAT_IN or +5VIN"
    from: "Q4, D21"
    what: "Q4 LP3218DT1G from +VIN, or +5VIN through D21 (SS34). The system supply: U6, U7, the red LED and the IR LED."
    enable: "Q4 gate (R24 100K to +VIN) pulled low by Q7 (GPIO4/HOLD), the power key through D23 (WAKE) or the RTC INT through D22"
    pages: [2]
  BOOST_IN:
    nominal: VBAT_OUT
    from: R22
    what: "U6 IN and EN, from VBAT_OUT through R22 0R; L2 1.5uH, C18 22uF, C19 1uF."
    pages: [2]
  BOOST_OUT:
    nominal: "5.3 V"
    from: U6
    what: "U6 SY7088 boost; \"5.3V\" printed on its output; R25 160K / R27 47K on FB, the drawing prints Vout = 1.2V*(R1/R2+1); C17 22uF."
    enable: "EN tied to IN (always on)"
    pages: [2]
  "+5VOUT":
    nominal: "5 V"
    from: D20
    what: "BOOST_OUT through D20 (SS34). Feeds the Grove port J1, the STICKIO header, the 4-pin header P2 and the power-off timer U8."
    pages: [1, 2]
  "+3.3V":
    nominal: "3.3 V"
    from: U7
    what: "U7 SY8089 buck from VBAT_OUT through L3 4.7uH; R32 68K / R33 15K on FB; C21 22uF, C22 100nF. Also drawn as +3V3OUT. Supplies the ESP32, the LCD, the IMU, the microphone, the I2C pull-ups and the buzzer."
    enable: "3V3EN: U7 EN, R31 150K from VBAT_OUT, driven by the U8 output"
    pages: [1, 2, 3]
  LCD_VLED:
    nominal: "+3.3V, switched"
    from: U4
    what: "U4 SGM2578 load switch from +3.3V to the LCD backlight (FPC pin 8)."
    enable: "U4 EN = GPIO27"
    pages: [1]

i2c:
  bus: {sda: "GPIO21 (U1 pin 42)", scl: "GPIO22 (U1 pin 39)", pullups: "R13 (SDA) and R10 (SCL), 2.2KΩ to +3.3V"}
  devices:
    - {ref: U10, part: MPU-6886, address: "0x68", source: "printed on page 3: I2C Addr(7-bit) : 0x68"}
    - {ref: U9, part: RTC8563, address: "0x51", source: "not printed: K1, the BM8563 datasheet V1.1 (write address A2h), the RTC the vendor's docs name; the bench scan of 2026-11-17 found only 0x51 and 0x68"}
  also_on_bus: P2 pins 1 (SCL) and 2 (SDA), the 4-pin header

esp32_gpio:   # GPIO -> module pin, net, what it does (U1)
  GPIO0: {pin: 23, net: GPIO0, what: "boot strap (R8 10K to +3.3V); microphone clock (U11 CLK); STICKIO pin 5 (G0); Q1 auto-reset (strapping pin)"}
  GPIO1: {pin: 41, net: U0TXD, what: "UART0 TX through R12 0R to the CH9102F RXD (net UTX)"}
  GPIO2: {pin: 22, net: GPIO2, what: "buzzer: R19 470R and C12 10uF to the Q2 base (strapping pin)"}
  GPIO3: {pin: 40, net: U0RXD, what: "UART0 RX through R11 0R from the CH9102F TXD (net URX)"}
  GPIO4: {pin: 24, net: GPIO4, what: "HOLD: Q7 gate, R34 100K to GND; keeps VBAT_OUT on"}
  GPIO5: {pin: 34, net: GPIO5, what: "LCD CS (strapping pin)"}
  GPIO6: {pin: 31, net: "NC"}
  GPIO7: {pin: 32, net: "NC"}
  GPIO8: {pin: 33, net: "NC"}
  GPIO9: {pin: 28, net: "NC"}
  GPIO10: {pin: 29, net: "NC"}
  GPIO11: {pin: 30, net: "NC"}
  GPIO12: {pin: 18, net: GPIO12, what: "LCD RST; strapping pin MTDI (internal pull-down), which must be low at reset so that VDD_SDIO is 3.3 V for the in-package flash and PSRAM (K12)"}
  GPIO13: {pin: 20, net: GPIO13, what: "LCD SCK through R17 0R"}
  GPIO14: {pin: 17, net: GPIO14, what: "LCD D/C"}
  GPIO15: {pin: 21, net: GPIO15, what: "LCD MOSI, the panel's bidirectional data line: the panel answers reads on it (K15) (strapping pin)"}
  GPIO19: {pin: 38, net: GPIO19, what: "U1 pin 38 (net IO19_R) through R9 10R to the vendor net GPIO19: Q5 base (R29 100K to GND), driving the red LED D24 and the IR LED IR1"}
  GPIO20: {pin: 27, net: "NC"}
  GPIO21: {pin: 42, net: SDA, what: "I2C SDA (R13 2.2K to +3.3V): MPU-6886, RTC, header P2"}
  GPIO22: {pin: 39, net: SCL, what: "I2C SCL (R10 2.2K to +3.3V): MPU-6886, RTC, header P2"}
  GPIO25: {pin: 14, net: GPI36, what: "STICKIO pin 4, joined there with GPIO36 (labels GPIO25 and GPI36)"}
  GPIO26: {pin: 15, net: GPIO26, what: "STICKIO pin 3 (G26)"}
  GPIO27: {pin: 16, net: GPIO27, what: "LCD backlight switch U4 EN"}
  GPIO32: {pin: 12, net: GPIO32, what: "Grove J1 pin 2"}
  GPIO33: {pin: 13, net: GPIO33, what: "Grove J1 pin 1"}
  GPIO34: {pin: 10, net: GPI34, what: "microphone data (U11 DAT), R5 10K to +3.3V (input only)"}
  GPIO35: {pin: 11, net: GPI35, what: "R6 10K to +3.3V; D1 to WAKE: reads the power key (input only)"}
  GPIO36: {pin: 5, net: GPI36, what: "STICKIO pin 4 (G36), joined with GPIO25 (input only, no internal pull; no resistor pulls the net) (K13)"}
  GPIO37: {pin: 6, net: GPI37, what: "button S2, R1 10K to +3.3V, D8 ESD (input only)"}
  GPIO38: {pin: 7, net: GPI38, what: "battery voltage: R40 / R41 100K divider of VBAT_IN, C42 (input only)"}
  GPIO39: {pin: 8, net: GPI39, what: "button S1, R2 10K to +3.3V, D5 ESD (input only)"}

