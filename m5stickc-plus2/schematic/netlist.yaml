kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. A bench path is under this folder; the datasheets are cited in full under source.also_read
  # and in README.md ("Kleidos additions and corrections"); improvements.md holds the triage.
  - id: K1
    kind: addition
    what: "The RTC U9 answers at I2C address 0x51 (write A2h)."
    element: {i2c: U9}
    source:
      type: datasheet
      cite: "BM8563 datasheet V1.1, p. 1 (write A2h); bench/2026-11-17-i2c-scan.md"
  - id: K2
    kind: addition
    what: "+VDD: U2's own 3.3 V regulator output V3; USB only."
    element: {rail: "+VDD"}
    source:
      type: datasheet
      cite: "CH9102 datasheet 1C, pp. 2, 4-5 (V3, supply schemes)"
  - id: K3
    kind: correction
    what: "U2's pins: the CH9102F's names (V3, VDD5, ACT#, GPIO0-4)."
    vendor: "the CP2104's pin names (VDD, REGIN, GPIO.0-3, VPP)"
    element: {part: U2}
    source:
      type: datasheet
      cite: "CH9102 datasheet 1C, pp. 2-4, QFN24 pin table"
  - id: K4
    kind: addition
    what: "U2 RST has a built-in pull-up, beside R14."
    element: {net: CH9102_RST}
    source:
      type: datasheet
      cite: "CH9102 datasheet 1C, p. 3, pin 9"
  - id: K5
    kind: addition
    what: "U2 RXD (on UTX) has a built-in pull-up."
    element: {net: UTX}
    source:
      type: datasheet
      cite: "CH9102 datasheet 1C, p. 3, pin 20"
  - id: K6
    kind: addition
    what: "U2 VBUS has a built-in pull-down."
    element: {net: CH9102_VBUS}
    source:
      type: datasheet
      cite: "CH9102 datasheet 1C, p. 3, pin 8"
  - id: K7
    kind: addition
    what: "VDD_SDIO is U1's 3.3 V output to its flash and PSRAM."
    element: {net: VDD_SDIO}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 4 p. 19, Table 17 p. 37, Figure 12 note p. 53"
  - id: K8
    kind: addition
    what: "U1 pin 28 (IO9) is the in-package PSRAM's CS."
    element: {pin: U1.28}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 5 p. 21"
  - id: K9
    kind: addition
    what: "U1 pin 29 (IO10) is the in-package PSRAM's CLK."
    element: {pin: U1.29}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 5 p. 21"
  - id: K10
    kind: addition
    what: "U1 pin 30 (IO11) is the in-package flash's CS."
    element: {pin: U1.30}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 5 p. 21"
  - id: K11
    kind: addition
    what: "U1 pin 31 (IO6) is the in-package flash's CLK."
    element: {pin: U1.31}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 5 p. 21"
  - id: K12
    kind: addition
    what: "MTDI (GPIO12) must be low at reset: 3.3 V VDD_SDIO."
    element: {gpio: GPIO12}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 8 p. 23, §3.2 p. 25, Figure 12 note p. 53"
  - id: K13
    kind: addition
    what: "GPIO36 has no internal pull; no resistor pulls GPI36."
    element: {gpio: GPIO36}
    source:
      type: datasheet
      cite: "ESP32-PICO datasheet v1.5, Table 4 notes p. 18"
  - id: K14
    kind: addition
    what: "INT: U9's open-drain, active-low output (R23 pull-up)."
    element: {net: INT}
    source:
      type: datasheet
      cite: "BM8563 datasheet V1.1, p. 2, pin 3 INT"
  - id: K15
    kind: addition
    what: "GPIO15 (LCD pin 4) is the panel's bidirectional SDA."
    element: {net: GPIO15}
    source:
      type: bench
      cite: "bench/2026-11-17-panel-readback-spird.md, 2026-11-17"
