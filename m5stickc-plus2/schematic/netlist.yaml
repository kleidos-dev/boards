    value: "MPU-6886"
    page: 3
    pins:
      "8": "+3.3V"   # VDDIO
      "9": GND   # AD0/SDO
      "10": IMU_REGOUT   # REGOUT
      "11": "NC"   # FSYNC
      "12": "NC"   # INT
      "13": "+3.3V"   # VDD
      "18": GND   # GND
      "22": "+3.3V"   # CS
      "23": SCL   # SCL/SCLK
      "24": SDA   # SDA/SDI
  U11:
    value: "SPM1423HM4H-B"
    page: 3
    pins:
      "1": GND   # GND
      "2": GND   # SELECT
      "3": GND   # GND
      "4": GPIO0   # CLK
      "5": GPI34   # DAT
      "6": "+3.3V"   # 3V3
  Y1:
    value: "32.768KHz ±20ppm 12.5pF"
    page: 2
    pins:
      "1": OSCO
      "2": OSCI

