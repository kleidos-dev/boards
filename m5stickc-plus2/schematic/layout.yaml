    description: ESP32-PICO-V3-02 SiP module (the pins the vendor draws)
    left: ["1 VDDA", "43 VDDA", "46 VDDA", "3 VDDA3P3", "4 VDDA3P3", "37 VDD3P3_CPU", "19 VDD3P3_RTC",
           "26 VDD_SDIO", "-", "2 LNA_IN", "-", "9 EN", "-", "27 IO20", "28 SD2/IO9/NC", "29 SD3/IO10/NC",
           "30 CMD/IO11/NC", "31 CLK/IO6/NC", "32 SD0/IO7", "33 SD1/IO8"]
    bottom: ["49 GND"]
    right: ["23 IO0", "41 U0TXD/IO1", "22 IO2", "40 U0RXD/IO3", "24 IO4", "34 IO5", "18 MTDI/IO12",
            "20 MTCK/IO13", "17 MTMS/IO14", "21 MTDO/IO15", "38 IO19", "42 IO21", "39 IO22", "14 IO25",
            "15 IO26", "16 IO27", "12 32K_XP/IO32", "13 32K_XN/IO33", "10 VDET_1/I34", "11 VDET_2/I35",
            "5 SENSOR_VP/I36", "6 SENSOR_CAPP/I37", "7 SENSOR_CAPN/I38", "8 SENSOR_VN/I39"]
  CH9102F:
    short: USB-UART bridge
    description: USB to UART bridge (pin names from the CH9102 datasheet, K3)
    left: ["5 VIO", "6 V3", "7 VDD5", "8 VBUS", "9 RST", "-", "3 UD+", "4 UD-", "-", "1 RI"]
    right: ["23 DTR", "19 RTS", "21 TXD", "20 RXD", "24 DCD", "22 DSR", "18 CTS", "17 SUSPEND",
            "15 SUSPEND#", "16 GPIO4", "14 TXS/GPIO0", "13 RXS/GPIO1", "12 TNOW/GPIO2", "11 WAKEUP/GPIO3",
            "10 ACT#"]
    bottom: ["2 GND"]
  FPC_8P:
    short: LCD connector
    ref: U
    description: LCD flexible-cable connector, 8 contacts (FPC-0.5-8P)
    left: ["2 VCC", "8 VLED", "1 CS", "3 SCK", "4 MOSI", "5 D/C", "6 RST"]
    bottom: ["7 GND"]
  SGM2578:
    short: Load switch
    description: Load switch
    left: ["A2 VIN", "B2 EN"]
    right: ["A1 VOUT"]
    bottom: ["B1 GND"]
  TP4057:
    short: Li-ion charger
    description: Li-ion linear charger
    left: ["4 VCC", "6 PROG"]
    right: ["3 BAT", "1 ~{CHRG}", "5 ~{STDBY}"]
    bottom: ["2 GND"]
  SY7088:
    short: Boost converter
    description: Synchronous boost converter
    left: ["6 IN", "3 EN", "1 LX", "2 LX"]
    right: ["7 OUT", "8 OUT", "5 FB"]
    bottom: ["4 GND", "9 PGND"]
  SY8089:
    short: Buck converter
    description: Synchronous buck converter
    left: ["4 IN", "1 EN"]
    right: ["3 LX", "5 FB"]
    bottom: ["2 GND"]
  GS321:
    short: Op-amp as comparator
    description: Single op-amp, used as a comparator
    left: ["5 V+", "-", "1 +", "3 -"]
    right: ["4 OUT"]
    bottom: ["2 V-"]
  RTC8563:
    short: Real-time clock
    description: Real-time clock (BM8563 in the vendor's docs)
    left: ["8 VDD", "-", "1 OSCI", "2 OSCO"]
    right: ["6 SCL", "5 SDA", "3 INT", "7 CLKOUT"]
    bottom: ["4 VSS"]
  MPU-6886:
    short: 6-axis IMU
    description: 6-axis IMU
    left: ["13 VDD", "8 VDDIO", "22 CS", "9 AD0/SDO"]
    right: ["23 SCL/SCLK", "24 SDA/SDI", "12 INT", "11 FSYNC", "10 REGOUT"]
    bottom: ["18 GND"]
  SPM1423HM4H-B:
    short: PDM microphone
    description: Digital (PDM) MEMS microphone
    left: ["6 3V3", "2 SELECT"]
    right: ["4 CLK", "5 DAT"]
    bottom: ["1 GND", "3 GND"]
  USB_TYPEC_9:
    short: USB-C receptacle
    ref: J
    description: USB-C receptacle, as the vendor draws it (9 pins)
    pin_length: 5.08
    left: ["A6 DP1", "B6 DP2", "A7 DN1", "B7 DN2"]
    right: ["VBUS VCC", "A5 CC1", "B5 CC2"]
    bottom: ["GND GND", "SHELL SHELL"]
  LMBT3904DW1T1G:
    short: Dual NPN transistor
    kind: mosfet_pair
    ref: Q
    description: Dual NPN transistor (unit A pins 3, 4, 5; unit B pins 1, 2, 6), as the vendor draws it
    units:
