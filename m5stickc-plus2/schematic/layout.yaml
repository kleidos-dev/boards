#
# How the M5StickC Plus2 schematic is drawn: the symbol each part takes, our own
# symbols, and the sheets, blocks and rows the parts sit in. The facts (values,
# pins, nets) are in netlist.yaml; _shared/kicad_schematic.py joins the two.
#
# parts: a part takes the symbol its prefix names under _by_prefix unless it has
# a row of its own. "pins" maps our symbol's pin number to the vendor's pin
# (a list when one of our pins stands for several of the vendor's, "-" when the
# vendor has no such pin). "angle" turns the symbol (90: a vertical two-pin part
# lies flat).
# rows: each row of a block is laid left to right; an item is a reference
# ("Q1:A" for one unit), {col: [...]} for a column of two-pin parts,
# {cols: [[...], [...]]} for several, or {text: ...}.
# sheets: "summary" and "parts" fill the sheet's box on the contents page; a
# sheet with "index" (power, nets, parts) is a page of tables the generator
# writes from netlist.yaml, after the drawing.
# root: the contents page's heading and the panels of its right-hand column;
# revisions: the history the contents page prints (the last one is in every
# title block). short: what a part is, in the parts list and the power tree.
# power tree: its boxes, [column, row], and arrows, each a connection
# netlist.yaml has (the generator refuses any other); "NET@x" draws a net twice.

paper: A3
title_block:
  title: M5StickC Plus2 (K016-P2)
  company: "Kleidos boards: connectivity documented from the vendor's public documentation"
  comments:
    - "Sources: M5Stack M5StickC Plus2 schematic v0.5 and docs; README.md"
    - "Values as documented. Layout and symbols: Kleidos boards"

revisions:
  - {rev: 1, date: "2026-11-17", change: "First drawing: every part, pin and net of the vendor's schematic v0.5, with the contents page, page/zone links, power tree, nets and signals, parts list and DNP marks."}
  - {rev: 2, date: "2026-11-17", change: "Kleidos additions and corrections K1-K15, listed above; +VDD in the power tree."}
  - {rev: 3, date: "2026-11-17", change: "An entry is marked wherever an index page shows its element again; a pin on no net says what it is on the nets page; the title block says the drawing carries entries."}
  - {rev: 4, date: "2026-11-19", change: "The Kleidos drawing sheet, its mark in the title block."}

