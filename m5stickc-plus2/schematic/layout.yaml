      - {type: NPN, b: "2", c: "6", e: "1"}
  BUZZER:
    short: Buzzer
    ref: LS
    description: Buzzer (KLJ-5025 in the PDF's part properties), pins as the vendor numbers them
    left: ["1", "2"]
  ANTENNA:
    short: PCB antenna
    ref: E
    description: PCB antenna, as the vendor draws it (feed and ground)
    left: ["2 GND"]
    right: ["1 FEED"]
  STICKIO:
    short: STICKIO header
    ref: P
    description: 8-pin top header (STICKIO)
    left: ["1 GND", "2 5VOUT", "3 G26", "4 G36", "5 G0", "6 BAT", "7 3V3", "8 5VIN"]

root:
  title: Contents
  heading: "M5StickC Plus2 (K016-P2) schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page numbers at the bottom right of
        every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width. A dot joins lines; a cross on a pin
        end means the pin is not connected. Pins connect by net labels (the boxed names): pins whose labels
        carry the same name are on one net, on any page. [3/C4] after a label: page 3 carries that net too,
        its label in zone C4 (column 4, row C of the border). Click it to land on that label. No [page/zone]:
        the net is on this page only. Click a part's reference to find its row in the parts list; the row's
        page/zone leads back. A part crossed out in red is not fitted (DNP). White: parts and their
        references. Grey: values, pin names, pin numbers. A dashed frame is a block of the circuit, titled
        at its top left. An amber K3 marks a Kleidos addition or correction: it leads to its row below.
    - title: Notes
      text: |
        Every part, pin and net of the M5StickC Plus2, with the values the vendor documents: connectivity
        documented from the vendor's public documentation, with Kleidos additions and corrections listed on
        page 1 (M5Stack's M5StickC Plus2 schematic v0.5 and its docs page, cited in README.md and
        netlist.yaml beside this file). Layout and symbols are this project's. No footprints, no PCB, no part
        numbers beyond the documented ones. Values are as the vendor prints them (10KΩ, 22R/1%). A value of
        NC means not fitted: those parts are marked DNP. Reference designators are the vendor's, not
        renumbered. Nets the vendor left unnamed carry names of ours (LNA_IN, Q4_G...). Some nets carry two
        vendor labels and are drawn under one: GPI36 (also GPIO25), GPIO4 (also HOLD), UTX (also RXD), URX
        (also TXD) and +3.3V (also +3V3OUT). Zones: columns 1-8 and rows A-F, 50 mm apart, printed in the
        border.

sheets:
  - file: soc.kicad_sch
    name: ESP32-PICO-V3-02
    summary: "The ESP32-PICO-V3-02 module with its supply decoupling, antenna and matching, reset, boot strap and pull-ups, the I2C pull-ups, the UART and IR series resistors, and buttons A and B."
    parts: "U1 ESP32-PICO-V3-02, E1 antenna, S1 S2 buttons"
    blocks:
      - title: ESP32-PICO-V3-02
        rows:
          - [U1]
      - title: Antenna and matching
        rows:
          - [E1, {col: [L1, C1, C2]}]
      - title: Supply decoupling
        rows:
          - [{col: [C4, C5, C8]}]
      - title: Reset (EN)
        rows:
          - [{col: [R7, C6, C3]}]
      - title: Boot strap, pull-ups, power-key sense
        rows:
          - [{cols: [[R8, R5, R6, D1], [R10, R13]]}]
      - title: Series resistors (UART, IR)
        rows:
          - [{col: [R11, R12, R9]}]
      - title: Buttons A (S2) and B (S1)
        rows:
          - [{cols: [[S2, S1], [R1, R2, D8, D5]]}]
  - file: usb_io.kicad_sch
    name: USB, display, buzzer, headers
    summary: "USB-C with its fuse, CC resistors and ESD diodes, the CH9102F USB-UART bridge and the DTR/RTS auto-reset, the test pads; the LCD connector and backlight switch, the buzzer, the STICKIO and 4-pin headers, the Grove port, and the rails' ESD diodes and bulk capacitors."
    parts: "J2 USB-C, U2 CH9102F, Q1 LMBT3904DW1T1G, JP1-JP5, U3 LCD connector, U4 SGM2578, LS1 buzzer, P1 STICKIO, P2, J1 Grove"
    blocks:
      - title: USB-C receptacle
        rows:
          - [J2, {cols: [[F1, R18, R20], [D17, D18, D15, D29]]}]
      - title: CH9102F USB-UART bridge
        rows:
          - [U2, {col: [C7, C34, C9, R14]}]
      - title: "Auto-reset: DTR / RTS to EN and GPIO0"
        rows:
          - ["Q1:A", "Q1:B", {col: [R3, R4]}]
      - title: Test pads
        rows:
          - [{col: [JP1, JP2, JP3, JP4, JP5]}]
      - title: LCD connector and backlight
        rows:
          - [U3, U4, {col: [R17, C10, C11, C13]}]
      - title: Buzzer
        rows:
          - [LS1, Q2, {cols: [[R16, D14, R19], [C12, D19]]}]
      - title: STICKIO header
        rows:
          - [P1, {col: [D2]}]
      - title: 4-pin header
        rows:
          - [P2]
      - title: Grove port
        rows:
          - [J1, {col: [D12, D13, D28, C38]}]
      - title: ESD diodes and bulk capacitors
        rows:
          - [{cols: [[D3, D4, D6, D7], [D9, D10, D11, D16], [C36, C37, C39, C40]]}]
  - file: power_path.kicad_sch
    name: Power path and charging
    summary: "The charger and the battery, the two P-MOSFET switches from the cell to the system rail, the power latch (HOLD), the power key and the RTC wake, the battery divider, and the red and IR LEDs."
    parts: "U5 TP4057, J3 battery, Q3 Q4 LP3218DT1G, Q7 SI2302, S3 power key, Q5 SS8050, D24 red LED, IR1"
    pwr_flags: [GND]
    blocks:
      - title: Charger
        rows:
          - [U5, {col: [R21, C14, R26, C20]}]
      - title: Battery
        rows:
          - [J3, {col: [C35]}]
      - title: Battery switch (Q3)
        rows:
          - [Q3, {col: [R28, C15]}]
      - title: System switch (Q4), power latch (Q7)
        rows:
          - [Q4, Q7, {cols: [[R24, R34], [C16, D21]]}]
      - title: Power key and RTC wake
        rows:
          - [S3, {col: [D23, D22, D25, R23]}]
      - title: Battery voltage (GPIO38)
        rows:
          - [{col: [R40, R41, C42]}]
      - title: Red LED and IR LED (GPIO19)
        rows:
          - [Q5, {cols: [[D24, R30, R29], [IR1, R15]]}]
  - file: rails.kicad_sch
    name: Regulators, power-off timer, RTC
    summary: "The 5 V boost and the 3.3 V buck from the system rail, the GS321 power-off timer that drives the buck's enable, and the real-time clock with its crystal."
    parts: "U6 SY7088, U7 SY8089, U8 GS321, LED1, U9 RTC8563, Y1 32.768 kHz"
    blocks:
      - title: 5 V boost
        rows:
          - [U6, {cols: [[R22, L2, C18, C19], [R25, R27, C17, D20]]}]
      - title: 3.3 V buck
        rows:
          - [U7, {cols: [[L3, R31, C23, C24], [R32, R33, C21, C22]]}]
      - title: Power-off timer (3V3EN)
        rows:
          - [U8, {cols: [[D26, R36, C25, R35, D27], [R37, R38, LED1, R39, C41]]}]
      - title: Real-time clock
        rows:
          - [U9, {col: [Y1, C26, C28, C27]}]
  - file: imu_mic.kicad_sch
    name: IMU and microphone
    summary: "The MPU-6886 IMU on the I2C bus, and the SPM1423 PDM microphone on GPIO0 (clock) and GPIO34 (data)."
    parts: "U10 MPU-6886, U11 SPM1423HM4H-B"
    blocks:
      - title: IMU
        rows:
          - [U10, {col: [C29, C30, C31, C32]}]
      - title: Microphone
        rows:
          - [U11, {col: [C33]}]
  - file: power.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from USB-C, the STICKIO 5VIN pin and the battery to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
    name: Nets and signals
    index: nets
    gpio_title: ESP32-PICO-V3-02 GPIO (U1)
    summary: "Every rail and every net drawn on more than one page, with the page/zone of its labels; the ESP32 GPIO, the I2C addresses, the test pads, every pull-up and pull-down."
  - file: parts.kicad_sch
    name: Parts
    index: parts
    summary: "Every part: its value as printed, what it is, its nets, whether it is fitted and where it is drawn. A reference on the drawing leads to its row, the row back to it."

