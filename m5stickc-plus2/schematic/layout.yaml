  note: "VBAT_OUT is drawn twice: the lower row starts from it. U5 charges VBAT_IN from +5VIN through R21. Q3's gate is +5VIN; Q4's gate is held off by R24 and pulled on by HOLD (Q7), the power key (D23) or the RTC (D22). U7's EN is 3V3EN, from the U8 timer. +VDD is the CH9102F's own 3.3 V (V3, K2), up only on USB: nothing else feeds it on the drawing."
