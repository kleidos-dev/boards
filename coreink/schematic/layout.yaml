root:
  title: Contents
  heading: "M5Stack CoreInk (K048) schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page numbers at the bottom right of
        every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width. A dot joins lines; a cross on a pin
        end means the pin is not connected. Pins connect by net labels (the boxed names): pins whose labels
        carry the same name are on one net, on any page. [3/C4] after a label: page 3 carries that net too,
        its label in zone C4 (column 4, row C of the border). Click it to land on that label. No [page/zone]:
        the net is on this page only. Click a part's reference to find its row in the parts list; the row's
        page/zone leads back. White: parts and their references. Grey: values, pin names, pin numbers.
        A dashed frame is a block of the circuit, titled at its top left. An amber K3 marks a Kleidos
        addition or correction: it leads to its row below; a dotted line is an added connection.
    - title: Notes
      text: |
        Every part, pin and net of the CoreInk, with the values the vendor documents: connectivity
        documented from the vendor's public documentation, with Kleidos additions and corrections listed
        on page 1 (M5Stack's one-page CoreInk schematic, coreink_sch.pdf, and its docs page; the datasheets
        and the Kleidos firmware each entry cites; README.md and netlist.yaml beside this file). Layout and
        symbols are this project's. No footprints, no PCB, no part numbers beyond the documented ones.
        Values are as the vendor prints them (10K/1%, 105/6.3V). No part on the print is marked not fitted.
        Reference designators are the vendor's, not renumbered. Where the print numbers no pins (passives,
        diodes, transistors, keys, antennas, the buzzer), the pin names are ours: 1/2, A/K, B/C/E, G/S/D.
        Nets the vendor left unnamed carry names of ours (U5_FB, EPD_SW...). The USB-UART bridge is the
        CP2104 the print shows; the docs say later units carry a CH9102, as the bench unit does (README.md).
        Zones: columns 1-8 and rows A-F, 50 mm apart, printed in the border.

sheets:
  - file: soc_usb.kicad_sch
    name: ESP32-PICO-D4 and USB
    summary: "The ESP32-PICO-D4 with its supply decoupling, the antenna's matching network, the antenna and the IPEX connector, the I2C pull-ups; the USB-C receptacle, the CP2104 USB to UART bridge and the auto-reset transistors on EN and GPIO0."
    parts: "U1 ESP32-PICO-D4, L1 C4 C6, ANT1, ANT2 IPEX, R26 R27, J2 USB-C, U2 CP2104-F03-GMR, Q2 Q3 S8050, D7"
    pwr_flags: [GND]
    blocks:
      - title: ESP32-PICO-D4
        rows:
          - [U1]
      - title: RF path
        rows:
          - [L1, {col: [C4, C6]}]
          - [ANT1, ANT2]
      - title: Supply decoupling
        rows:
          - [{cols: [[C46, C18, C10, C12], [C13, C14, C15, C16]]}]
      - title: I2C pull-ups
        rows:
          - [{col: [R26, R27]}]
      - title: USB-C
        rows:
          - [J2, {col: [R1, R4, R17, R18]}]
      - title: CP2104 USB to UART bridge
        rows:
          - [U2, {cols: [[C3, C5, R20], [R21, R22]]}]
      - title: Auto-reset (DTR, RTS)
        rows:
          - [Q2, Q3, D7]
          - [{cols: [[R29, C17, R28], [R30, R31]]}]
  - file: power.kicad_sch
    name: Power
    summary: "The 5 V inputs and their diodes, the charger and the battery, the battery switch and power hold, the battery voltage divider, the 5 V boost and the 3.3 V buck."
    parts: "D8-D11, FU1 PTC, U6 TP40P57 charger, LED1, J4 battery, Q4 SI2301, Q5 SI2302, D14 D19, U5 SY7088, U3 SY8089"
    blocks:
      - title: 5 V inputs and power path (PMU)
        rows:
          - [D8, FU1, {col: [C22]}]
          - [D9, D10, D11, {col: [C29]}]
      - title: Charger
        rows:
          - [U6, LED1, {col: [R34, R45, C23, C11]}]
      - title: Battery connector
        rows:
          - [J4]
      - title: Battery switch, power hold and battery voltage
        rows:
          - [Q4, {col: [R32, R36, R50]}, {col: [R41, R42, C30]}]
          - [Q5, D14, D19, {col: [R33, R51]}]
      - title: 5 V boost (SYS_P050)
        rows:
          - [U5, {cols: [[L2, C20, C21, R35], [R43, R44, C31]]}]
      - title: 3.3 V buck (MCU_VDD)
        rows:
          - [U3, {cols: [[L3, C19], [R39, R40, C28, C33]]}]
  - file: epd_expansion.kicad_sch
    name: E-paper and expansion
    summary: "The e-paper panel's 24-pin connector with its capacitors and the booster that makes its gate supplies VGG and VEE; the M5-Bus socket, the FPC to the HAT board, the Grove port, and the ESD arrays and 47R series resistors between the ESP32 and the M5-Bus."
    parts: "EPD1, L4, Q6 CJ2310, D15-D17, BUS1 M5-Bus, J1 FPC to HAT, J3 Grove, D1-D3 SRV05-4, R6-R16, R48 R49"
    blocks:
      - title: Panel connector
        rows:
          - [EPD1, {cols: [[C35, C36, C37, C38], [C39, C40, C41, C42]]}]
      - title: Gate-voltage booster (EPD BOOST)
        rows:
          - [L4, Q6, {col: [R46, R47, C34]}]
          - [D15, C43, D16, D17, {col: [C44, C45]}]
      - title: M5-Bus
        rows:
          - [BUS1]
      - title: FPC to HAT
        rows:
          - [J1]
      - title: Grove
        rows:
          - [J3, {col: [R48, R49]}]
      - title: ESD and series resistors
        rows:
          - [D1, {col: [R6, R7, R16]}, D2, {col: [R8, R9, R10, R11]}]
          - [D3, {col: [R12, R13, R14, R15]}]
  - file: hmi.kicad_sch
    name: Keys, RTC and buzzer
    summary: "The power and reset keys, the three-way dial, the BM8563 real-time clock with its crystal and alarm diodes, and the buzzer with its driver."
    parts: "S1 S2 keys, S3 K1-1502SA-02 dial, D5 D6, U4 BM8563, X1 32.768K, D12 D13, BZ1, Q1 S8050, D4 D18"
    blocks:
      - title: Power and reset keys
        rows:
          - [S1, D5, D6, {col: [R19, C2]}]
          - [S2]
      - title: Dial switch
        rows:
          - [S3, {cols: [[R25, R23, R24], [C9, C7, C8]]}]
      - title: Real-time clock
        rows:
          - [U4, X1, {cols: [[C25, C26, C27], [R37, R38]]}]
          - [D12, D13]
      - title: Buzzer
        rows:
          - [BZ1, Q1, {cols: [[R5, R2, R3], [C1]]}]
          - [D4, D18]
  - file: power_tree.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from the USB-C, the M5-Bus and HAT inputs and the battery to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
    name: Nets and signals
    index: nets
    gpio_title: ESP32-PICO-D4 GPIO (U1)
    summary: "Every rail and every net drawn on more than one page, with the page/zone of its labels; the ESP32-PICO-D4 GPIO, the I2C address and every pull-up and pull-down."
  - file: parts.kicad_sch
    name: Parts
    index: parts
    summary: "Every part: its value as printed, what it is, its nets, whether it is fitted and where it is drawn. A reference on the drawing leads to its row, the row back to it."

