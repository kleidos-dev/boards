#
# M5Stack CoreInk (K048): every component, every pin and the net it is on, as
# the vendor's published schematic shows them: connectivity documented from
# the vendor's public documentation, with Kleidos additions and corrections
# listed on page 1 (each an entry of "kleidos", below, with its source; the
# triage behind them is improvements.md). Facts only: what connects where and
# through what. The drawing in this folder (coreink.kicad_sch) is generated
# from this file; README.md says how, and how the two are checked against each
# other.
#
# Read from: the one printed page of the PDF below (an Altium print with no
# netlist in it), block by block. Each wire was followed on the page's vector
# drawing as well as by eye; values come from the printed page only.
#
# Conventions:
# - pins are the vendor's pin numbers. Where the print gives a part no pin
#   numbers (two-pin passives, diodes, transistors, switches, the antennas,
#   the buzzer, the USB-C's VCC, GND and SHELL), the pin names used here are
#   ours: "1"/"2" for a two-pin part (1 the end listed first in the part's
#   note, else the left or upper end as printed), A/K for a diode,
#   B/C/E and G/S/D for the transistors, as their symbols draw them;
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "named_here";
# - NC is a pin the schematic leaves unconnected (with or without its
#   no-connect cross);
# - "block" is the titled frame of the vendor's page the part sits in.

board: coreink
source:
  title: CoreInk schematic, one page (coreink_sch.pdf, M5Stack); no version or date printed on the sheet; the PDF was written on 2020-07-22
  url: https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/schematic/Core/coreink/coreink_sch.pdf
  listed_at: https://docs.m5stack.com/en/core/CoreInk
  read_from: https://web.archive.org/web/20251017235233id_/https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/schematic/Core/coreink/coreink_sch.pdf
  read_note: The vendor's host timed out from the machine that wrote this file; the Internet Archive's copy of 2025-10-17 was read, the same file board.json cites. The vendor's own CDN serves the same file (same SHA-256, checked 2026-11-17).
  also_served_at: https://static-cdn.m5stack.com/resource/docs/schematic/Core/coreink/coreink_sch.pdf
  sha256: 182ea9c6e90bdc7696aacb26db054a1f4125f7640aa505e3d9a2301163e334b5
  checked: 2026-11-17
  pages:
    1: "The whole board on one A4 page, in titled blocks: BUS, ESD, USB TYPE-C, FPC TO HAT, BUZZER, the ESP32-PICO-D4 (untitled), USB2UART, BUTTONS, PMU, CHARGER, PWR_SW&ADC, 5V DC-DC, 3.3V DC-DC, RTC, GROVE, the e-paper connector (untitled), EPD BOOST, BATTERY PORT"
  also_read:
    - url: https://docs.m5stack.switch-science.com/en/core/CoreInk
      mirror_of: https://docs.m5stack.com/en/core/CoreInk
      used_for: the PinMap (dial up/middle/down, user button, LED, buzzer, power hold, RTC, USB-UART), the battery (390mAh @ 3.7V), the input (5V @ 500mA), the two USB-UART versions (CP2104, CH9102)
      checked: 2026-11-17
    - url: https://static-cdn.m5stack.com/resource/docs/products/core/coreink/coreink_sch_01.webp
      used_for: the vendor's block diagram, the second image of the docs page's schematic section; it names the charger TP4057 and the module ESP32-PICO-D4, and carries no connectivity drawn here
      checked: 2026-11-17
    - url: https://www.espressif.com/sites/default/files/documentation/esp32-pico_series_datasheet_en.pdf
      used_for: "the Kleidos additions on U1 (kleidos, below): pins 44, 45, 47 and 48 (Table 2, NC), the in-package flash pins (Table 3), the strapping pins and their pulls at reset (Table 8, Section 3.2), the input-only pins (Table 2 and its notes), the RTC GPIOs (Table 2); version 1.5"
      checked: 2026-11-17
    - url: https://web.archive.org/web/2024id_/https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/core/BM8563_V1.1_cn.pdf
      used_for: the BM8563's I2C address (write 0xA2, read 0xA3), as board.json cites it (Kleidos addition K25)
      checked: 2026-11-16
    - url: https://web.archive.org/web/2024id_/https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/core/SY7088-Silergy.pdf
      used_for: the SY7088's 1.2 V feedback reference, which with R43 / R44 gives SYS_P050 (Kleidos addition K26), as board.json cites it
      checked: 2026-11-16
    - title: Kleidos firmware repository (read 2026-11-17)
      used_for: "behavior the firmware relies on and that works on the real board, cited by file path and symbol in the Kleidos additions: the panel's reads on GPIO23 (K17); second sources for the power key's deep-sleep wake on GPIO27 and the RTC alarm path on GPIO19"
      checked: 2026-11-17
    - url: https://docs.espressif.com/projects/esp-idf/en/stable/esp32/api-reference/system/sleep_modes.html
      used_for: "ESP-IDF's Sleep Modes (Espressif), for the ESP32: the ext0 and ext1 deep-sleep wake sources take RTC GPIOs only; any other GPIO wakes the chip from light sleep only (K16, K18)"
      checked: 2026-11-17

named_here:   # nets the print leaves unnamed: our name, and where the net is
  ANT_FEED: "L1 to ANT1, ANT2 and C6 (after the pi network)"
  BUZZER_AC: "R2 to C1 (the buzzer drive's coupling capacitor)"
  BUZZER_N: "BZ1's second pin, Q1 collector, D4 anode"
  BUZZER_P: "BZ1 +, R5, D4 cathode"
  D19_K: "D19 cathode to R51"
  EPD_PUMP: "C43 to D16 and D17 (the VEE charge pump)"
  EPD_SW: "L4, Q6 drain, C43, D15 (the booster's switch node)"
  EPD_VCOM: "EPD1 VCOM (24) and C41"
  EPD_VDD: "EPD1 VDD (18) and C37"
  EPD_VGH: "EPD1 VGH (5) and C36"
  EPD_VGL: "EPD1 VGL (4) and C35"
  EPD_VPP: "EPD1 VPP (19) and C38"
  EPD_VSH: "EPD1 VSH (20) and C39"
  EPD_VSL: "EPD1 VSL (22) and C40"
  LED1_A: "LED1 anode to R34"
  PWR_KEY: "S1 to the cathodes of D5 and D6"
  Q1_BASE: "Q1 base, C1, D18 cathode"
  Q2_BASE: "Q2 base to R30"
  Q3_BASE: "Q3 base to R31"
  Q3_C: "Q3 collector to D7 cathode"
  Q4_GATE: "Q4 gate, R32, R36"
  Q5_GATE: "Q5 gate, R33, R51, D14 cathode"
  RTC_INT: "U4 ~INT (3), R38, the cathodes of D12 and D13"
  RTC_OSCI: "U4 OSCI (1), X1, C26"
  RTC_OSCO: "U4 OSCO (2), X1, C27"
  U1_LNA_IN: "U1 LNA_IN (2), C4, L1"
  U1_VDD_SDIO: "U1 VDD_SDIO (26) and C16 only: the print does not join it to MCU_VDD"
  U2_DTR: "U2 DTR (23), Q3 emitter, R30"
  U2_RST: "U2 ~RST (9) and R20"
  U2_RTS: "U2 RTS (19), Q2 emitter, R31"
  U2_VDD: "U2 VDD (6) and VIO (5), C5, R20"
  U3_FB: "U3 FB (5), R39, R40"
  U3_SW: "U3 SW (3) and L3"
  U5_FB: "U5 FB (5), R43, R44"
  U5_LX: "U5 LX (1, 2) and L2"
  U6_CHRG: "U6 ~CHG (1) and the LED1 cathode"
  U6_PROG: "U6 PROG (6) and R45"
  USB_CC1: "J2 CC1 (A5) and R1"
  USB_CC2: "J2 CC2 (B5) and R4"
  USB_DM: "J2 DN1 and DN2 (A7, B7) and R18"
  USB_DP: "J2 DP1 and DP2 (A6, B6) and R17"
  VBAT_SW: "Q4 drain, R50, R41 (the switched battery)"

rails:   # nominal: the voltage the net's name states (5V, P050 = 5.0 V), USB's 5 V for
         # USB_5V (docs: input 5V @ 500mA), the cell the docs give for SYS_BAT, and the
         # block title "3.3V DC-DC" for MCU_VDD; blank where the print states none
  USB_5V:
    nominal: "5 V"
    from: J2
    what: "USB-C VCC. Feeds the CP2104 (VBUS, REGIN), D8 into EXT_5VI and D19 to the power hold."
  EXT_5VI:
    nominal: "5 V"
    from: "D8, BUS1, J1"
    what: "USB_5V through D8 1N5819, or 5 V fed in at the M5-Bus (BUS1 pin 3, 5VIN) or the HAT FPC (J1 pin 10)."
  CHG:
    nominal: ""
    from: FU1
    what: "EXT_5VI through FU1 (PTC 1A): the charger's input; also D9 into BST_IN and R34 to the charge LED."
  SYS_BAT:
    nominal: "3.7 V cell"
    from: J4
    what: "The battery (J4; 390mAh @ 3.7V per the docs), charged by U6 from CHG. Feeds the RTC, the boost through D10, Q4, the M5-Bus BAT pin and J1 pin 8."
  BST_IN:
    nominal: ""
    from: "D9, D10"
    what: "The boost's input: CHG through D9 1N5819, or SYS_BAT through D10 SS34."
  VBAT_SW:
    nominal: ""
    from: Q4
    what: "SYS_BAT through Q4 SI2301 while its gate is low; drives PS_EN through R50 10K and the battery divider R41 20K / R42 5.1K to GPIO35."
    enable: "Q4 gate: R32 100K to SYS_BAT, pulled low through R36 47R by PWR_TRIG (S1 through D6, GPIO12 or USB_5V through Q5, the RTC through D13)"
  SYS_P050:
    nominal: "5.0 V"
    from: U5
    what: "U5 SY7088 boost from BST_IN through L2 2.2UH; R43 15K / R44 4.7K on FB (5.03 V with the datasheet's 1.2 V reference, board.json). Feeds the 3.3 V buck and, through D11, EXT_5VO."
    enable: "PS_EN (U5 EN): R35 100K to GND, R50 10K from VBAT_SW"
  MCU_VDD:
    nominal: "3.3 V"
    from: U3
    what: "U3 SY8089 buck from SYS_P050 through L3 2.2UH (block \"3.3V DC-DC\"); R39 22K / R40 5.1K on FB. Supplies the ESP32-PICO-D4, the panel and its booster, the pull-ups, the ESD arrays, M5-Bus 3V3 and J1 pin 9."
    enable: "EN tied to IN (SYS_P050)"
  EXT_5VO:
    nominal: "5 V"
    from: D11
    what: "SYS_P050 through D11 1N5819. Grove 5V, M5-Bus 5VOUT, J1 pin 4 and the buzzer."
  U2_VDD:
    nominal: ""
    from: U2
    what: "CP2104 VDD (6), tied to VIO (5); C5 104/10V, R20 10K to ~RST."
  VGG:
    nominal: ""
    from: D15
    what: "Panel PREVGH (EPD1 pin 21): the booster's switch node EPD_SW through D15 1N5819; C45 105/25V."
  VEE:
    nominal: ""
    from: D17
    what: "Panel PREVGL (EPD1 pin 23): the C43 / D16 / D17 charge pump from EPD_SW; C44 105/25V."

i2c:
  bus: {sda: "GPIO21 (U1 pin 42)", scl: "GPIO22 (U1 pin 39)", pullups: "R26 (SDA) and R27 (SCL), 2.2K/1% to MCU_VDD"}
  devices:
    - {ref: U4, part: BM8563, address: "0x51", source: "BM8563 datasheet V1.1: write 0xA2, read 0xA3 (board.json); the docs' PinMap puts the RTC on G21/G22"}
  also_on_bus: M5-Bus pins 9 (G21/SDA) and 10 (G22/SCL) through R8 and R9 47R/1%; D2 holds both lines' ESD

esp32_gpio:   # module pin -> GPIO, net, what it does (U1). Strapping, input-only, RTC
              # and in-package flash pins per the ESP32-PICO datasheet v1.5; the roles per
              # the docs' PinMap; each such fact is a Kleidos addition (kleidos, below).
  GPIO0: {pin: 23, net: GPIO0, what: "EPD RST# (EPD1 pin 10); boot-mode strap, internal pull-up at reset: R28 2.2K/1% to MCU_VDD, pulled low through D7 by the auto-reset transistor Q3"}
  GPIO1: {pin: 41, net: GPIO1, what: "U0TXD, through R22 47R/1% to the CP2104's RXD (CP_RX)"}
  GPIO2: {pin: 22, net: GPIO2, what: "Buzzer: through R2 2.2K/1% and C1 to Q1's base; R3 5.1K/1% to GND; strap, internal pull-down at reset"}
  GPIO3: {pin: 40, net: GPIO3, what: "U0RXD, through R21 47R/1% from the CP2104's TXD (CP_TX)"}
  GPIO4: {pin: 24, net: GPIO4, what: "EPD BUSY (EPD1 pin 9)"}
  GPIO5: {pin: 34, net: GPIO5, what: "J1 pin 2, marked KEY: the user key, beyond J1; strap, internal pull-up at reset"}
  GPIO6: {pin: 31, net: "NC", what: "in-package flash CLK"}
  GPIO7: {pin: 32, net: "NC", what: "in-package flash WP/SIO2"}
  GPIO8: {pin: 33, net: "NC", what: "in-package flash SI/SIO0"}
  GPIO9: {pin: 28, net: GPIO9, what: "EPD CS# (EPD1 pin 12)"}
  GPIO10: {pin: 29, net: GPIO10, what: "J1 pin 1, marked LED: the status LED, beyond J1; green, lit when GPIO10 is low"}
  GPIO11: {pin: 30, net: "NC", what: "in-package flash HOLD/SIO3"}
  GPIO12: {pin: 18, net: GPIO12, what: "Power hold: through D14 to Q5's gate; MTDI strap, internal pull-down at reset, so VDD_SDIO is fed from VDD3P3_RTC (MCU_VDD)"}
  GPIO13: {pin: 20, net: GPIO13, what: "M5-Bus G13/RXD through R6 47R/1%; D1 ESD"}
  GPIO14: {pin: 17, net: GPIO14, what: "M5-Bus G14/TXD through R7 47R/1%; D1 ESD"}
  GPIO15: {pin: 21, net: GPIO15, what: "EPD D/C (EPD1 pin 11); MTDO strap, internal pull-up at reset"}
  GPIO16: {pin: 25, net: "NC", what: "in-package flash CS"}
  GPIO17: {pin: 27, net: "NC", what: "in-package flash SO/SIO1"}
  GPIO18: {pin: 35, net: GPIO18, what: "EPD SCK (EPD1 pin 13); M5-Bus G18/SCK through R10 47R/1%; D2 ESD"}
  GPIO19: {pin: 38, net: GPIO19, what: "RTC alarm: from U4 ~INT through D12; R37 10K/1% to MCU_VDD; not an RTC GPIO, so it cannot wake the ESP32 from deep sleep (the alarm switches the board on through D13)"}
  GPIO21: {pin: 42, net: GPIO21, what: "I2C SDA (BM8563); R26 2.2K/1% to MCU_VDD; M5-Bus G21/SDA through R8; D2 ESD"}
  GPIO22: {pin: 39, net: GPIO22, what: "I2C SCL (BM8563); R27 2.2K/1% to MCU_VDD; M5-Bus G22/SCL through R9; D2 ESD"}
  GPIO23: {pin: 36, net: GPIO23, what: "EPD MOSI (EPD1 pin 14), also carries the SSD1681 panel's reads (3-wire); M5-Bus G23/MOSI through R14 47R/1%; D3 ESD"}
  GPIO25: {pin: 14, net: GPIO25, what: "M5-Bus G25/IO and J1 pin 7 through R15 47R/1%; D3 ESD"}
  GPIO26: {pin: 15, net: GPIO26, what: "M5-Bus G26/IO and J1 pin 5 through R13 47R/1%; D3 ESD"}
  GPIO27: {pin: 16, net: GPIO27, what: "Power key S1 through D5, active low; R19 10K/1% to MCU_VDD, C2 105/6.3V; RTC_GPIO17, so it can wake the ESP32 from deep sleep (EXT0)"}
  GPIO32: {pin: 12, net: GPIO32, what: "Grove J3 pin 3 (IO1) through R48 47R/1%"}
  GPIO33: {pin: 13, net: GPIO33, what: "Grove J3 pin 4 (IO2) through R49 47R/1%"}
  GPIO34: {pin: 10, net: GPIO34, what: "M5-Bus G34/MISO through R12 47R/1%; D3 ESD (input only, no internal pull)"}
  GPIO35: {pin: 11, net: GPIO35, what: "Battery voltage: R41 20K/1% from VBAT_SW, R42 5.1K/1% to GND, C30 105/6.3V; ADC1_CH7 (input only, no internal pull)"}
  GPIO36: {pin: 5, net: GPIO36, what: "M5-Bus G36/27/AD and J1 pin 6 through R11 47R/1%; D2 ESD (input only, no internal pull)"}
  GPIO37: {pin: 6, net: GPIO37, what: "Dial up: S3 pin 1; R25 10K/1% to MCU_VDD, C9 (input only, no internal pull)"}
  GPIO38: {pin: 7, net: GPIO38, what: "Dial press: S3 pin T; R23 10K/1% to MCU_VDD, C7 (input only, no internal pull)"}
  GPIO39: {pin: 8, net: GPIO39, what: "Dial down: S3 pin 2; R24 10K/1% to MCU_VDD, C8 (input only, no internal pull)"}

pulls:   # every resistor with one end on a rail or ground and the other on a signal
  - {signal: USB_CC1, down: GND, via: R1, value: "5.1K/1%"}
  - {signal: GPIO2, down: GND, via: R3, value: "5.1K/1%"}
  - {signal: BUZZER_P, up: EXT_5VO, via: R5, value: "4.7R/1%"}
  - {signal: USB_CC2, down: GND, via: R4, value: "5.1K/1%"}
  - {signal: GPIO27, up: MCU_VDD, via: R19, value: "10K/1%"}
  - {signal: U2_RST, up: U2_VDD, via: R20, value: "10K/1%"}
  - {signal: GPIO38, up: MCU_VDD, via: R23, value: "10K/1%"}
  - {signal: GPIO39, up: MCU_VDD, via: R24, value: "10K/1%"}
  - {signal: GPIO37, up: MCU_VDD, via: R25, value: "10K/1%"}
  - {signal: GPIO21, up: MCU_VDD, via: R26, value: "2.2K/1%"}
  - {signal: GPIO22, up: MCU_VDD, via: R27, value: "2.2K/1%"}
  - {signal: GPIO0, up: MCU_VDD, via: R28, value: "2.2K/1%"}
  - {signal: MCU_RST, up: MCU_VDD, via: R29, value: "10K/1%"}
  - {signal: Q4_GATE, up: SYS_BAT, via: R32, value: "100K/1%"}
  - {signal: Q5_GATE, down: GND, via: R33, value: "10K/1%"}
  - {signal: LED1_A, up: CHG, via: R34, value: "2.2K/1%"}
  - {signal: PS_EN, down: GND, via: R35, value: "100K/1%"}
  - {signal: GPIO19, up: MCU_VDD, via: R37, value: "10K/1%"}
  - {signal: RTC_INT, up: SYS_BAT, via: R38, value: "10K/1%"}
  - {signal: U3_FB, up: MCU_VDD, via: R39, value: "22K/1%"}
  - {signal: U3_FB, down: GND, via: R40, value: "5.1K/1%"}
  - {signal: GPIO35, up: VBAT_SW, via: R41, value: "20K/1%"}
  - {signal: GPIO35, down: GND, via: R42, value: "5.1K/1%"}
  - {signal: U5_FB, up: SYS_P050, via: R43, value: "15K/1%"}
  - {signal: U5_FB, down: GND, via: R44, value: "4.7K/1%"}
  - {signal: U6_PROG, down: GND, via: R45, value: "5.1K/1%"}
  - {signal: EPD_GD, down: GND, via: R46, value: "10K/1%"}
  - {signal: EPD_IS, down: GND, via: R47, value: "0.47R/1%"}
  - {signal: PS_EN, up: VBAT_SW, via: R50, value: "10K/1%"}

kleidos:   # Kleidos additions to the vendor's print, each marked on the drawing and listed on page 1
  # (docs/models-and-drawings.md, "Schematics"; the triage behind them: improvements.md). "ESP32-PICO
  # v1.5" is Espressif's ESP32-PICO Series Datasheet v1.5 (also_read, above). Firmware
  # citations name a file of the Kleidos firmware repository and its symbol; second sources, kept off the
  # page-1 table for its length, are in the comment after a cite.
  - id: K1
    kind: addition
    what: "U1 pin 44, XTAL_N_NC: NC; not on the vendor's symbol."
    element: {pin: U1.44}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 15"
  - id: K2
    kind: addition
    what: "U1 pin 45, XTAL_P_NC: NC; not on the vendor's symbol."
    element: {pin: U1.45}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 15"
  - id: K3
    kind: addition
    what: "U1 pin 47, CAP2_NC: NC; not on the vendor's symbol."
    element: {pin: U1.47}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 15"
  - id: K4
    kind: addition
    what: "U1 pin 48, CAP1_NC: NC; not on the vendor's symbol."
    element: {pin: U1.48}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 15"
  - id: K5
    kind: addition
    what: "GPIO0 is the boot-mode strap: pulled up at reset."
    element: {gpio: GPIO0}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 8, p. 23"
  - id: K6
    kind: addition
    what: "GPIO2 is a strap: pulled down at reset."
    element: {gpio: GPIO2}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 8, p. 23"
  - id: K7
    kind: addition
    what: "GPIO5 is a strap: pulled up at reset."
    element: {gpio: GPIO5}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 8, p. 23"   # the key's level when pressed is open (README, Open questions; improvements.md T05, P05)
  - id: K8
    kind: addition
    what: "GPIO6 (CLK) is the in-package flash's clock."
    element: {gpio: GPIO6}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K9
    kind: addition
    what: "GPIO7 (SD0) is the in-package flash's WP/SIO2."
    element: {gpio: GPIO7}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K10
    kind: addition
    what: "GPIO8 (SD1) is the in-package flash's SI/SIO0."
    element: {gpio: GPIO8}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K11
    kind: addition
    what: "GPIO11 (CMD) is the in-package flash's HOLD/SIO3."
    element: {gpio: GPIO11}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K12
    kind: addition
    what: "GPIO12, MTDI strap: low at reset, so VDD_SDIO = VDD3P3_RTC."
    element: {gpio: GPIO12}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 8, Section 3.2"   # Table 8 p. 23, Section 3.2 p. 25; D14's anode on GPIO12 keeps the USB hold path (D19, R51) off the strap
  - id: K13
    kind: addition
    what: "GPIO15 is the MTDO strap: pulled up at reset."
    element: {gpio: GPIO15}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 8, p. 23"
  - id: K14
    kind: addition
    what: "GPIO16 is the in-package flash's chip select."
    element: {gpio: GPIO16}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K15
    kind: addition
    what: "GPIO17 is the in-package flash's SO/SIO1."
    element: {gpio: GPIO17}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K16
    kind: addition
    what: "GPIO19 is not an RTC GPIO, so it cannot wake deep sleep."
    element: {gpio: GPIO19}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 15; ESP-IDF Sleep Modes"   # also: Kleidos firmware, variants/m5core_ink/variant.h, BOARD_SLEEP_MODE_HOLD_RELEASE and its comment (the alarm switches the board on through D13 instead)
  - id: K17
    kind: addition
    what: "GPIO23 also carries the SSD1681 panel's reads (3-wire)."
    element: {gpio: GPIO23}
    source:
      type: firmware
      cite: "Kleidos firmware, src/hal/display/epaper_panel_driver.cpp: EpaperPanelDriver::makePanelReadDevice"   # also: EpaperPanelDriver::readPanelRegister, and display_hal_epaper.cpp readPanelRegister; panel RAM read back over SDA on the board (2026-07-14) and the SSD1681 identity on 2026-07-15
  - id: K18
    kind: addition
    what: "GPIO27 is RTC_GPIO17, so the power key can wake deep sleep."
    element: {gpio: GPIO27}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 14; ESP-IDF Sleep Modes"   # also: Kleidos firmware, src/hal/common/power_manager_core_ink.cpp (enablePinWakeup on kPinPowerButton) and variants/m5core_ink/variant.h, BOARD_SLEEP_MODE_HOLD_RELEASE (EXT0 wake on USB power)
  - id: K19
    kind: addition
    what: "GPIO34 is input only, with no internal pull."
    element: {gpio: GPIO34}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, pp. 13-14"
  - id: K20
    kind: addition
    what: "GPIO35 is input only, with no internal pull."
    element: {gpio: GPIO35}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, pp. 13-14"
  - id: K21
    kind: addition
    what: "GPIO36 is input only, with no internal pull."
    element: {gpio: GPIO36}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 13"   # Table 2's notes, p. 13: input-only pins have no pull-up or pull-down
  - id: K22
    kind: addition
    what: "GPIO37 is input only, with no internal pull."
    element: {gpio: GPIO37}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 13"
  - id: K23
    kind: addition
    what: "GPIO38 is input only, with no internal pull."
    element: {gpio: GPIO38}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 13"
  - id: K24
    kind: addition
    what: "GPIO39 is input only, with no internal pull."
    element: {gpio: GPIO39}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 13"
  - id: K25
    kind: addition
    what: "The BM8563 U4 answers at I2C address 0x51."
    element: {i2c: U4}
    source:
      type: datasheet
      cite: "BM8563 V1.1: write A2h, read A3h"   # also: Kleidos firmware, src/drivers/rtc/bm8563_regs.h, bm8563::kI2cAddress = 0x51 (works on the board)
  - id: K26
    kind: addition
    what: "SYS_P050 is 5.03 V: 1.2 V x (1 + 15K / 4.7K)."
    element: {rail: SYS_P050}
    source:
      type: datasheet
      cite: "SY7088: VOUT equation, 1.2 V VREF"
  - id: K27
    kind: addition
    what: "USB_5V is the 5 V @ 500 mA input the docs give."
    element: {rail: USB_5V}
    source:
      type: vendor-doc
      cite: "CoreInk docs page, specifications"
  - id: K28
    kind: addition
    what: "SYS_BAT is the 390 mAh 3.7 V cell the docs give."
    element: {rail: SYS_BAT}
    source:
      type: vendor-doc
      cite: "CoreInk docs page, specifications"
  - id: K29
    kind: addition
    what: "GPIO10's status LED is green, lit when GPIO10 is low."
    element: {gpio: GPIO10}
    source:
      type: bench
      cite: "bench/2026-11-17-led-and-user-key.md"   # the firmware drove GPIO10 low on its LED-on command (Kleidos firmware: PIN_STATUS_LED and STATUS_LED_ACTIVE_LOW in variants/m5core_ink/variant.h, statusLedOffLevel in src/hal/common/peripheral_switch.cpp) and the owner saw the LED lit, green, 2026-11-17

