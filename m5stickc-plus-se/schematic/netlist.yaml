unnamed_nets:   # nets the print draws but does not name, with the names used here
  RF_LNA: U1 pin 2 (LNA_IN), C2 and L1, the module side of the antenna match
  ANT_FEED: L1, C1 and the antenna E1
  AXP_LX1: U2 pin 45 (LX1) and L2
  AXP_BIAS: U2 pin 24 (BIAS) and R5
  AXP_VREF: U2 pin 25 (VREF) and C16
  AXP_VINT: U2 pin 26 (VINT) and C10
  RTC_OSCI: U4 pin 1 (OSCI), Y1 and C12
  RTC_OSCO: U4 pin 2 (OSCO), Y1 and C9
  BOOST_SW: U8 pin 1 (SW) and L4
  CH552_V33: U6 pin 20 (V33) and C25
  MOS1_G: the gate of MOS1, between R103 and R104
  MOS1_D: the drain of MOS1 and R108
  MOS2_G: the gate of MOS2, between R101 and R102
  MOS2_D: the drain of MOS2 and R109
  USB_CC1: J2 A5 (CC1) and R13
  USB_CC2: J2 B5 (CC2) and R19
  U1_VDD3P3_RTC: U1 pin 19 (VDD3P3_RTC) and C40; its wire crosses the VESP_3V3 bar with no junction dot
  U1_VDDA3P3_4: U1 pin 4 (VDDA3P3) and C43; its wire crosses the VESP_3V3 bar with no junction dot

rails:   # nominal: the voltage the net's name or the part states (3V3, 5V, -5.0), USB's 5 V;
         # where the print states none, the vendor's docs page or the AXP192's datasheet
         # (K4 to K8), or "not printed" (LDO1's output, RTC_VDD)
  VBUS_USB:
    nominal: "5 V"
    from: J2
    what: "USB-C VBUS (J2 VCC), C4 10uF; the AXP192's VBUS input (pin 31). Also the CH552T's supply (VCC pin 19, P3.2 pin 1, C27) and the gate dividers of MOS1 and MOS2 (R103/R104, R101/R102)."
  VBUS_VIN:
    nominal: "5 V (4.8-5.5 V)"
    from: PAD6
    what: "Pad PAD6 (VIN): the AXP192's ACIN input (pins 32, 33). The docs page limits VBUS_VIN and VBUS_USB to 4.8-5.5 V (K5)."
  VBAT_Li_Ion:
    nominal: "3.7 V, 120 mAh cell"
    from: J3
    what: "The battery connector (printed Li_Ion), C3 10uF; the AXP192's BAT pins (34, 35), whose TS pin (37) is on GND. The cell is the docs page's built-in 3.7 V 120 mAh lithium battery (K4)."
  VBAT_RTC:
    nominal: "backup cell"
    from: BAT1
    what: "BAT1 (DMS_3R3) on the AXP192's BACKUP input (pin 30)."
  IPSOUT:
    nominal: "input or cell"
    from: U2
    what: "AXP192 IPSOUT (pins 38, 39), its power-path output, with C24 and C30 100nF, C23 10uF, CX2 10uF/6.3V and C13 220nF (on APS). Feeds the AXP192's VIN1, VIN2, VIN3, LDOIN and APS, the SGM6603 boost U8 through L4, and R401."
  VESP_3V3:
    nominal: "3.3 V"
    from: U2
    what: "AXP192 DCDC1: LX1 (pin 45) through L2 2.2uH, sensed at DCDC1 (pin 47); C5 10uF and CX1 100uF/4V. Supplies the ESP32-PICO-D4, the pull-ups, the IR and red LEDs, the unfitted IMU footprint and pad PAD1 (3V3)."
  RTC_VDD:
    nominal: "not printed"
    from: U2
    what: "AXP192 LDO1 (pin 28), also on its SYSEN (pin 29); C11 1uF. Supplies the BM8563 (U4)."
  LCD_BL_VCC:
    nominal: "1.8-3.3 V, set over I2C"
    from: U2
    what: "AXP192 LDO2 (pin 12), C15 and C18 1uF. The LCD backlight (U5 LEDA); its voltage sets the brightness (K6)."
  LCD_LOGIC_VCC:
    nominal: "1.8-3.3 V, set over I2C"
    from: U2
    what: "AXP192 LDO3 (pin 11), C20 1uF. The LCD's logic supply (U5 VDD); its range is K7, and both M5Unified (src/utility/Power_Class.inl:1238 at 96576a1) and the Kleidos firmware (src/drivers/power/axp192.cpp, axp192::kLdo3Code3V0) set it to 3.0 V."
  MIC_VCC:
    nominal: "1.8-3.3 V, set over I2C"
    from: U2
    what: "AXP192 GPIO0 (pin 19) as LDOIO0, C8 1nF and C7 1uF. The microphone's supply (U3 VCC) (K8)."
  EXT_VDD:
    nominal: "5 V"
    from: U8
    what: "U8 SGM6603-5.0 boost (block 5VOUT_BOOST) from IPSOUT; C36 100nF, C45 and C46 10uF. The Grove port's 5 V (J1 pin 2, C37 10uF) and pad PAD7 (5VOUT)."
    enable: "EXT_BOOST_EN (AXP192 EXTEN, pin 40), R18 100K to GND"

i2c:
  bus: {sda: SYS_SDA (GPIO21), scl: SYS_SCL (GPIO22), pullups: "R4 (SDA) and R3 (SCL), 2.2K to VESP_3V3"}
  devices:
    - {ref: U2, part: AXP192, address: "0x34", source: "not printed: K23, M5Unified AXP192_Class.hpp DEFAULT_ADDRESS and the bench scan of 2026-11-17"}
    - {ref: U4, part: BM8563, address: "0x51", source: "not printed: K24, the BM8563 datasheet V1.1, p. 1 (write A2h, read A3h), and the bench scan of 2026-11-17"}
  also_on_bus: U7, the IMU footprint the SE leaves unfitted (pins 24 SDA, 23 SCL)
  interrupt: SYS_INT (GPIO35), the AXP192's IRQ (pin 48), R2 2.2K to VESP_3V3; also U7 pin 12

esp32_gpio:   # module pin -> GPIO, net, what it does (U1)
  GPIO0: {pin: 23, net: GPIO0, what: "boot strap: internal pull-up and R12 1K to VESP_3V3; low at reset (with GPIO2 low) enters download boot. Microphone CLK; MOS1 (USB auto-boot) through R108; PAD5 through R106"}
  GPIO1: {pin: 41, net: ESP32_U0TXD, what: "UART0 TX, to the CH552T through R25 100R"}
  GPIO2: {pin: 22, net: GPIO2, what: "PAD2; boot strap: internal pull-down, low at reset with GPIO0 low for download boot"}
  GPIO3: {pin: 40, net: ESP32_U0RXD, what: "UART0 RX, from the CH552T through R24 100R"}
  GPIO4: {pin: 24, net: "NC"}
  GPIO5: {pin: 34, net: LCD_CS, what: "LCD chip select; boot strap: internal pull-up (SDIO slave timing)"}
  GPIO6: {pin: 31, net: "NC"}
  GPIO7: {pin: 32, net: "NC"}
  GPIO8: {pin: 33, net: "NC"}
  GPIO9: {pin: 28, net: GPIO9, what: "IR LED LED1 cathode (lit while low); ESD D6"}
  GPIO10: {pin: 29, net: GPIO10, what: "red LED LED2 cathode (lit while low); ESD D7"}
  GPIO11: {pin: 30, net: "NC"}
  GPIO12: {pin: 18, net: "NC"}
  GPIO13: {pin: 20, net: LCD_SCK, what: LCD SPI clock}
  GPIO14: {pin: 17, net: "NC"}
  GPIO15: {pin: 21, net: LCD_MOSI, what: "LCD SPI data; boot strap MTDO: internal pull-up, low at reset silences the boot log"}
  GPIO16: {pin: 25, net: "NC"}
  GPIO17: {pin: 27, net: "NC"}
  GPIO18: {pin: 35, net: LCD_RST, what: "LCD reset; R14 5.1K to VESP_3V3"}
  GPIO19: {pin: 38, net: "NC"}
  GPIO21: {pin: 42, net: SYS_SDA, what: "I2C SDA (AXP192, BM8563)"}
  GPIO22: {pin: 39, net: SYS_SCL, what: "I2C SCL (AXP192, BM8563)"}
  GPIO23: {pin: 36, net: LCD_DC, what: LCD data/command (RS)}
  GPIO25: {pin: 14, net: GPIO25, what: PAD10}
  GPIO26: {pin: 15, net: GPIO26, what: "PAD9 through R105 22R; ESD D14"}
  GPIO27: {pin: 16, net: GPIO27, what: "AXP192 N_VBUSEN (pin 6), active low while REG30H bit 7 is 0: low (R21 10K to GND) lets VBUS in, high shuts it out"}
  GPIO32: {pin: 12, net: GPIO32, what: "Grove J1 pin 3; ESD D1"}
  GPIO33: {pin: 13, net: GPIO33, what: "Grove J1 pin 4; ESD D2"}
  GPIO34: {pin: 10, net: GPIO34, what: microphone DATA}
  GPIO35: {pin: 11, net: SYS_INT, what: "AXP192 IRQ (pin 48); R2 2.2K to VESP_3V3"}
  GPIO36: {pin: 5, net: GPIO36, what: "PAD4 through R107 22R; ESD D16. Input only, no internal pull; no resistor on the board pulls it"}
  GPIO37: {pin: 6, net: GPIO37, what: "button A (S3) to GND; R20 10K to VESP_3V3"}
  GPIO38: {pin: 7, net: GPIO38, what: "PAD3. Input only, no internal pull; nothing on the board pulls it"}
  GPIO39: {pin: 8, net: GPIO39, what: "button B (S2) to GND; R11 5.1K to VESP_3V3; ESD D8"}

pmic_gpio:   # AXP192 (U2) GPIOs as the print wires them ("AXP" keeps them apart from the ESP32's GPIO nets)
  AXP GPIO0: {pin: 19, net: MIC_VCC}
  AXP GPIO1: {pin: 18, net: "NC"}
  AXP GPIO2: {pin: 20, net: "NC"}
  AXP GPIO3: {pin: 41, net: "NC"}
  AXP GPIO4: {pin: 42, net: "NC"}

pulls:   # every resistor with one end on a rail or ground and the other on a signal
  - {signal: SYS_INT, up: VESP_3V3, via: R2, value: 2.2K}
  - {signal: SYS_SCL, up: VESP_3V3, via: R3, value: 2.2K}
  - {signal: SYS_SDA, up: VESP_3V3, via: R4, value: 2.2K}
  - {signal: AXP_BIAS, down: GND, via: R5, value: 200K}
  - {signal: ESP32_EN, up: VESP_3V3, via: R8, value: 5.1K}
  - {signal: GPIO39, up: VESP_3V3, via: R11, value: 5.1K}
  - {signal: GPIO0, up: VESP_3V3, via: R12, value: 1K}
  - {signal: USB_CC1, down: GND, via: R13, value: 5.1K}
  - {signal: LCD_RST, up: VESP_3V3, via: R14, value: 5.1K}
  - {signal: EXT_BOOST_EN, down: GND, via: R18, value: 100K}
  - {signal: USB_CC2, down: GND, via: R19, value: 5.1K}
  - {signal: GPIO37, up: VESP_3V3, via: R20, value: 10K}
  - {signal: GPIO27, down: GND, via: R21, value: 10K}
  - {signal: MOS2_G, up: VBUS_USB, via: R101, value: 1K}
  - {signal: MOS2_G, down: GND, via: R102, value: 1K}
  - {signal: MOS1_G, up: VBUS_USB, via: R103, value: 1K}
  - {signal: MOS1_G, down: GND, via: R104, value: 1K}
  - {signal: RTC_INT, up: IPSOUT, via: R401, value: 10K}

