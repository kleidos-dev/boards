#
# M5Stack StickC-Plus SE (K016-P-SE): every component, every pin and the net it
# is on, as the vendor's published schematic shows them, with the Kleidos
# additions and corrections listed under "kleidos" (each with its source,
# marked on the drawing and listed on page 1). Facts only: what connects where
# and through what. The drawing in this folder (m5stickc-plus-se.kicad_sch) is
# generated from this file; README.md says how, and how the two are checked
# against each other.
#
# Read from: the one printed page of the PDF below (a "Microsoft: Print To PDF"
# print, which carries no netlist), at 450 to 2400 dpi. Every connection and
# value here is what that page draws and prints, except the entries under
# "kleidos", each from a datasheet, the vendor's docs page or a bench record
# (source.also_read); nothing is taken from other boards.
#
# Conventions:
# - pins are the vendor's pin numbers where the print gives them; where it
#   gives none, they are ours: "1" and "2" for resistors, capacitors,
#   inductors, the crystal, the keys and the two-pin connectors (the order does
#   not matter; on the polarised capacitors CX1 and CX2, "1" is the +
#   terminal), "1" (cathode) and "2" (anode) for the diodes and LEDs, as
#   KiCad numbers them, "G", "D", "S" for the MOSFETs,
#   and the pin's printed name (VCC, GND, SHELL, PAD) where only a name is
#   printed;
# - net names are the vendor's; a net the print leaves unnamed gets a name of
#   ours, listed under "unnamed_nets";
# - NC is a pin the print leaves unconnected (a stub with nothing on it, or
#   crossed out);
# - two wires that cross without a junction dot are not connected: that is how
#   the print draws a crossing, and how it is read here (see U1 pins 4 and 19,
#   U6 pin 20);
# - "block" is the titled frame of the print the part sits in.

board: m5stickc-plus-se
