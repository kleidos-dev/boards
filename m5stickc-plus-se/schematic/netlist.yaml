kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1 (docs/models-and-drawings.md, "Schematics"). The documents are cited in full under
  # source.also_read, a bench path is under this folder, and README.md ("Kleidos additions and
  # corrections") gives each entry's second sources, kept off the page-1 table for its length;
  # improvements.md is the triage (T01-T33). K1 T04, K2 T11, K3 T12, K4 T13, K5 T14, K6-K8 T15,
  # K9 T17, K10-K15 T18, K16-K20 T19, K21-K22 T20, K23 T21, K24 T22, K25 T23, K26 T24, K27 T27,
  # K28 T28.
  - id: K1
    kind: correction
    what: "U6 pin 10 is P3.0."
    vendor: "P3.2, like pin 1"
    element: {pin: U6.10}
    source:
      type: datasheet
      cite: "CH552 V1G, section 4, p. 4, pin 10"
  - id: K2
    kind: correction
    what: "U5: ST7789V2 TFT, 135 x 240."
    vendor: "LCD"
    element: {part: U5}
    source:
      type: vendor-doc
      cite: "docs page (2026-11-17), LCD"
  - id: K3
    kind: correction
    what: "J1 is an HY2.0-4P port."
    vendor: "GROVE"
    element: {part: J1}
    source:
      type: vendor-doc
      cite: "docs page (2026-11-17), HY2.0-4P"
  - id: K4
    kind: addition
    what: "The cell on J3 is a 3.7 V 120 mAh lithium cell."
    element: {rail: VBAT_Li_Ion}
    source:
      type: vendor-doc
      cite: "docs page (2026-11-17), Battery"
  - id: K5
    kind: addition
    what: "VBUS_VIN (PAD6, ACIN): 5 V, limited to 4.8-5.5 V."
    element: {rail: VBUS_VIN}
    source:
      type: vendor-doc
      cite: "docs page (2026-11-17), Hat-Bus"
  - id: K6
    kind: addition
    what: "LCD_BL_VCC (LDO2): 1.8-3.3 V in 100 mV steps, over I2C."
    element: {rail: LCD_BL_VCC}
    source:
      type: datasheet
      cite: "AXP192 summary rev 1.0, p. 1"
  - id: K7
    kind: addition
    what: "LCD_LOGIC_VCC (LDO3): 1.8-3.3 V in 100 mV steps."
    element: {rail: LCD_LOGIC_VCC}
    source:
      type: datasheet
      cite: "AXP192 summary rev 1.0, p. 1"
  - id: K8
    kind: addition
    what: "MIC_VCC (LDOIO0): 1.8-3.3 V in 100 mV steps, over I2C."
    element: {rail: MIC_VCC}
    source:
      type: datasheet
      cite: "AXP192 summary rev 1.0, p. 1"
  - id: K9
    kind: correction
    what: "U1 pins 44, 45, 47, 48: NC."
    vendor: "omitted"
    element: {part: U1}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 2, p. 15"
  - id: K10
    kind: addition
    what: "IO6 (CLK) is the in-package flash's CLK."
    element: {pin: U1.31}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K11
    kind: addition
    what: "IO7 (SD0) is the in-package flash's WP/SIO2."
    element: {pin: U1.32}
    source:
      type: datasheet
      cite: "ESP32-PICO v1.5, Table 3, p. 16"
  - id: K12
