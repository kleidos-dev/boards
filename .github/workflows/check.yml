# SPDX-License-Identifier: MIT
#
# The repository's gate on every push and pull request, in two stages
# (the project's CI convention: cheap gates first, a failure skips what
# depends on it):
#
#   📋 What changed ─┬─ 🔨 Board models        (when a model's inputs changed)
#   🧪 Tree checks ──┼─ 🧪 Checker selftests   (when a checker changed)
#                    ├─ 🧫 Schematics          (unless only docs and models changed)
#                    └─ 📊 SonarCloud          (pushes to main, pull requests against it)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The checkers' planted-defect selftests, whatever changed: weekly, and on demand.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a push or a pull request touched, for the three heavy jobs below. A
  # scheduled or manual run, a push that opens a branch and anything git cannot
  # diff count as touching everything.
  changes:
    name: "📋 What changed"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      models: ${{ steps.paths.outputs.models }}
      checkers: ${{ steps.paths.outputs.checkers }}
      schematics: ${{ steps.paths.outputs.schematics }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # models and checkers are read by name, as ${!name}, in the loop at the end.
          # A model's inputs: its drawings, measurements, recipe and records,
          # the code that builds and checks it, the fonts, the pins, its tests.
          # shellcheck disable=SC2034
          models='^([^/]+/(model|svg)/|[^/]+/measurements\.json$|_shared/|fonts/|requirements\.txt$|tests/(conftest|test_board_model_legends|test_board_model_obj)\.py$|\.github/workflows/check\.yml$)'
          # The checkers the selftests plant defects in, and their fixtures.
          # shellcheck disable=SC2034
          checkers='^(_shared/[^/]+\.py$|_shared/fixtures/|requirements\.txt$|tests/(conftest|test_board_model_legends)\.py$|\.github/workflows/check\.yml$)'
          # Code under _shared/ that neither builds nor checks a model, and the KiCad kit.
          neither='^_shared/((kicad_schematic|export_schematic|check_schematic|check_schematic_links|schematic_pdf|check_board_specs|check_public_tree)\.py|kicad/.*)$'
          # The schematic job runs on any change but one that touches only
          # prose and the 3D models' sources and contact sheets: those reach no
          # schematic, so a docs-only change does not start KiCad.
          noschematic='(\.md$|^[^/]+/(model|svg)/|^(models|fronts)-contact-sheet\.)'
          if [[ "$EVENT" != push && "$EVENT" != pull_request ]] || [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] \
             || ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            printf '%s\n' models=true checkers=true schematics=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          relevant=$(printf '%s\n' "$changed" | grep -Ev "$neither" || true)
          for name in models checkers; do
            if printf '%s\n' "$relevant" | grep -Eq "${!name}"; then hit=true; else hit=false; fi
            echo "$name=$hit" | tee -a "$GITHUB_OUTPUT"
          done
          if printf '%s\n' "$changed" | grep -Evq "$noschematic"; then hit=true; else hit=false; fi
          echo "schematics=$hit" | tee -a "$GITHUB_OUTPUT"

  # The cheap gate every heavy job below waits for: licenses, the public
  # tree, the specifications, the embedded metadata and the tests but the
  # models'.
  check:
    name: "🧪 Tree checks and tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: Licenses (REUSE)
        run: reuse lint
      - name: No vendor file in the tree
        run: python3 _shared/check_public_tree.py
      - name: Board specifications
        run: python3 _shared/check_board_specs.py
      # Every drawing, model, schematic and picture against its metadata
      # record. The identity patterns come from the KLEIDOS_DENY_EXTRA secret;
      # until it is set the check warns and looks for the generic classes
      # only. Once it is, add --require-identity so a missing list fails.
      - name: Embedded metadata
        env:
          KLEIDOS_DENY_EXTRA: ${{ secrets.KLEIDOS_DENY_EXTRA }}
        run: python3 _shared/check_metadata.py
      # These tests run on every push and pull request, so their coverage
      # (.coveragerc) is the report SonarCloud reads: the model jobs are
      # skipped on some pushes, and a report from them would make main's
      # coverage depend on which jobs ran.
      - name: Tests, the board models' apart
        run: python3 -m pytest -rs -m "not models" --cov --cov-report=xml:coverage.xml tests
      - name: Hand the coverage report to the SonarCloud job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  # Every model held to what builds it as it is now: built from its drawings
  # and spec as they are, its legends where its drawings print them, its
  # materials at separate depths and within the readers' table, and its web
  # level the master less what a reader cannot see. On every push and pull
  # request that touches a model's inputs. The limit leaves room: the set took
  # 22 minutes in a Linux container on a developer's machine (2026-11-17).
  models:
    name: "🔨 Board models"
    needs: [changes, check]
    if: needs.changes.outputs.models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: Board models
        run: python3 -m pytest -rs -m "models and not selftest" tests

  # The checkers' own selftests: each plants defects in a model or a drawing
  # (a legend moved, a print on the wrong face, two materials at one depth)
  # and must catch every one, and the face fixture rebuilds byte for byte.
  # Slow (each planted defect is a whole placement of a board), so only when
  # a checker or its fixtures change, weekly and on demand.
  selftests:
    name: "🧪 Checker selftests"
    needs: [changes, check]
    if: needs.changes.outputs.checkers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install the pinned stack
        run: pip install -r requirements.txt
      - name: The checkers' selftests
        run: python3 -m pytest -rs -m selftest tests

  # Every schematic against its netlist.yaml: KiCad's ERC, the drawn netlist
  # pin for pin, the generator giving back the committed files, and every link
  # of the PDF (the committed one and a fresh export) leading where it should.
  # The image pins the KiCad the files were written with (10.0.8) and its
  # kicad-cli (no KiCad library is read); root, so the job can write the
  # checked-out tree. It brings its own Python and PyYAML (Debian's, not the versions
  # requirements.txt pins); pytest and pypdf are installed at the pinned ones.
  schematic:
    name: "🧫 Schematics (KiCad ERC, netlist, export)"
    needs: [changes, check]
    if: needs.changes.outputs.schematics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pytest and pypdf, as requirements.txt pins them
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          mapfile -t pins < <(grep -E '^(pytest|pypdf)==' requirements.txt)
          [[ ${#pins[@]} -eq 2 ]] || { echo "requirements.txt must pin pytest and pypdf"; exit 1; }
          python3 -m pip install --break-system-packages --root-user-action=ignore "${pins[@]}"
      - name: ERC and netlist check, every board with a schematic
        run: |
          set -euo pipefail
          for netlist in */schematic/netlist.yaml; do
            python3 _shared/export_schematic.py "${netlist%%/*}" --no-export
          done
      - name: The committed PDF's links, every board with a schematic
        run: |
          set -euo pipefail
          for netlist in */schematic/netlist.yaml; do
            python3 _shared/check_schematic_links.py "${netlist%%/*}" --list
          done
      # The export is reproducible in this container (fonts, objects, metadata,
      # trailer /ID), so the committed PDF must be its bytes: a schematic, theme
      # or metadata change that was not exported again fails here.
      - name: A fresh export (theme, line widths, links), byte for byte the committed PDF
        run: |
          set -euo pipefail
          for netlist in */schematic/netlist.yaml; do
            board="${netlist%%/*}"
            python3 _shared/export_schematic.py "$board" --out "$RUNNER_TEMP/export/$board"
            if ! cmp -s "$RUNNER_TEMP/export/$board/$board.pdf" "$board/schematic/$board.pdf"; then
              echo "::error file=$board/schematic/$board.pdf::not what a fresh export gives; run _shared/export_schematic.py $board in KiCad 10.0.8's container and commit the PDF"
              exit 1
            fi
          done
      - name: Schematic tests, the generator and the KiCad kit included
        run: python3 -m pytest -rs tests/test_schematic.py tests/test_kicad_kit.py

  # Every push to main and every pull request against it analysed on
  # SonarQube Cloud (sonar-project.properties), with the tree checks'
  # coverage. Secretless: the job trades its GitHub OIDC token for a
  # short-lived token scoped to this project, so no SONAR_TOKEN secret
  # exists. A pull request from a fork gets no OIDC token, so there the job
  # says so in a notice and analyses nothing.
  sonarcloud:
    name: "📊 SonarCloud"
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    # A bound for a hung scanner, with room for the scan to grow (15 minutes
    # is the owner's value in gitlab-mcp-server, where 5 cut off the upload).
    timeout-minutes: 15
    # It reads the coverage the tree checks wrote, and a red gate there stops
    # it from spending a runner.
    needs: [check]
    permissions:
      contents: read
      # The OIDC token the auth step exchanges for the SonarQube Cloud token.
      id-token: write
    env:
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    # No continue-on-error: on a push or a pull request from this repository,
    # a refused token exchange, a scanner error or an analysis the server
    # refuses is a red job, never a silent green.
    steps:
      - name: A pull request from a fork is not analysed
        if: env.FORK_PR == 'true'
        run: echo "::notice title=SonarCloud skipped::A pull request from a fork gets no GitHub OIDC token, so it cannot be analysed; its changes are analysed on main once merged."

      # Full history: blame and the new-code period need it. The checkout
      # leaves no git credential behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FORK_PR != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the coverage report
        if: env.FORK_PR != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # Exchanges the job's OIDC token for a 30-minute token that can only
      # analyse kleidos-dev_boards, and exports it as SONAR_TOKEN for the
      # steps below (masked in the logs).
      - name: SonarCloud token (secretless, OIDC)
        if: env.FORK_PR != 'true'
        id: auth
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      # The scanner detects the branch or pull request from the GitHub event;
      # sonar-project.properties holds the rest.
      - name: SonarCloud Scan
        if: env.FORK_PR != 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      # The scanner's success means the report was uploaded; whether the
      # server accepted it is decided afterwards by a Compute Engine task (a
      # broken report, a refused upload). This waits for that task and fails
      # the job unless it succeeded. The quality gate is not judged here:
      # SonarCloud's GitHub App reports it on the pull request.
      - name: SonarCloud accepted the analysis
        if: env.FORK_PR != 'true'
        timeout-minutes: 10
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          set -euo pipefail
          task="$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)"
          if [ -z "${task}" ]; then
            echo "::error::The scanner wrote no ceTaskId to .scannerwork/report-task.txt"
            exit 1
          fi
          while :; do
            body="$(curl --fail --silent --show-error --proto '=https' --max-redirs 0 \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/ce/task?id=${task}")"
            status="$(jq -r '.task.status' <<<"${body}")"
            case "${status}" in
              SUCCESS)
                echo "SonarCloud accepted analysis $(jq -r '.task.analysisId' <<<"${body}")"
                break
                ;;
              PENDING|IN_PROGRESS)
                sleep 5
                ;;
              *)
                reason="$(jq -r '.task.errorMessage // "no reason given"' <<<"${body}")"
                echo "::error::SonarCloud did not accept the analysis (${status}): ${reason}"
                exit 1
                ;;
            esac
          done
