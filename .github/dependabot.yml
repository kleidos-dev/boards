#
# Keeps the GitHub Actions this repository pins by commit and the Python
# stack pinned in requirements.txt current: at most one grouped pull request
# a week for each. Dependabot authors its own commit messages, so the
# commit-message gate skips its pull requests. The quality kit's workflow
# references and tool versions are not Dependabot's here: they move with the
# kit's sync (kleidos-dev/.github docs/quality.md, "Versions").
#
# requirements.txt holds every dependency with its hashes and no .in file,
# so each line is a direct pin here: Dependabot bumps every one of them,
# hashes included. A bump that needs a dependency the file lacks fails the
# hash-checked install in CI until the file is compiled again (the command
# is in its header).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is proposed only once it is a week old, so a compromised or
    # yanked version has time to be noticed first.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "kleidos-dev/.github*"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  # The hook revisions of .pre-commit-config.yaml, the kit's and third parties'.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "https://github.com/kleidos-dev/.github"
    ignore:
      # The kit's next major is taken by hand, with the fixes it asks for.
      - dependency-name: "https://github.com/kleidos-dev/.github"
        update-types: ["version-update:semver-major"]
      # crate-ci/typos also tags its sub-crates, which read as typos 5.x.
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">= 2"]
    groups:
      hooks:
        patterns: ["*"]
