#
# M5Stack Core2 v1.3 (K010-V13): every component, every pin and the net it is
# on, as the vendor's two published schematic sheets show them, with the
# Kleidos additions and corrections under "kleidos" (each with its source).
# Facts only: what connects where and through what. The drawing in this folder
# (m5stack-core2-v13.kicad_sch) is generated from this file; README.md says how,
# and how the two are checked against each other.
#
# Read from: the two printed sheets below (one A4 page each, printed to PDF, so
# they carry no netlist of their own), read block by block at 450 dpi.
#
# Conventions:
# - sheet: core or expansion (the two sources below); zone: the part's zone in
#   that sheet's own border grid (columns 1-4, rows A-D), where its designator
#   is printed;
# - pins are the vendor's pin numbers. Where the print numbers none: two-pin
#   parts (resistors, capacitors, inductors, keys, crystal X1, fuse) are 1 and
#   2 in an order of ours; diodes and the LED are A and K; transistors B, C, E;
#   the RTC cell 1 (+) and 2 (-); a named pin the print leaves unnumbered (EPAD, PAD,
#   GND_PAD, the USB-C VCC, GND and SHELL) keeps its printed name;
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "renamed";
# - NC is a pin the sheet leaves unconnected;
# - values are as printed (226/6.3V is 22 uF, 105 is 1 uF, 104 is 100 nF...);
#   DNP marks a part printed as not fitted;
# - the expansion sheet reuses designators the core sheet has, so its parts are
#   numbered +100 here (BUS1 -> BUS101, U1 -> U101, R1 -> R101...); its own net
#   names, where they differ from the core's, are under "aliases".

board: m5stack-core2-v13
source:
  core:
    title: CORE2_V1.0_SCH, Core2 core section schematic (one A4 sheet, printed 2020-07-07)
    url: https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/644/CORE2_V1.0_SCH.pdf
    listed_at: https://docs.m5stack.com/en/core/Core2_v1.3
    listed_as: Core2 v1.3 Core Section Schematics PDF
    read_from: https://web.archive.org/web/20260825073713/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/644/CORE2_V1.0_SCH.pdf
    read_note: The vendor host timed out from the machine that wrote this file on 2026-11-17; the Wayback Machine copy (captured 2026-08-25) was read instead.
    sha256: 4a59d16291c7de9d9deda31fe154c8b5ac3c8f92209f6f8206d72f97afeea94f
    pages:
      1: "Core board: PMU, MCU, BUS, ESD, USB, EXT.PORTA, EXT.BATT, USB2UART, SPEAKER, LED, VIB_MOTOR, 5V_BOOST, LCD, C-TP, test points, internal and external I2C pull-ups, FLASH, PSRAM, RTC, BUTTON, CARD"
  expansion:
    title: core2_v1.3_SCH, Core2 v1.3 expansion board schematic (one A4 sheet, printed 2025-11-14)
    url: https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/486/core2_v1.3_SCH_2025_11_14_09_40_33.pdf
    listed_at: https://docs.m5stack.com/en/core/Core2_v1.3
    listed_as: Core2 v1.3 Expansion Board Section Schematics PDF
    read_from: https://web.archive.org/web/20260717144432/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/486/core2_v1.3_SCH_2025_11_14_09_40_33.pdf
    read_note: The vendor host timed out from the machine that wrote this file on 2026-11-17; the Wayback Machine copy (captured 2026-07-17) was read instead.
    sha256: 7b5def96336139b8ff3b91871ffa476c9b8cd845725263db82e4a8ad8881cea9
    pages:
      1: "Expansion board: M5-Bus, BMI270 IMU, SPM1423 microphone"
  checked: 2026-11-17
  also_read:
    - url: https://docs.m5stack.switch-science.com/en/core/Core2_v1.3
      mirror_of: https://docs.m5stack.com/en/core/Core2_v1.3
      used_for: the I2C addresses (AXP192 0x34, BM8563 0x51, FT6336U 0x38, BMI270 0x68), the battery (3.7 V, 500 mAh) and RTC cell (MS412FE, 3 V), the USB-UART part of v1.3 (CH9102F), the antenna, the links to both sheets
      checked: 2026-11-17

renamed:   # nets the print leaves unnamed: our name -> where it is
  AXP_BIAS: U4 pin 24 (BIAS) to R4
  AXP_VREF: U4 pin 25 (VREF) to C8
  AXP_VINT: U4 pin 26 (VINT) to C9
  AXP_LX1: U4 pin 45 (LX1) to L3
  AXP_LX3: U4 pin 15 (LX3) to L2
  RF_LNA: U7 pin 2 (LNA_IN), L1, C1
  RF_MATCH: L1, C2, R1, R2
  ANT1_FEED: R1 to ANT1
  ANT2_FEED: R2 to ANT2 (IPEX)
  ESP_CAP2: U7 pin 47 (CAP2), R29, C40
  ESP_CAP1: U7 pin 48 (CAP1), R29, C40, C41
  VDD_SDIO: U7 pin 26 (VDD_SDIO), C44
  XTAL_P: U7 pin 45 (XTAL_P) to R3
  XTAL_P_R: R3, X2 pin 1, C3
  XTAL_N: U7 pin 44 (XTAL_N), X2 pin 3, C4
  USB_VBUS: J3 VCC, J2 pin 1, FU1 (before the fuse)
  USB_CC1: J3 A5 (CC1) to R32
  USB_CC2: J3 B5 (CC2) to R33
  CP_VDD: U3 pins 5 (VIO) and 6 (VDD), C12, R6
  CP_RST: U3 pin 9 (RST) to R6
  CP_RTS: U3 pin 19 (RTS), Q1 emitter, R13
  CP_DTR: U3 pin 23 (DTR), Q2 emitter, R12
  Q1_B: Q1 base to R12
  Q2_B: Q2 base to R13
  Q2_C: Q2 collector to D1 cathode
  U6_VOP: U6 pin 8 (VOP) to R22
  SPK_P: R22 to PAD1 pin 1
  SPK_N: U6 pin 5 (VON) to PAD1 pin 2
  LED1_K: LED1 cathode to R19
  VIB_M: R21, D2 cathode, PAD2 pin 1
  BOOST_LX: U8 pins 1, 2 (LX) to L4
  BOOST_EN: U8 pin 3 (EN), R23, R24, C39
  BOOST_FB: U8 pin 5 (FB), R30, R31
  LCD_MOSI: R61 to LCD1 pin 2
  LCD_MISO: R62 to LCD1 pin 3
  LCD_SCK: R63 to LCD1 pin 4
  CTP_VDD: R65, CTP1 pin 1 (VDD), C54
  RTC_INT: U5 pin 3 (INT), R14, C30
  RTC_OSCI: U5 pin 1 (OSCI), X1, C32
  RTC_OSCO: U5 pin 2 (OSCO), X1, C33
  BMI_SDO: U101 pin 1 (SDO) to R101 (expansion sheet)

aliases:   # expansion-sheet net name -> the core net it is mated to through the M5-Bus (BUS101 <-> BUS1)
  SYS_P033: MCU_VDD      # bus pin 12, 3.3V
  IMU_SDA: EXT_G21       # bus pin 17, G21/SYS_SDA
  IMU_SCL: EXT_G22       # bus pin 18, G22/SYS_SCL
  MIC_CLK: EXT_G0        # bus pin 24, G0
  MIC_DAT: EXT_G34       # bus pin 26, G34/ADC

rails:   # nominal: the voltage a test point's or a net's printed name states, else the docs page's
  USB_VBUS:
    nominal: "5 V"
    from: J3
    what: "USB-C VBUS (VCC), also on J2 pin 1; becomes USB_5V through FU1 1A/6V."
  USB_5V:
    nominal: "5 V"
    from: FU1
    what: "USB-C VBUS after FU1. Feeds the AXP192 ACIN (pins 32, 33) and the USB-UART bridge U3's VBUS and REGIN."
  BUS_5V:
    nominal: "5 V (5.03 V)"
    from: U8
    what: "U8 SY7088 boost from IPS_BUS (R30 15K / R31 4.7K on FB): 1.2 V x (1 + R30/R31) = 5.03 V by the SY7088 datasheet (computed, not measured). Also the AXP192 VBUS input (pin 31), M5-Bus pin 28 and Port A pin 2."
    enable: "BST_EN (AXP192 EXTEN, pin 40) through R23 47R; R24 10K to GND"
  SYS_VBAT:
    nominal: "3.7 V cell"
    from: J5
    what: "The built-in cell (3.7 V, 500 mAh by the docs page), whose connection the sheets do not draw; the reserved battery header J5 (EXT.BATT) is on this net. The AXP192 BAT pins 34/35 charge and draw it; M5-Bus pin 30; TP7 (VB)."
  IPS_BUS:
    nominal: "5 V or the cell"
    from: U4
    what: "AXP192 IPSOUT (pins 38, 39) and APS: the system bus, from USB_5V, BUS_5V or SYS_VBAT. Feeds the AXP192 DC-DC and LDO inputs, the SY7088 and the BM8563 INT pull-up; TP4 (IPSOUT)."
  MCU_VDD:
    nominal: "3.3 V"
    from: U4
    what: "AXP192 DCDC1 through L3 (TP2 'ESP_3V3', M5-Bus pin 12 '3.3V'). Supplies the ESP32, flash, PSRAM, the UART auto-reset, amplifier, LED, touch panel, ESD arrays and I2C pull-ups."
    enable: "AXP192 DCDC1, set by the AXP192"
  PERI_VDD:
    nominal: "3.3 V"
    from: U4
    what: "AXP192 LDO2 (TP3 'PERIPH_3V3'). Supplies the LCD and the microSD socket and their pull-ups."
    enable: "AXP192 LDO2, set by the AXP192"
  RTC_VDD:
    nominal: "3.3 V"
    from: U4
    what: "AXP192 LDO1 (TP5 'RTC_3V3'). Supplies the BM8563; also on the AXP192 SYSEN (pin 29)."
  RTC_BAT:
    nominal: "3 V cell"
    from: "U4, BT1"
    what: "The RTC backup cell BT1 (MS412FE 3 V by the docs page) on the AXP192 BACKUP pin (30)."
  LCD_BL_TP:
    nominal: "set by U4"
    from: U4
    what: "AXP192 DCDC3 through L2; R17 4.7R/1% to the LCD backlight anode (LCD_BL)."
    enable: "AXP192 DCDC3, set by the AXP192"
  VIB_MOTOR:
    nominal: "set by U4"
    from: U4
    what: "AXP192 LDO3; R21 22R/1% to the vibration motor (PAD2), D2 across it."
    enable: "AXP192 LDO3, set by the AXP192"
  CTP_VDD:
    nominal: "3.3 V"
    from: R65
    what: "MCU_VDD through R65 4.7R/1%, C54 475/6.3V to GND: the touch panel's supply (CTP1 pin 1, VDD)."
  CP_VDD:
    nominal: "set by U3"
    from: U3
    what: "The USB-UART bridge's VDD pin (6, the CP2104 numbering as printed), tied to its VIO (5), C12 104/10V to GND; U3 takes USB_5V on VBUS and REGIN (pins 8, 7). Pulls the bridge's RST up through R6 10K/1%."
  GND:
    nominal: "0 V"
    what: "Ground, on both sheets."

pmic_gpio:   # AXP192 (U4) GPIO0-GPIO4 as the core sheet wires them, named AXP_IOn as the docs page's pin map does
  AXP_IO0: {pin: 19, net: BUS_PW_EN, what: "N_VBUSEN (pin 6): high stops the AXP192 taking power from BUS_5V; R5 holds it low"}
  AXP_IO1: {pin: 18, net: SYS_LED, what: "sinks the power LED LED1 (R19)"}
  AXP_IO2: {pin: 20, net: SPK_EN, what: "NS4168 CTRL: low shuts it down; left floating, R20 turns it on"}
  AXP_IO3: {pin: 41, net: "NC"}
  AXP_IO4: {pin: 42, net: LCD_RST, what: "resets the LCD and the touch panel (R64 up)"}

pulls:   # every resistor with one end on a rail or ground and the other on a signal
  - {signal: AXP_BIAS, down: GND, via: R4, value: "200K/1%"}
  - {signal: BUS_PW_EN, down: GND, via: R5, value: "10K/1%"}
  - {signal: CP_RST, up: CP_VDD, via: R6, value: "10K/1%"}
  - {signal: GPIO16, up: MCU_VDD, via: R9, value: "5.1K/1%"}
  - {signal: GPIO0, up: MCU_VDD, via: R10, value: "2.2K/1%"}
  - {signal: MCU_RST, up: MCU_VDD, via: R11, value: "10K/1%"}
  - {signal: RTC_INT, up: IPS_BUS, via: R14, value: "10K/1%"}
  - {signal: GPIO12, down: GND, via: R15, value: "5.1K/1%"}
  - {signal: SYS_LED, up: MCU_VDD, via: R16, value: "5.1K/1%"}
  - {signal: GPIO2, down: GND, via: R18, value: "2.2K/1%"}
  - {signal: SPK_EN, up: MCU_VDD, via: R20, value: "5.1K/1%"}
  - {signal: BOOST_EN, down: GND, via: R24, value: "10K/1%"}
  - {signal: GPIO38, up: PERI_VDD, via: R25, value: "10K/1%"}
  - {signal: GPIO4, up: PERI_VDD, via: R26, value: "10K/1%"}
  - {signal: GPIO18, up: PERI_VDD, via: R27, value: "10K/1%"}
  - {signal: GPIO23, up: PERI_VDD, via: R28, value: "10K/1%"}
  - {signal: BOOST_FB, up: BUS_5V, via: R30, value: "15K/1%"}
  - {signal: BOOST_FB, down: GND, via: R31, value: "4.7K/1%"}
  - {signal: USB_CC1, down: GND, via: R32, value: "5.1K/1%"}
  - {signal: USB_CC2, down: GND, via: R33, value: "5.1K/1%"}
  - {signal: GPIO21, up: MCU_VDD, via: R57, value: "2.2K/1%"}
  - {signal: GPIO22, up: MCU_VDD, via: R58, value: "2.2K/1%"}
  - {signal: GPIO33, up: MCU_VDD, via: R59, value: "5.1K/1%"}
  - {signal: GPIO32, up: MCU_VDD, via: R60, value: "5.1K/1%"}
  - {signal: LCD_RST, up: PERI_VDD, via: R64, value: "5.1K/1%"}
  - {signal: BMI_SDO, down: GND, via: R101, value: "10K"}

i2c:
  bus: {sda: GPIO21, scl: GPIO22, pullups: "R57 (SDA) and R58 (SCL), 2.2K/1% to MCU_VDD"}
  devices:
    - {ref: U4, part: AXP192, address: "0x34", source: "Kleidos addition K9: AXP192 datasheet rev 1.1 p. 31 (68H write, 69H read); docs page pin map \"AXP192 (0x34)\""}
    - {ref: U5, part: BM8563, address: "0x51", source: "Kleidos addition K11: BM8563 datasheet V1.1 p. 1 (A2h write, A3h read); docs page pin map \"BM8563 (0x51)\""}
    - {ref: CTP1, part: "FT6336U (touch panel)", address: "0x38", source: "Kleidos addition K10: the Kleidos firmware talks to it there on this board; docs page pin map \"FT6336U (0x38)\""}
    - {ref: U101, part: BMI270, address: "0x68", source: "Kleidos addition K12: BMI270 datasheet p. 138, SDO (pin 1) to GND selects 0x68, and R101 pulls it to GND; docs page pin map \"BMI270 (0x68)\""}
  through_bus: U101 reaches the bus on the expansion board through M5-Bus pins 17/18 (EXT_G21/EXT_G22) and the core's 47R series resistors R45/R46.
  external: "Port A (J4) carries EXT_G32/EXT_G33 to GPIO32/GPIO33 through R47/R48 47R, pulled up by R60/R59 5.1K/1% to MCU_VDD."

esp32_gpio:   # chip pin -> GPIO, net, what it does (U7)
  GPIO0: {pin: 23, net: GPIO0, what: "boot strap: high (R10 2.2K up, and the internal pull-up) boots from flash, low enters download boot; I2S LRCK to the NS4168 and PDM clock to the microphone (M5-Bus pin 24); auto-reset pulls it low through D1"}
  GPIO1: {pin: 41, net: GPIO1, what: "U0TXD: to the bridge U3's RXD through R8 47R; M5-Bus pin 14"}
  GPIO2: {pin: 22, net: GPIO2, what: "boot strap: low (R18 2.2K down), as download boot needs with GPIO0 low; I2S data to the NS4168; M5-Bus pin 23"}
  GPIO3: {pin: 40, net: GPIO3, what: "U0RXD: from the bridge U3's TXD through R7 47R; M5-Bus pin 13"}
  GPIO4: {pin: 24, net: GPIO4, what: "microSD CS (R26 10K up)"}
  GPIO5: {pin: 34, net: GPIO5, what: "LCD CS; strap (SDIO slave timing) with an internal pull-up; no external pull drawn"}
  GPIO6: {pin: 31, net: GPIO6, what: "flash SCLK"}
  GPIO7: {pin: 32, net: GPIO7, what: "flash SO, PSRAM SO/SIO1"}
  GPIO8: {pin: 33, net: GPIO8, what: "flash SI, PSRAM SI/SIO0"}
  GPIO9: {pin: 28, net: GPIO9, what: "flash HOLD#, PSRAM SIO3"}
  GPIO10: {pin: 29, net: GPIO10, what: "flash WP#, PSRAM SIO2"}
  GPIO11: {pin: 30, net: GPIO11, what: "flash CS#"}
  GPIO12: {pin: 18, net: GPIO12, what: "MTDI strap: R15 5.1K down selects the 3.3 V VDD_SDIO at reset; I2S BCLK to the NS4168"}
  GPIO13: {pin: 20, net: GPIO13, what: "M5-Bus pin 15 (RXD2)"}
  GPIO14: {pin: 17, net: GPIO14, what: "M5-Bus pin 16 (TXD2)"}
  GPIO15: {pin: 21, net: GPIO15, what: "LCD D/C; MTDO strap (U0TXD boot log, SDIO slave timing) with an internal pull-up; no external pull drawn"}
  GPIO16: {pin: 25, net: GPIO16, what: "PSRAM CS# (R9 5.1K up)"}
  GPIO17: {pin: 27, net: GPIO17, what: "PSRAM SCLK"}
  GPIO18: {pin: 35, net: GPIO18, what: "SPI SCK: LCD (R63 47R), microSD (R27 10K up), M5-Bus pin 11"}
  GPIO19: {pin: 38, net: GPIO19, what: "M5-Bus pin 22"}
  GPIO21: {pin: 42, net: GPIO21, what: "internal I2C SDA (R57 2.2K up): AXP192, BM8563, touch, BMI270; M5-Bus pin 17"}
  GPIO22: {pin: 39, net: GPIO22, what: "internal I2C SCL (R58 2.2K up); M5-Bus pin 18"}
  GPIO23: {pin: 36, net: GPIO23, what: "SPI MOSI: LCD (R61 47R), microSD (R28 10K up), M5-Bus pin 7"}
  GPIO25: {pin: 14, net: GPIO25, what: "M5-Bus pin 8 (DAC)"}
  GPIO26: {pin: 15, net: GPIO26, what: "M5-Bus pin 10 (DAC)"}
  GPIO27: {pin: 16, net: GPIO27, what: "M5-Bus pin 21"}
  GPIO32: {pin: 12, net: GPIO32, what: "Port A SDA and M5-Bus pin 19 (R60 5.1K up)"}
  GPIO33: {pin: 13, net: GPIO33, what: "Port A SCL and M5-Bus pin 20 (R59 5.1K up)"}
  GPIO34: {pin: 10, net: GPIO34, what: "input only, no internal pull; PDM data from the microphone (M5-Bus pin 26)"}
  GPIO35: {pin: 11, net: GPIO35, what: "input only, no internal pull; M5-Bus pin 2 (ADC)"}
  GPIO36: {pin: 5, net: GPIO36, what: "input only, no internal pull; M5-Bus pin 4 (ADC)"}
  GPIO37: {pin: 6, net: "NC"}
  GPIO38: {pin: 7, net: GPIO38, what: "SPI MISO: LCD (R62 47R), microSD (R25 10K up), M5-Bus pin 9"}
  GPIO39: {pin: 8, net: GPIO39, what: "input only, no internal pull; touch panel INT (no pull drawn)"}

kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. A bench path is under this folder; firmware is the Kleidos firmware, by path and symbol;
  # README.md ("Kleidos additions and corrections") gives each source in full.
  - id: K1
    kind: correction
    what: "U3 is a CH9102F, drawn with the printed CP2104 pins."
    vendor: "a CP2104-F03-GMR"
    element: {part: U3}
    source:
      type: vendor-doc
      cite: "Core2 v1.3 docs page, specifications; USB ID 1a86:55d4, bench/2026-11-17-usb-descriptor.md"
  - id: K2
    kind: addition
    what: "SYS_VBAT carries the built-in 3.7 V 500 mAh cell."
    element: {rail: SYS_VBAT}
    source:
      type: vendor-doc
      cite: "Core2 v1.3 docs page, specifications"
  - id: K3
    kind: correction
    what: "The vibration motor on PAD2 is a 1027RFN01-33d."
    vendor: "pads only, no motor part"
    element: {part: PAD2}
    source:
      type: vendor-doc
      cite: "1027RFN01-33d spec (docs page link)"
  - id: K4
    kind: correction
    what: "X2 is a 40 MHz crystal."
    vendor: "the part number only, no frequency"
    element: {part: X2}
    source:
      type: bench
      cite: "bench/2026-11-17-esptool-chip-flash-efuse.md"
  - id: K5
    kind: correction
    what: "ANT1 is a 2.4 GHz 3D antenna."
    vendor: "no value"
    element: {part: ANT1}
    source:
      type: vendor-doc
      cite: "Core2 v1.3 docs page, specifications"
  - id: K6
    kind: addition
    what: "RTC_BAT's cell BT1 is an MS412FE, 3 V."
    element: {rail: RTC_BAT}
    source:
      type: vendor-doc
      cite: "Core2 v1.3 docs page, specifications"
  - id: K7
    kind: correction
    what: "Port A J4 is an HY2.0-4P (Grove) connector."
    vendor: "PORT-A only"
    element: {part: J4}
    source:
      type: vendor-doc
      cite: "Core2 v1.3 docs page, specifications"
  - id: K8
    kind: correction
    what: "U7 is the ESP32-D0WDQ6-V3."
    vendor: "ESP32-D0WDQ6"
    element: {part: U7}
    source:
      type: vendor-doc
      cite: "Core2 v1.3 docs page, specifications; bench/2026-11-17-esptool-chip-flash-efuse.md"
  - id: K9
    kind: addition
    what: "The AXP192 U4 answers at I2C address 0x34."
    element: {i2c: U4}
    source:
      type: datasheet
      cite: "AXP192 datasheet rev 1.1, p. 31"
  - id: K10
    kind: addition
    what: "The touch panel's FT6336U answers at 0x38."
    element: {i2c: CTP1}
    source:
      type: firmware
      cite: "Kleidos firmware, variants/core2_v13/variant.h: TOUCH_I2C_ADDR"
  - id: K11
    kind: addition
    what: "The BM8563 U5 answers at I2C address 0x51."
    element: {i2c: U5}
    source:
      type: datasheet
      cite: "BM8563 datasheet V1.1, p. 1 (A2h)"
  - id: K12
    kind: addition
    what: "The BMI270 U101 answers at 0x68: R101 holds SDO low."
    element: {i2c: U101}
    source:
      type: datasheet
      cite: "BMI270 datasheet DS000-05, p. 138"
  - id: K13
    kind: addition
    what: "AXP_IO0 drives N_VBUSEN: high keeps BUS_5V out."
    element: {gpio: AXP_IO0}
    source:
      type: datasheet
      cite: "AXP192 datasheet rev 1.1, pp. 17, 23"
  - id: K14
    kind: addition
    what: "AXP_IO2 is the NS4168 CTRL: low shuts it down."
    element: {gpio: AXP_IO2}
    source:
      type: datasheet
      cite: "NS4168 datasheet, Table 2 (p. 7)"
  - id: K15
    kind: addition
    what: "An RTC interrupt on RTC_INT switches the board on (C30)."
    element: {net: RTC_INT}
    source:
      type: firmware
      cite: "Kleidos firmware, src/boards/board_core2_v13.cpp: kSleepWiring.rtcIntPowersOn"
  - id: K16
    kind: addition
    what: "PWR_KEY: a 100 kohm pull-up to APS inside the AXP192."
    element: {net: PWR_KEY}
    source:
      type: datasheet
      cite: "AXP192 datasheet rev 1.1, p. 18"
  - id: K17
    kind: addition
    what: "VDD_SDIO is 3.3 V: MTDI strap low, no eFuse override."
    element: {net: VDD_SDIO}
    source:
      type: bench
