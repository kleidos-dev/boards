    S: {symbol: "kleidos:SW_Push", stub: 0}
    TP: {symbol: "kleidos:TestPoint", stub: 0}
    Q: {symbol: "kleidos:Q_NPN", short: NPN transistor}
  D1: {symbol: "kleidos:D", stub: 0, pins: {"1": K, "2": A}, short: Diode}
  D2: {symbol: "kleidos:D", stub: 0, pins: {"1": K, "2": A}, short: Diode}
  D3: {symbol: "m5stack-core2-v13:SRV05-4"}
  D4: {symbol: "m5stack-core2-v13:SRV05-4"}
  D5: {symbol: "m5stack-core2-v13:SRV05-4"}
  D6: {symbol: "m5stack-core2-v13:SRV05-4"}
  D7: {symbol: "m5stack-core2-v13:SRV05-4"}
  D8: {symbol: "m5stack-core2-v13:SRV05-4"}
  LED1: {symbol: "kleidos:LED", stub: 0, pins: {"1": K, "2": A}}
  X1: {symbol: "kleidos:Crystal", stub: 0, short: Crystal}
  X2: {symbol: "kleidos:Crystal_GND24", short: Crystal}
  BT1: {symbol: "kleidos:Battery_Cell", stub: 0, short: RTC backup cell}
  FU1: {symbol: "kleidos:Fuse", angle: 90, stub: 0, short: Fuse}
  ANT1: {symbol: "m5stack-core2-v13:ANTENNA"}
  ANT2: {symbol: "m5stack-core2-v13:IPEX", short: Antenna socket}
  J1: {symbol: "m5stack-core2-v13:TF_CARD_SOCKET"}
