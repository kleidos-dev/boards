           "24 BIAS", "25 VREF", "26 VINT", "37 TS", "4 N_OE", "-",
           "1 SDA", "2 SCK", "48 IRQ", "3 N_RSTO", "5 PWROK", "-",
           "23 PWRON", "27 PWREN", "29 SYSEN", "36 CHGLED", "-",
           "6 N_VBUSEN", "19 GPIO0", "18 GPIO1", "20 GPIO2", "41 GPIO3", "42 GPIO4", "40 EXTEN"]
    right: ["44 VIN1", "45 LX1", "47 DCDC1", "-", "7 VIN2", "8 LX2", "10 DCDC2", "-",
            "14 VIN3", "15 LX3", "17 DCDC3", "-", "38 IPSOUT", "39 IPSOUT", "21 APS", "13 LDOIN", "-",
            "28 LDO1", "12 LDO2", "11 LDO3", "-", "43 NC"]
    bottom: ["46 PGND1", "9 PGND2", "16 PGND3", "22 AGND", "0 PAD"]
  ESP32-D0WDQ6:
    short: ESP32 SoC
    description: ESP32 dual-core Wi-Fi and Bluetooth SoC, QFN48
    left: ["1 VDDA", "43 VDDA", "46 VDDA", "3 VDD3P3", "4 VDD3P3", "19 VDD3P3_RTC", "37 VDD3P3_CPU", "-",
           "26 VDD_SDIO", "-", "2 LNA_IN", "-", "9 CHIP_PU", "-", "45 XTAL_P", "44 XTAL_N", "-",
           "47 CAP2", "48 CAP1"]
    right: ["23 GPIO0", "41 GPIO1/U0TXD", "22 GPIO2", "40 GPIO3/U0RXD", "24 GPIO4", "34 GPIO5",
            "31 GPIO6/SD_CLK", "32 GPIO7/SD_DATA0", "33 GPIO8/SD_DATA1", "28 GPIO9/SD_DATA2",
            "29 GPIO10/SD_DATA3", "30 GPIO11/SD_CMD", "18 GPIO12", "20 GPIO13", "17 GPIO14", "21 GPIO15",
            "25 GPIO16", "27 GPIO17", "35 GPIO18", "38 GPIO19", "42 GPIO21", "39 GPIO22", "36 GPIO23",
            "14 GPIO25", "15 GPIO26", "16 GPIO27", "12 GPIO32", "13 GPIO33", "10 GPIO34", "11 GPIO35",
