root:
  title: Contents
  heading: "M5Stack Core2 v1.3 (K010-V13) schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page numbers at the bottom right of
        every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width. A dot joins lines; a cross on a pin
        end means the pin is not connected. Pins connect by net labels (the boxed names): pins whose labels
        carry the same name are on one net, on any page. [3/C4] after a label: page 3 carries that net too,
        its label in zone C4 (column 4, row C of the border). Click it to land on that label. No [page/zone]:
        the net is on this page only. Click a part's reference to find its row in the parts list; the row's
        page/zone leads back. A part crossed out in red is not fitted (DNP). White: parts and their
        references. Grey: values, pin names, pin numbers. A dashed frame is a block of the circuit, titled
        at its top left. An amber K3 marks a Kleidos addition or correction: it leads to its row below.
    - title: Notes
      text: |
        Every part, pin and net of the Core2 v1.3 that the vendor's two published sheets show, with the
        values printed there: connectivity documented from the vendor's public documentation, with Kleidos
        additions and corrections listed on page 1 (M5Stack's core sheet CORE2_V1.0_SCH, 2020-07-07, and
        expansion sheet core2_v1.3_SCH, 2025-11-14, linked from the Core2 v1.3 docs page; README.md and
        netlist.yaml beside this file cite them). Layout and symbols are this project's. No footprints, no
        PCB. Values are as printed (226/6.3V is 22 uF) except where an entry below corrects one. DNP marks a
        part not fitted. Designators are the vendor's; the expansion sheet reuses the core's, so its parts
        are +100 here (its U1 is U101). Nets the vendor left unnamed carry names of ours (AXP_LX1,
        RF_MATCH...). Zones: columns 1-8 and rows A-F, 50 mm apart, printed in the border.

sheets:
  - file: pmu.kicad_sch
    name: Power management and inputs
    summary: "The AXP192 with its rails, the 5 V boost to the M5-Bus, the USB-C input with its fuse, the reserved USB and battery headers, the keys, the power LED, the vibration motor and the test points."
    parts: "U4 AXP192, L2 L3, U8 SY7088, L4, J3 USB-C, FU1, J2, J5, S1 S2 keys, LED1, PAD2 motor, TP1-TP7"
    pwr_flags: [GND]
    blocks:
      - title: AXP192 power management, DCDC1 (MCU_VDD) and DCDC3 (LCD backlight)
        rows:
          - [U4, {cols: [[C6, C7, C13, C14, C10, R4, C8, C9], [R5, C11, C18, C19, C21, C22, C23, C24],
                         [C25, C26, L3, C27, C29, C31], [L2, R17, C28]]}]
      - title: 5 V boost (to the M5-Bus and Port A)
        rows:
          - [U8, {cols: [[L4, C35, C36, C37], [R23, R24, C39], [R30, R31, C49, C51]]}]
      - title: USB-C input
        rows:
          - [J3, {cols: [[FU1, C52], [R32, R33]]}, J2]
      - title: Test points
        rows:
          - [{cols: [[TP1, TP2, TP3, TP4], [TP5, TP6, TP7]]}]
      - title: Keys
        rows:
          - [{col: [S1, S2]}]
      - title: Power LED
        rows:
          - [LED1, {col: [R16, R19]}]
      - title: Vibration motor
        rows:
          - [PAD2, D2, {col: [R21]}]
      - title: Battery header (EXT.BATT)
        rows:
          - [J5]
  - file: mcu.kicad_sch
    name: ESP32 and memory
    summary: "The ESP32 with its supply decoupling, RF path and crystal, the SPI flash and PSRAM, and the internal I2C pull-ups."
    parts: "U7 ESP32-D0WDQ6-V3, ANT1 ANT2 with L1 R1 R2, X2, U1 XM25QH128BHIQ, U2 ESPSRAM64H, R57 R58"
    blocks:
      - title: ESP32-D0WDQ6-V3, its decoupling and the internal I2C pull-ups
        rows:
          - [U7, {cols: [[C42, C43, C45, C46, C47, C48, C50, C44], [R57, R58]]}]
      - title: Crystal and CAP1/CAP2
        rows:
          - [X2, {cols: [[R3, C3, C4], [R29, C40, C41]]}]
      - title: Flash
        rows:
          - [U1, {col: [C15]}]
      - title: PSRAM
        rows:
          - [U2, {col: [R9, C16]}]
      - title: RF path
        rows:
          - [ANT1, ANT2]
          - [{cols: [[L1, C1, C2], [R1, R2]]}]
  - file: peripherals.kicad_sch
    name: Display, card, clock, audio, UART
    summary: "The LCD and touch panel connectors, the microSD socket, the BM8563 clock with its crystal and backup cell, the speaker amplifier, and the USB to UART bridge with its auto-reset."
    parts: "LCD1, CTP1, J1 microSD, U5 BM8563, X1, BT1, U6 NS4168, PAD1 speaker, U3 CH9102F, Q1 Q2 S8050, D1"
    blocks:
      - title: USB to UART (CH9102F, the CP2104 pins as printed) and auto-reset
        rows:
          - [U3, {cols: [[C5, C12, R6, R7, R8], [R11, C17, R10, R12, R13]]}]
          - [Q1, Q2, D1]
      - title: LCD connector
        rows:
          - [LCD1, {cols: [[R61, R62, R63, R64, C53]]}]
      - title: microSD (SPI)
        rows:
          - [J1, {cols: [[R25, R26, R27, R28, C38]]}]
      - title: Real-time clock
        rows:
          - [U5, {cols: [[X1, C32, C33], [R14, C30, C20]]}, BT1]
      - title: Speaker amplifier
        rows:
          - [U6, PAD1, {cols: [[R20, R22, C34], [R15, R18]]}]
      - title: Touch panel
        rows:
          - [CTP1, {col: [R65, C54]}]
  - file: bus.kicad_sch
    name: M5-Bus, ESD and Port A
    summary: "The 30-pin M5-Bus, the 47R series resistors and SRV05-4 ESD arrays between it and the ESP32, and the Grove port A with its I2C pull-ups."
    parts: "BUS1 M5-Bus, D3-D8 SRV05-4, R34-R56, J4 Port A, R59 R60"
    blocks:
      - title: M5-Bus series resistors (47R) and ESD arrays, bus side on the left
        rows:
          - [{col: [R34, R35, R36, R37]}, D3, {col: [R38, R39, R40, R41]}, D4]
          - [{col: [R42, R43, R44, R45]}, D5, {col: [R46, R47, R48, R49]}, D6]
          - [{col: [R50, R51, R52, R53]}, D7, {col: [R54, R55, R56]}, D8]
      - title: M5-Bus (core board)
        rows:
          - [BUS1]
      - title: Port A (Grove, external I2C)
        rows:
          - [J4, {col: [R59, R60]}]
  - file: expansion.kicad_sch
    name: Expansion board
    summary: "The rear expansion board (the vendor's second sheet, core2_v1.3_SCH): its M5-Bus, the BMI270 IMU and the SPM1423 PDM microphone. Its designators are the vendor's +100."
    parts: "BUS101 M5-Bus, U101 BMI270, U102 SPM1423HM4H-B, R101, C101-C103"
    blocks:
      - title: "Expansion board: M5-Bus (mates with BUS1)"
        rows:
          - [BUS101]
      - title: "Expansion board: IMU"
        rows:
          - [U101, {col: [R101, C102, C103]}]
      - title: "Expansion board: microphone"
        rows:
          - [U102, {col: [C101]}]
      - title: "Expansion board: net names"
        rows:
          - [{text: "The nets carry the core sheet's names of the M5-Bus pins they reach:\nSYS_P033 (bus pin 12, 3.3V) is MCU_VDD; IMU_SDA (17) is EXT_G21;\nIMU_SCL (18) is EXT_G22; MIC_CLK (24) is EXT_G0; MIC_DAT (26) is EXT_G34.\nBus pins the expansion sheet leaves unconnected are drawn unconnected here.\nDesignators are the vendor's +100: its BUS1, U1, U2, R1, C1-C3."}]
  - file: power.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from the USB-C, the M5-Bus 5 V and the battery through the AXP192 to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
    name: Nets and signals
    index: nets
    gpio_title: ESP32 GPIO (U7)
    pmic_title: AXP192 GPIO (U4)
    summary: "Every rail and every net drawn on more than one page, with the page/zone of its labels; the ESP32 and AXP192 GPIO, the I2C addresses, the test points, every pull-up and pull-down."
  - file: parts.kicad_sch
    name: Parts
    index: parts
    summary: "Every part: its value as printed, what it is, its nets, whether it is fitted and where it is drawn. A reference on the drawing leads to its row, the row back to it."

