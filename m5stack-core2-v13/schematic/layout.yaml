#
# How the Core2 v1.3 schematic is drawn: the symbol each part takes, our own
# symbols, and the sheets, blocks and rows the parts sit in. The facts (values,
# pins, nets) are in netlist.yaml; _shared/kicad_schematic.py joins the two.
#
# parts: a part takes the symbol its prefix names under _by_prefix unless it has
# a row of its own. "pins" maps our symbol's pin number to the vendor's pin
# (or to the name netlist.yaml gives a pin the print leaves unnumbered: then
# our symbol numbers it with a short token of ours, V, G, S, EP, GP, P).
# "angle" turns the symbol (90: a vertical two-pin part lies flat).
# rows: each row of a block is laid left to right; an item is a reference,
# {col: [...]} for a column of two-pin parts, {cols: [[...], [...]]} for
# several, or {text: ...}.
# sheets: "summary" and "parts" fill the sheet's box on the contents page; a
# sheet with "index" (power, nets, parts) is a page of tables the generator
# writes from netlist.yaml, after the drawing. The core sheet of the vendor is
# drawn on pages 2 to 5; its expansion sheet on page 6, a page of its own.
# power_tree: its boxes, [column, row], and arrows, each a connection
# netlist.yaml has (the generator refuses any other); "NET@in" draws a net twice.

paper: A3
title_block:
  title: Core2 v1.3 (K010-V13)
  company: "Kleidos boards: connectivity documented from the vendor's public documentation"
  comments:
    - "Sources: M5Stack Core2 v1.3 sheets (2020-07-07, 2025-11-14), docs; README.md"
    - "Values as documented. Layout and symbols: Kleidos boards"

revisions:
  - {rev: 1, date: "2026-11-17", change: "First drawing: every part, pin and net of both published sheets (core and expansion board), from the vendor's public documentation; contents, power tree, nets and signals, parts list; page/zone links; DNP marks; no script in the PDF."}
  - {rev: 2, date: "2026-11-17", change: "Kleidos additions and corrections K1-K27, listed above."}
  - {rev: 3, date: "2026-11-17", change: "An entry is marked wherever an index page shows its element again; a pin on no net says what it is on the nets page; the title block says the drawing carries entries."}
  - {rev: 4, date: "2026-11-19", change: "The Kleidos drawing sheet, its mark in the title block."}

grounds:
  GND: kleidos:GND

parts:
  _by_prefix:
    R: {symbol: "kleidos:R", angle: 90, stub: 0}
    C: {symbol: "kleidos:C", angle: 90, stub: 0}
