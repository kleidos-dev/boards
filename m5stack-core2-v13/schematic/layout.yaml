    - [USB_5V@uart, U3]
    - [U3, CP_VDD]
  note: "BUS_5V is drawn twice: U8 makes it from IPS_BUS, and 5 V fed in at the M5-Bus (pin 28) or Port A reaches the AXP192 VBUS input (pin 31). USB_5V is drawn twice too: it also feeds the USB-UART bridge U3. The AXP192 charges SYS_VBAT and RTC_BAT."
