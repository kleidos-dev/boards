#
# LILYGO T-Deck Plus: every component, every pin and the net it is on, as the
# vendor's published schematics show them (the mainboard sheet and the two GPS
# daughterboard sheets). Facts only: what connects where and through what. The
# drawing in this folder (tdeck-plus.kicad_sch) is generated from this file;
# README.md says how, and how the two are checked against each other.
#
# Conventions:
# - pins are the vendor's pin numbers (letters for the transistors: G S D, B C E;
#   ball names for the MIA-M10Q);
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "renamed"; "ESP_LCD_D/C" is written ESP_LCD_DC;
# - NC is a pin the schematic leaves unconnected;
# - the daughterboards reuse the main board's designators, so their parts are
#   numbered +100 (MIA-M10Q board) and +200 (L76K board), and their nets carry
#   the prefixes M10_ and L76K_ (see "aliases");
# - "sheet" says which published sheet a part is on: main, m10 or l76k.

