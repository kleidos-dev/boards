kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. A bench path is under this folder; firmware is the Kleidos firmware, by path and symbol;
  # the datasheets are cited in full under source.also_read and in README.md ("Kleidos additions and
  # corrections"); improvements.md holds the triage (T-ids).
  - id: K1
    kind: addition
    what: "VBAT: P3 takes a 2000 mAh lithium-polymer cell."
    element: {rail: VBAT}
    source:
      type: vendor-doc
      cite: "LilyGO docs page, specifications"
  - id: K2
    kind: addition
    what: "UP1_CHRG: LED1 lights while UP1 charges, blinks with no cell."
    element: {net: UP1_CHRG}
    source:
      type: datasheet
      cite: "TP4065 datasheet Rev 1.2, pp. 4, 9"
  - id: K3
    kind: addition
    what: "VDD3V3 also feeds the GPS board, through P8 pin 2."
    element: {rail: "VDD3V3"}
    source:
      type: firmware
      cite: "Kleidos firmware, variants/tdeck/variant.h: HAS_GPS, PIN_GPS_TX, PIN_GPS_RX"
  - id: K4
    kind: addition
    what: "U1 is the WROOM-1-N16R8 (16 MB flash); IO35-37 serve its 8 MB Octal PSRAM."
    element: {pin: U1.28}
    source:
      type: firmware
      cite: "Kleidos firmware, variants/tdeck/tdeck.ini: board_upload.flash_size = 16MB"
  - id: K5
    kind: addition
    what: "GPIO45 (VDD_SPI strap) latched 0 at every reset."
    element: {gpio: GPIO45}
    source:
      type: bench
      cite: "bench/2026-11-17-gpio46-strap.md"
  - id: K6
    kind: addition
    what: "U0_ANT: U0 (HPD16A) carries a Semtech SX1262."
    element: {net: U0_ANT}
    source:
      type: vendor-doc
      cite: "LilyGO docs page, specifications"
  - id: K7
    kind: addition
    what: "UAR0_TX reaches the GPS board's GPS_RX (J102.3) through P8 pin 3."
    element: {net: UAR0_TX}
    source:
      type: firmware
      cite: "Kleidos firmware, variants/tdeck/variant.h: HAS_GPS, PIN_GPS_TX, PIN_GPS_RX"
  - id: K8
    kind: addition
    what: "UAR0_RX comes from GPS_TX (J102.2) through P8 pin 4; PPS is not carried."
    element: {net: UAR0_RX}
    source:
      type: firmware
      cite: "Kleidos firmware, variants/tdeck/variant.h: HAS_GPS, PIN_GPS_TX, PIN_GPS_RX"
  - id: K9
    kind: correction
    what: "U5 pin 4 is XTAL_32K_P (GPIO0)."
    vendor: "pin 4 named XTAL_OUT"
    element: {pin: U5.4}
    source:
      type: datasheet
      cite: "ESP32-C3 datasheet v2.5, Table 2-1"
  - id: K10
    kind: correction
    what: "U5 pin 5 is XTAL_32K_N (GPIO1)."
    vendor: "pin 5 named XTAL_IN"
    element: {pin: U5.5}
    source:
      type: datasheet
      cite: "ESP32-C3 datasheet v2.5, Table 2-1"
  - id: K11
    kind: addition
    what: "ESP_LCD_DC: P2's panel is a 2.8-inch 320x240 ST7789."
    element: {net: ESP_LCD_DC}
    source:
      type: firmware
      cite: "Kleidos firmware, variants/tdeck/variant.h: DISPLAY_TYPE_ST7789, DISPLAY_WIDTH, DISPLAY_HEIGHT, DISPLAY_DIAGONAL_MM_X10"
  - id: K12
    kind: addition
    what: "ESP_TP_INT: P4's touch controller is a Goodix GT911."
    element: {net: ESP_TP_INT}
    source:
      type: firmware
      cite: "Kleidos firmware, src/drivers/touch/gt911.h: Gt911::begin (accepts an address only on a GT9xx product id)"
  - id: K13
    kind: addition
    what: "ES7210_INT: U2's interrupt output, used by nothing."
    element: {net: ES7210_INT}
    source:
      type: datasheet
      cite: "ES7210 datasheet rev. 21.0, p. 4"
  - id: K14
    kind: addition
    what: "DMIC_CLK: U2's digital-mic clock output, used by nothing."
    element: {net: DMIC_CLK}
    source:
      type: datasheet
      cite: "ES7210 datasheet rev. 21.0, p. 4"
  - id: K15
    kind: addition
    what: "R22 sets SD_MODE near 1.65 V: U6 plays the left channel."
    element: {pull: R22}
