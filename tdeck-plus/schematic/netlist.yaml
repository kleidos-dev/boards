aliases:
  note: A daughterboard's nets carry its prefix here (M10_, L76K_); the vendor names them VDD3V3, GND, GPS_TX, GPS_RX, PPS, VRTC, VCC_RF, RST, as the main board does some of them. No cable between a daughterboard's J2 (5 pins) and the main board's P8 (4 pins) is published, so none of these nets is joined to the main board.
rails:
  VBUS:
    nominal: 5 V
    from: U7
    what: USB-C VBUS (A4, A9, B4, B9). Feeds the charger UP1, and the system through D1 (1N5819).
    pages:
    - 1
  VBAT:
    nominal: Li-ion cell
    from: P3
    what: Battery connector P3; charged by UP1 TP4065B from VBUS (R25 2K%1 on PROG). RD1 100K%1 sits across it.
    pages:
    - 1
  +5V:
    nominal: VBUS or VBAT
    from: SW1
    what: 'The power switch SW1 from SW1_IN: VBUS through D1, or VBAT through Q5 SI2307 while VBUS is absent (Q5 gate on VBUS, RD4 100K%1 to GND). Feeds the buck U8 and Q4.'
    pages:
    - 1
    enable: SW1 (slide switch)
  VDD3V3:
    nominal: 3.3 V
    from: U8
    what: U8 SY8089AAC buck from +5V through the inductor L5 SWPA5020S100MT, with its output set by R23 100K%1 and R24 22K%1. Supplies the ESP32-S3 module, the LCD logic, the touch connector, the 4-pin header P8 and the I2C pull-ups RC2, RC4.
    pages:
    - 1
    enable: 'U8 EN on U8_EN: RY1 100K from +5V, RY2 100K to GND'
  V3V:
    nominal: 3.3 V
    from: Q6
    what: Q6 SI2301 switch from VDD3V3. Supplies the ESP32-C3 keyboard controller and its flash, the ES7210, the Hall sensors, the LoRa module, the TF card, the backlight driver U9 and the LCD backlight anode, the keyboard backlight anodes (JP1), and the V3V side of the I2C.
    pages:
    - 1
    enable: 'PWR_EN (IO10) high: D3 and R27 turn Q7 on, Q7 pulls PWR_GATE low through R26 1K (RQ1 100K pulls it up to +5V)'
  BAT:
    nominal: VBUS or VBAT
    from: Q4
    what: Q4 SI2301 switch from +5V. Supplies the speaker amplifier U6 through L4 and the battery divider RD2/RD3 (BAT_ADC).
    pages:
    - 1
    enable: the same PWR_GATE as V3V (PWR_EN, IO10)
  AGND:
    nominal: 0 V
    from: R16
    what: Ground of the speaker amplifier, joined to GND through R16 0R.
    pages:
    - 1
  ADC_GND:
    nominal: 0 V
    from: R9
    what: Ground of the ES7210 and the microphones, joined to GND through R9 0R.
    pages:
    - 1
  M10_VDD3V3:
    nominal: 3.3 V
    from: J102
    what: 'MIA-M10Q daughterboard: VDD3V3 at its connector J102 pin 4.'
    pages:
    - 1
  M10_VRTC:
    nominal: backup cell
    from: J101
    what: 'MIA-M10Q daughterboard: the MS412FE cell J101, charged from M10_VDD3V3 through D101 and R103 1K.'
    pages:
    - 1
  M10_VCC_RF:
    nominal: RF supply
    from: U101
    what: 'MIA-M10Q daughterboard: the module''s VCC_RF output (C6), which feeds the antenna at J103 through R104 10R and L101 27nH.'
    pages:
    - 1
  L76K_VDD3V3:
    nominal: 3.3 V
    from: J202
    what: 'L76K daughterboard: VDD3V3 at its connector J202 pin 4.'
    pages:
    - 1
  L76K_VRTC:
    nominal: backup cell
    from: J201
    what: 'L76K daughterboard: the MS412FE cell J201, charged from L76K_VDD3V3 through D201 and R203 1K.'
    pages:
    - 1
i2c:
  bus:
    sda: II2C_SDA (GPIO18), and I2C_SDA past Q2
    scl: II2C_SCL (GPIO8), and I2C_SCL past Q1
    pullups: RC4 (SDA) and RC2 (SCL) 4.7K to VDD3V3; RC3 and RC1 4.7K to V3V on the far side; R14 and R13 4.7k to V3V at the ESP32-C3
  devices:
  - ref: U2
    part: ES7210
    address: '0x40'
    source: 'ES7210 datasheet rev. 21.0, p. 6: 1000 0 AD1 AD0, AD1 and AD0 pulled low by R1/R2 (K18)'
  - ref: U5
    part: ESP32-C3 keyboard
    address: '0x55'
    source: Kleidos firmware and LilyGO's keyboard sketch (K19)
  - ref: P4
    part: GT911 (touch panel)
    address: 0x5D / 0x14
    source: Kleidos firmware; GT911 datasheet (K20)
  level_shifter: 'Q1 (SCL) and Q2 (SDA), BSS123 with their gates on V3V, join the VDD3V3 side (II2C_*) to the V3V side (I2C_*: the ES7210 and the ESP32-C3).'
gpio_maps:
- title: ESP32-S3 GPIO (U1)
  map:
    GPIO0:
      pin: 27
      net: GPIO_0
      what: boot strap; KEY1 (trackball press) to GND, RY31 100K pull-up to VDD3V3 (strapping pin)
    GPIO1:
      pin: 39
      net: G_S4
      what: 'trackball left: Hall sensor UZ4 output (G_S4)'
    GPIO2:
      pin: 38
      net: G_S2
      what: 'trackball right: Hall sensor UZ2 output (G_S2)'
    GPIO3:
      pin: 15
      net: G_S1
      what: 'trackball up: Hall sensor UZ3 output (G_S1) (strapping pin)'
    GPIO4:
      pin: 4
      net: BAT_ADC
      what: battery voltage, RD2/RD3 divider of BAT (BAT_ADC)
    GPIO5:
      pin: 5
      net: ESP_I2S_WS
      what: I2S word select to the amplifier U6 (ESP_I2S_WS)
    GPIO6:
      pin: 6
      net: ESP_I2S_DA
      what: I2S data to the amplifier U6 (ESP_I2S_DA)
    GPIO7:
      pin: 7
      net: ESP_I2S_BCK
      what: I2S bit clock to the amplifier U6 (ESP_I2S_BCK)
    GPIO8:
      pin: 12
      net: II2C_SCL
      what: 'I2C SCL, VDD3V3 side (II2C_SCL): touch connector P4, Q1 to the V3V side'
    GPIO9:
      pin: 17
      net: Lora_CS
      what: LoRa chip select (Lora_CS)
    GPIO10:
      pin: 18
      net: PWR_EN
      what: 'PWR_EN: switches V3V and BAT on (Q7, Q4, Q6)'
    GPIO11:
      pin: 19
      net: ESP_LCD_DC
      what: LCD data/command (ESP_LCD_DC)
    GPIO12:
      pin: 20
      net: ESP_LCD_CS
      what: LCD chip select (ESP_LCD_CS)
    GPIO13:
      pin: 21
      net: Lora_BUSY_GPIO13
      what: LoRa BUSY
    GPIO14:
      pin: 22
      net: ES7210_SDOUT
      what: ES7210 SDOUT, through R7/R8 1K (ES7210_SDOUT)
    GPIO15:
      pin: 8
      net: G_S3
      what: 'trackball down: Hall sensor UZ1 output (G_S3)'
    GPIO16:
      pin: 9
      net: ESP_TP_INT
      what: touch interrupt, P4 pin 3 (ESP_TP_INT)
    GPIO17:
      pin: 10
      net: Lora_NRSET_GPIO17
      what: LoRa NRESET
    GPIO18:
      pin: 11
      net: II2C_SDA
      what: 'I2C SDA, VDD3V3 side (II2C_SDA): touch connector P4, Q2 to the V3V side'
    GPIO19:
      pin: 13
      net: ESP_USB_DM
      what: USB D- (ESP_USB_DM)
    GPIO20:
      pin: 14
      net: ESP_USB_DP
      what: USB D+ (ESP_USB_DP)
    GPIO21:
      pin: 23
      net: ES7210_LRCK
      what: ES7210 LRCK
    GPIO35:
      pin: 28
      net: NC
      what: serves the in-package Octal PSRAM (the print's note)
    GPIO36:
      pin: 29
      net: NC
      what: serves the in-package Octal PSRAM (the print's note)
    GPIO37:
      pin: 30
      net: NC
      what: serves the in-package Octal PSRAM (the print's note)
    GPIO38:
      pin: 31
      net: ESP_MISO
      what: 'SPI MISO: LCD, TF card (R5 10K to V3V), LoRa (ESP_MISO)'
    GPIO39:
