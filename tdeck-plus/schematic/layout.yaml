#
# How the T-Deck Plus schematic is drawn: the symbol each part takes, our own
# symbols, and the sheets, blocks and rows the parts sit in. The facts (values,
# pins, nets) are in netlist.yaml; _shared/kicad_schematic.py joins the two.
#
# parts: a part takes the symbol its prefix names under _by_prefix unless it has
# a row of its own. "pins" maps our symbol's pin number to the vendor's pin.
# "angle" turns the symbol (90: a vertical two-pin part lies flat).
# rows: each row of a block is laid left to right; an item is a reference,
# {col: [...]} for a column of two-pin parts, {cols: [[...], [...]]} for several.
# sheets: "summary" and "parts" fill the sheet's box on the contents page; a
# sheet with "index" (additions, power, nets, parts) is a page of tables the generator
# writes from netlist.yaml, after the drawing.
# power_tree: its boxes, [column, row], and arrows, each a connection
# netlist.yaml has (the generator refuses any other).

paper: A3
title_block:
  title: LILYGO T-Deck Plus
  company: "Kleidos boards: connectivity documented from the vendor's public documentation"
  comments:
    - "Sources: LILYGO T-Deck schematic 2023-06-01, GPS sheets; README.md"
    - "Values as documented. Layout and symbols: Kleidos boards"

revisions:
  - {rev: 1, date: "2026-11-17", change: "First drawing: every part, pin and net of the mainboard and the two GPS daughterboards, from the vendor's public documentation."}
  - {rev: 2, date: "2026-11-17", change: "Kleidos additions and corrections K1-K20, listed above, from datasheets, the vendor's documentation, the Kleidos firmware on this board and a bench probe."}
  - {rev: 3, date: "2026-11-17", change: "K21-K24: which way each trackball sensor reads. Markers repeated on the index pages; pins on no net say what they are; the title block names the entries."}
  - {rev: 4, date: "2026-11-19", change: "The Kleidos drawing sheet, its mark in the title block."}

# The vendor's print hangs a net label on one pin only for ES7210_INT, DMIC_CLK
# and Lora_P1.01_GPIO2 (labels leading nowhere else); the drawing keeps them.
erc_ignore: [isolated_pin_label]

