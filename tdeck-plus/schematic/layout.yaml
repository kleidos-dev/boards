          - [P2, {col: [CW1, CW2, CW3, CW22, RY34]}]
          - [U9, {col: [CW5, R3Y]}]
      - title: Touch connector
        rows:
          - [P4, {col: [RY35, CW24, CW6, CW7]}]
      - title: Keyboard connector and backlight
        rows:
          - [JP1, Q3, {col: [R18]}]
      - title: 40 MHz crystal
