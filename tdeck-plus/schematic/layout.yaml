          - [U2, {cols: [[C3, C4, C23, C24, R9, R1, R2, R7, R8], [C12, C13, C14, C15, C21, C16, C17, C18, C19], [C20, C22, CY5, CY6, CY7, CY8]]}]
      - title: Speaker amplifier
        rows:
          - [U6, {col: [L4, C35, C36, R20, R21, R22, R16]}]
          - [{cols: [[L2, L3, CP1], [CP2, CP3, CP4], [CP5, CP6]]}, P1]
      - title: Microphone 1
        rows:
          - [MIC1, {col: [C1, C2, Rm1]}]
      - title: Microphone 2
        rows:
          - [MIC2, {col: [C7, CY1, Rm2]}]
      - title: Microphone 3
        rows:
          - [MIC3, {col: [CY4, CY3, Rm4]}]
      - title: Microphone 4
        rows:
          - [MIC4, {col: [C8, CY2, Rm3]}]
      - title: I2C level shifter (V3V side)
        rows:
          - [Q1, Q2]
          - [{cols: [[RC1, RC2], [RC3, RC4]]}]
  - file: gps.kicad_sch
    name: GPS daughterboards
    summary: "The two GPS daughterboards LILYGO publishes for the T-Deck: the MIA-M10Q board (parts +100) and the L76K board (parts +200), each with its backup cell, antenna connector and 5-pin connector."
    parts: "U101 MIA-M10Q, J101 J201 MS412FE, J102 J202, J103 J203 IPEX, U201 L76K"
    pwr_flags: [M10_GND, L76K_GND]
    blocks:
      - title: "MIA-M10Q board (T-Deck-GPS V1.0)"
        rows:
          - [U101, {cols: [[C101, C107, C108], [R101, R102]]}]
          - [{cols: [[R104, C105, L101, C106], [D101, R103]]}, J101, J103, J102]
      - title: "L76K board (T-Deck-L76K V1.0)"
        rows:
          - [U201, {cols: [[C207, C208, C201], [R201, C204, R202], [C205, L201]]}]
          - [{cols: [[R204, C206, C202, C203], [D201, R203]]}, J201, J203, J202]
  - file: tree.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from the USB-C input and the battery to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
    name: Nets and signals
    index: nets
    summary: "Every rail and every net drawn on more than one page, with the page/zone of its labels; the ESP32-S3 and ESP32-C3 GPIO, the I2C addresses, every pull-up and pull-down."
  - file: parts.kicad_sch
    name: Parts
    index: parts
    summary: "Every part: its value as printed, what it is, its nets, whether it is fitted and where it is drawn. A reference on the drawing leads to its row, the row back to it."

power_tree:
  title: Power tree
  pitch: [27.94, 17.78]
  nodes:
    U7: [0, 0]
    VBUS: [1, 0]
    D1: [2, 0]
    UP1: [2, 1]
    P3: [2, 2]
    VBAT: [3, 2]
    Q5: [4, 2]
    SW1_IN: [5, 0]
    SW1: [6, 0]
    +5V: [7, 0]
    U8: [8, 0]
    L5: [9, 0]
    VDD3V3: [10, 0]
    Q6: [11, 0]
    V3V: [12, 0]
    Q4: [8, 1]
    BAT: [9, 1]
  edges:
    - [U7, VBUS]
    - [VBUS, D1]
    - [VBUS, UP1]
    - [UP1, VBAT]
    - [P3, VBAT]
    - [VBAT, Q5]
    - [D1, SW1_IN]
    - [Q5, SW1_IN]
    - [SW1_IN, SW1]
    - [SW1, +5V]
    - [+5V, U8]
    - [+5V, Q4]
    - [U8, L5]
    - [L5, VDD3V3]
    - [Q4, BAT]
    - [VDD3V3, Q6]
    - [Q6, V3V]
  note: "Q5 conducts while VBUS is absent (its gate is on VBUS). Q4 and Q6 share PWR_GATE, which Q7 pulls low while PWR_EN (IO10) is high. The GPS daughterboard takes VDD3V3 from P8 (K3); its own nets stay apart, as no cable is published."
