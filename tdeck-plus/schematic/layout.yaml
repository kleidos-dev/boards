root:
  title: Contents
  heading: "LILYGO T-Deck Plus schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page
        numbers at the bottom right of every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width.
        A dot joins lines; a cross on a pin end means the pin is not connected.
        Pins connect by net labels (the boxed names): pins whose labels carry
        the same name are on one net, on any page.
        [3/C4] after a label: page 3 carries that net too, its label in zone C4
        (column 4, row C of the border). Click it to land on that label.
        No [page/zone]: the net is on this page only.
        Click a part's reference to find its row in the parts list; the row's
        page/zone leads back. A part crossed out in red is not fitted (DNP).
        White: parts and their references. Grey: values, pin names, pin numbers.
        A dashed frame is a block of the circuit, titled at its top left.
        An amber K3 marks a Kleidos addition or correction: it leads to its row below.
    - title: Notes
      text: |
        Every part, pin and net of the T-Deck Plus mainboard and of its two GPS
        daughterboards, with the values the vendor documents: connectivity
        documented from the vendor's public documentation, with Kleidos additions and
        corrections listed on page 1 (LILYGO's T-Deck schematic of 2023-06-01 and
        its T-Deck-GPS V1.0 and T-Deck-L76K V1.0 sheets, cited in README.md and
        netlist.yaml). Layout and symbols are this project's. No footprints, no PCB.
        Values are as the vendor prints them (100K%1, 1uF/6.3V). A value of NC
        means not fitted: those parts are marked DNP.
        Designators are the vendor's. The GPS boards reuse the main board's, so
        theirs are +100 (MIA-M10Q board) and +200 (L76K board), and their nets
        carry M10_ and L76K_: no cable to the main board is published (what P8
        carries to the GPS board: K3, K7, K8).
        Nets the vendor left unnamed carry names of ours (U8_FB, PWR_GATE...).
        Zones: columns 1-8 and rows A-F, 50 mm apart, printed in the border.

sheets:
  - file: contents_continued.kicad_sch
    name: Contents, continued
    index: additions
    summary: "The rest of the Kleidos additions and corrections, which page 1 has no room for, each id leading to where it is marked; then the revision history."
  - file: power.kicad_sch
    name: Power input, charging and rails
    summary: "USB-C input, the Li-ion charger and battery, the power path and switch, the 3.3 V buck, and the V3V and BAT switches PWR_EN controls."
    parts: "U7 USB-C, UP1 TP4065B, P3 battery, D1 1N5819, Q5 SI2307, SW1, U8 SY8089AAC, Q4 Q6 SI2301, Q7 PMBT3904, LED1"
    pwr_flags: [GND]
    blocks:
      - title: USB-C input
        rows:
          - [U7, {col: [RC5, RC6]}]
      - title: Charger and battery
        rows:
          - [UP1, {cols: [[C39, CW4, R25], [LED1, RW1]]}]
          - [P3, {col: [C45, C46, RD1]}]
      - title: Power path and switch
        rows:
          - [D1, Q5, SW1, {col: [RD4, C40, C41]}]
      - title: 3.3 V buck (VDD3V3)
        rows:
          - [U8, {cols: [[L5, RY1, RY2], [R23, R24, C42], [C43, C44]]}]
      - title: V3V and BAT switches (PWR_EN)
        rows:
          - [Q4, Q6, Q7]
          - [D2, D3, {cols: [[RQ1, R26], [R27, R28]]}]
      - title: Battery voltage (BAT_ADC)
        rows:
          - [{col: [RD2, RD3, CD1]}]
  - file: soc.kicad_sch
    name: ESP32-S3, TF card, trackball and LoRa
    summary: "The ESP32-S3-WROOM-1 with reset, boot key and the UART header, the TF card on the shared SPI bus, the trackball's Hall sensors and key, and the LoRa module with its antenna."
    parts: "U1 ESP32-S3-WROOM-1, S1, KEY1, P8, TF MP3T-F, UZ1-UZ4 AN48841B, T1, U0 HPD16A, XX2"
    blocks:
      - title: ESP32-S3 module
        rows:
          - [U1, {cols: [[C5, C6], [R6, C9, S1]]}]
      - title: Trackball
        rows:
          - [UZ1, UZ2, {col: [CW8, CW10]}]
          - [UZ3, UZ4, {col: [CCW4, CCE5]}]
          - [T1, KEY1, {col: [RY31]}]
      - title: TF card
        rows:
          - [TF, {cols: [[RU1, RU2, RU3], [R3, R4, R5], [C10, C11]]}]
      - title: LoRa module
        rows:
          - [U0, {col: [C50, C51, R50]}, XX2]
      - title: UART header
        rows:
          - [P8]
  - file: keyboard.kicad_sch
    name: Keyboard controller, display and touch
    summary: "The ESP32-C3 that scans the keyboard, with its flash, crystal and UART header; the keyboard connector and its backlight switch; the LCD connector with its backlight driver; the touch connector."
    parts: "U5 ESP32-C3, U3 W25Q32FVSS, U4 40 MHz, J1, JP1 keyboard, Q3 BSS138, P2 LCD, U9 AW9364DNR, P4 touch"
    blocks:
      - title: ESP32-C3 keyboard controller
        rows:
          - [U5, {cols: [[L1, C31, C32, C28, C29], [C33, C34, C38, R19, C37]]}]
