#
# The markdownlint rules for this repository's Markdown, read by CodeRabbit's
# markdownlint (markdownlint-cli2) and by any local run. markdownlint-cli2
# reads this file after .markdownlint-cli2.jsonc, so it starts from the
# quality kit's base too: only the rules that catch a broken table are on
# (kleidos-dev/.github docs/quality.md). Markdown prose is never hard-wrapped
# (AGENTS.md); md_nowrap.py holds that rule, not MD013.
extends: .github/quality/markdownlint.jsonc

# Added here: a heading may recur under different parents (each board's
# sections), but never twice under the same one.
MD024:
  siblings_only: true
