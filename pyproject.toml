#
# The analysis tools' configuration (this repository is no Python package:
# its code is scripts under _shared/, a board's builder, the tests and an
# agent skill's tool). Each tool starts from the quality kit
# (kleidos-dev/.github docs/quality.md); what follows the kit's part is this
# repository's own.

[tool.ruff]
extend = ".github/quality/ruff.toml"
# .python-version's: every job runs the code on it, the schematic job too
# (beside KiCad's image's own older Python).
target-version = "py315"

[tool.mypy]
# >>> kleidos-quality mypy (synced from kleidos-dev/.github quality/mypy/block.toml; do not edit)
strict = true
# An ignore names the error it silences, so it cannot hide a second one.
enable_error_code = ["ignore-without-code"]
# <<< kleidos-quality mypy
python_version = "3.15"
files = ["_shared", "sticks3", "tests", ".claude/skills", "typings"]
# The scripts import each other from beside them (each puts its own folder on
# sys.path), so mypy resolves them there too.
# typings/ holds stubs for the fontTools API the legends read.
mypy_path = ["_shared", "_shared/kicad", "typings"]

# cairosvg, the skill tool's optional SVG renderer, ships no type information
# (no py.typed), typeshed has no stub for it, and it is not in requirements.txt
# (the tool falls back to rsvg-convert or Inkscape).
[[tool.mypy.overrides]]
module = ["cairosvg"]
ignore_missing_imports = true
