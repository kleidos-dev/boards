kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. The datasheets and documents are cited in full under source.also_read; a bench path is under
  # this folder; improvements.md holds the triage (T-ids) and README.md lists what is still open.
  - id: K1
    kind: addition
    what: "Q1_GATE drives Q1, a 12 V P-channel MOSFET: drain on VBAT_IN, source on VBAT_OUT."
    element: {net: Q1_GATE}
    source:
      type: datasheet
      cite: "LP3218DT1G datasheet Rev.B, p. 1, pin configuration: 1, 2, 5, 6 drain, 3 gate, 4 source"
  - id: K2
    kind: addition
    what: "BAT_SW joins the sources of Q2 (drain on BAT, gate on GND) and Q3, back to back."
    element: {net: BAT_SW}
    source:
      type: datasheet
      cite: "LP3218DT1G datasheet Rev.B, p. 1, pin configuration"
  - id: K3
    kind: addition
    what: "Q3_GATE drives Q3, P-channel: drain on VBAT_IN, source on BAT_SW."
    element: {net: Q3_GATE}
    source:
      type: datasheet
      cite: "LP3218DT1G datasheet Rev.B, p. 1, pin configuration"
  - id: K4
    kind: addition
    what: "VBAT_OUT takes the cell through Q1 only while +5VIN is under 4.00 V: U3 holds RESET low there (push-pull, 140 ms min.)."
    element: {rail: VBAT_OUT}
    source:
      type: datasheet
      cite: "CN803/809/810 datasheet Rev 0, pp. 2, 4 (CN809J: 4.00 V, active low)"
  - id: K5
    kind: addition
    what: "R5 3.3KΩ sets U1's charge current, about 0.30 A (float 4.2 V)."
    element: {pull: R5}
    source:
      type: datasheet
      cite: "TP4057 datasheet, p. 7: RPROG = 1000 / IBAT; VFLOAT 4.2 V"
  - id: K6
    kind: addition
    what: "+3.3V from U4 is 0.6 V × (1 + 68K/15K) = 3.32 V."
    element: {rail: "+3.3V"}
    source:
      type: datasheet
      cite: "AN_SY8089 Rev 0.9A, p. 2 (pin table: Vout = 0.6 × (1 + R1/R2)), p. 4 (VREF 0.6 V)"
  - id: K7
    kind: addition
    what: "U9's ROW0-7 and COL0-9 have 105 kΩ pull-ups, on from reset: they hold the unconnected ROW7 (pin 1), COL8 and COL9."
    element: {pin: U9.1}
    source:
      type: datasheet
      cite: "TCA8418 SCPS215G, pp. 5, 34; bench/2026-11-17-i2c-scan.md"
  - id: K8
    kind: addition
    what: "AMP_EN high runs U5, low shuts it down: on unless a plug is in."
    element: {net: AMP_EN}
    source:
      type: datasheet
      cite: "NS4150 user manual V1.0, Section 9.6, Table 4, p. 11; Cardputer-Adv docs page: a 3.5 mm plug disables the amplifier"
  - id: K9
    kind: addition
    what: "The ES8311 U6 answers at I2C address 0x18 (CE on AGND)."
    element: {i2c: U6}
    source:
      type: datasheet
      cite: "ES8311 datasheet Rev 7.0, p. 5: 0011 00x, x = CE; bench/2026-11-17-i2c-scan.md"
  - id: K10
    kind: addition
    what: "ANT101, on ANT_FEED, is a 2.4 GHz 3D antenna."
    element: {net: ANT_FEED}
    source:
      type: vendor-doc
      cite: "Stamp-S3A docs page, specifications"
  - id: K11
    kind: addition
    what: "U103, the RGB LED GPIO21 drives, is a WS2812B-2020."
    element: {net: GPIO21}
    source:
      type: vendor-doc
      cite: "Stamp-S3A docs page, specifications"
  - id: K12
    kind: correction
    what: "J102's block is a USB-C port: its part is USB-TYPEC, with CC pull-downs."
    vendor: "the block is titled Type-A USB"
    element: {part: J102}
    source:
      type: vendor-doc
      cite: "Cardputer-Adv and Stamp-S3A docs pages (USB Type-C); the sheet's part USB-TYPEC, R101, R102"
  - id: K13
    kind: addition
    what: "GPIO0 is a strap, weak pull-up at reset: low, with GPIO46 low, selects download boot."
    element: {gpio: GPIO0}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Tables 3-1, 3-3, pp. 32-33; bench/2026-11-17-boot-strap.md"
  - id: K14
    kind: addition
    what: "GPIO3 is a strap (JTAG signal source), floating at reset."
    element: {gpio: GPIO3}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Table 3-1, p. 32"
  - id: K15
    kind: addition
    what: "GPIO11, U9 ~INT, is open drain and active low."
    element: {gpio: GPIO11}
    source:
      type: datasheet
      cite: "TCA8418 SCPS215G, p. 3, pin 24"
  - id: K16
    kind: addition
    what: "GPIO45, unconnected, is a strap with a weak pull-down: low selects VDD_SPI 3.3 V unless an eFuse forces it."
    element: {gpio: GPIO45}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Tables 3-1, 3-4, pp. 32, 34; bench/2026-11-17-boot-strap.md"
  - id: K17
    kind: addition
    what: "GPIO46 is a strap, weak pull-down; it latches low with the codec attached."
    element: {gpio: GPIO46}
    source:
      type: bench
      cite: "bench/2026-11-17-boot-strap.md (boot:0x2b, bit 2 = GPIO46 by ESP32-S3 TRM v1.8, Register 6.15); ESP32-S3 datasheet v2.2, Tables 3-1, 3-3"
  - id: K18
    kind: addition
    what: "FLASH_VCC is 3.3 V, the FN8's VDD_SPI voltage, from VDD3P3_RTC through RSPI."
    element: {rail: FLASH_VCC}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Table 1-1, p. 13, Table 3-4, p. 34; bench/2026-11-17-boot-strap.md"
  - id: K19
    kind: correction
    what: "C114 is 12pF, X101's second load capacitor beside C109."
    vendor: "the value printed twice, 12pF 12pF"
    element: {part: C114}
    source:
      type: vendor-doc
      cite: "Stamp-S3 schematic v0.3.3, p. 1: both printed fields read 12pF, as C109 on X101's other pin does"

