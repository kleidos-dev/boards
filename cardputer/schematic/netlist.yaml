#
# M5Stack Cardputer-Adv (K132-Adv): every component, every pin and the net it is
# on, as the vendor's published schematics show them. Facts only: what connects
# where and through what. The drawing in this folder (cardputer.kicad_sch) is
# generated from this file; README.md says how, and how the two are checked
# against each other.
#
# The product is two boards with a schematic each: the Cardputer-Adv carrier
# (four sheets) and the Stamp-S3A core module (one sheet, the Stamp-S3 schematic
# v0.3.3 both docs pages link). Read from their printed pages and from the
# netlist Altium wrote into each PDF's bookmarks (Nets -> Pins, per sheet),
# which every connection here matches. Values come from the printed pages, except
# where a Kleidos addition or correction (the "kleidos" list, each marked on the
# drawing and listed on page 1 with its source) adds what a primary source makes
# certain: a datasheet, the vendor's other documents or a bench record in bench/.
#
# Conventions:
# - pins are the vendor's pin numbers;
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "renamed" with the name Altium generated for it;
# - NC is a pin the schematic connects to nothing else;
# - both schematics number their parts from 1, so the module's parts are
#   numbered +100 here (its U1 is U101, M1 is M101, JP2 is JP102...);
# - the module's pins (M101, STAMP-S3M) land on the carrier's sockets P1 and P2,
#   which the carrier sheet draws wired pin for pin to the module's footprint
#   (M1, STAMP-S3-DIP-1.27): P1 pin n is module pin n (1-17), P2 pin n is module
#   pin 29 - n (18-28). A net the module and the carrier share takes the
#   carrier's name; the module's own name for it is under "aliases";
# - the carrier sheets join by net name across sheets (the bookmarks list G3 on
#   P1 of page 1 and on P3 of page 4, and so on).

board: cardputer
