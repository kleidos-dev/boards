rails:   # nominal: the voltage the net's name states (3V3, 5V), USB's 5 V for VBUS, the
         # printed divider for BOOST_OUT, the cell for BAT and the two VBAT nets
  USB_VBUS:
    nominal: "5 V"
    from: J102
    what: "USB-C VBUS on the module (J102), into the fuse F101 6V/1A/PPTC."
  "+5VIN":
    nominal: "5 V"
    from: F101
    what: "USB VBUS after F101 (the module's VIN_5V, on M101 pin 13 / P1 pin 13). Feeds the module's buck U104 and its LCD connector J101 pin 12, and on the carrier the charger U1 (through R1 0.8Ω), the supervisor U3, D1 into VBAT_OUT, SW2 and EXT P3 pin 14."
  BAT:
    nominal: "Li-ion cell"
    from: "J1, J8"
    what: "The battery connectors J1 (BAT+ pin 2, BAT- pin 1) and J8 (pin 1, pin 2 GND); to Q2."
  VBAT_IN:
    nominal: "Li-ion cell"
    from: "U1, Q3"
    what: "U1 TP4057 charger output (BAT, PROG R5 3.3KΩ); joined to BAT through Q2 and Q3, back to back (Q2's gate on GND; SW1 sets Q3's through R9). Divided by R8 / R12 100KΩ to G10."
  VBAT_OUT:
    nominal: "VBAT_IN or +5VIN"
    from: "Q1, D1"
    what: "Q1 from VBAT_IN, its gate held by the CN809J U3 (RESET, watching +5VIN: low below 4.00 V, so Q1 conducts only without USB) and R7 100KΩ to GND; D1 SS34 from +5VIN. Feeds the boost U2 (through R2 0Ω) and the buck U4."
    enable: "Q1 gate: U3 RESET"
  BOOST_OUT:
    nominal: "5.29 V"
    from: U2
    what: "U2 SY7088 boost from VBAT_OUT through L1 3015 1.5uH; R4 75KΩ over R6 22KΩ on FB, by the printed formula Vout = 1.2V*(R1/R2+1): 5.29 V. To D2."
  "+5VOUT":
    nominal: "5 V"
    from: D2
    what: "BOOST_OUT through D2 SS34. To SW2 (Grove), FPC1 pin 4 and EXT P3 pin 12."
  "+5VGrove":
    nominal: "5 V"
    from: SW2
    what: "SW2 picks +5VOUT (pin 1) or +5VIN (pin 3) for the Grove port J2 pin 3."
  "+3.3V":
    nominal: "3.3 V"
    from: "U4, U104"
    what: "U4 SY8089 buck from VBAT_OUT through L2 3015 4.7uH (R11 68KΩ over R13 15KΩ on FB: 0.6 V × (1 + 68K/15K) = 3.32 V); and the module's U104 JW5712 buck from +5VIN through L104 (\"IOUT: 0~0.6A\" printed), the module's VDD_3V3, joined through M101 pin 28 / P2 pin 1. Supplies the ESP32-S3, the keyboard scanner U9, the motion sensor (through FB7), the codec (through R24), the amplifier U5 (through FB3), the microphone (through R41), the microSD card, the LCD connectors J101 / J103 (pin 2) and the backlight switch U102, FPC1 pin 2 and the pull-ups."
    enable: "U4: EN tied to IN; U104: EN pulled up to +5VIN by R116 100K/1%"
  BL_3V3:
    nominal: "3.3 V"
    from: U102
    what: "U102 AW35122FDR load switch from +3.3V. Supplies the LCD backlight (J101 and J103 pin 8) and the RGB LED U103."
    enable: "DISP_BL (GPIO38)"
  FLASH_VCC:
    nominal: "3.3 V"
    from: U101
    what: "The ESP32-S3FN8's VDD_SPI pin (29), decoupled by C104 and C126: the supply of the flash in the package, 3.3 V (the FN8's VDD_SPI voltage) from VDD3P3_RTC through RSPI; GPIO45, unconnected, latches low, which selects 3.3 V unless an eFuse forces VDD_SPI."
  AVDD:
    nominal: "3.3 V"
    from: R24
    what: "From +3.3V through R24 33R/1%. The ES8311's PVDD, DVDD and AVDD."
  AGND:
    nominal: "0 V"
    from: R26
    what: "Audio ground, joined to GND at one point through R26 0Ω."

i2c:
  bus: {sda: G8 (GPIO8), scl: G9 (GPIO9), pullups: "R35 (SDA) and R36 (SCL), 3.3KΩ to +3.3V"}
  devices:
    - {ref: U9, part: TCA8418RTWR, address: "0x34", source: "\"7-bit Address 34H\" printed beside U9 (carrier page 2)"}
    - {ref: U7, part: BMI270, address: "0x69", source: "\"7-bit Address 69H\" printed beside U7 (carrier page 3); SDO (pin 1) pulled up by R43"}
    - {ref: U6, part: ES8311, address: "0x18", source: "not printed; Kleidos addition K9: the ES8311 datasheet's address 0011 00x with x = CE, and CE (pin 20) is on AGND; M5Unified es8311_i2c_addr0 = 0x18 and the bench scan (see source.also_read) agree"}
  also_on_bus: "FPC1 pins 6 (IO2, SDA) and 7 (IO3, SCL); EXT P3 pins 11 (SDA) and 10 (SCL)"
  grove: "A second pair, GI (GPIO1) and GO (GPIO2), goes to the Grove port J2 (IIC_SCL pin 1, IIC_SDA pin 2) with R10 and R3 10KΩ up to +3.3V; no device on the board sits on it."

