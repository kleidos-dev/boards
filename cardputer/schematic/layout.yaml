      - title: Module pins and UART TX resistor
        rows:
          - [M101, {col: [D102, R105]}]
      - title: USB-C
        rows:
          - [J102, L105, {cols: [[R101, R102, F101], [D103, D104, D114], [JP102, JP103, PHD101]]}]
  - file: power.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from the USB-C and the battery to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
    name: Nets and signals
    index: nets
    gpio_title: ESP32-S3 GPIO (U101)
    test_points: {title: "Pads", sub: "The one-pin pads and the plated hole the print draws."}
    summary: "Every rail and every net drawn on more than one page, with the page/zone of its labels; the ESP32-S3 GPIO, the I2C addresses, the pads, every pull-up and pull-down."
