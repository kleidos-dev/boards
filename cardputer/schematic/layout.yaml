    summary: "The module's sheet (Stamp-S3 v0.3.3): the ESP32-S3FN8 with its RF path, crystal and decoupling, the 3.3 V buck, the LCD connectors and backlight switch, the RGB LED, the G0 button, the USB-C and the module's pins."
