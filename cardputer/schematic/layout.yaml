# SPDX-FileCopyrightText: 2026 José M. Requena Plens <jmrplens@kleidos.dev>
#
# How the Cardputer-Adv schematic is drawn: the symbol each part takes, our own
# symbols, and the sheets, blocks and rows the parts sit in. The facts (values,
# pins, nets) are in netlist.yaml; _shared/kicad_schematic.py joins the two.
#
# parts: a part takes the symbol its prefix names under _by_prefix unless it has
# a row of its own. "pins" maps our symbol's pin number to the vendor's pin
# (a list when one of our pins stands for several of the vendor's, "-" when the
# vendor has no such pin). "angle" turns the symbol (90: a vertical two-pin part
# lies flat).
# rows: each row of a block is laid left to right; an item is a reference,
# {col: [...]} for a column of two-pin parts, {cols: [[...], [...]]} for
# several, or {text: ...}.
# sheets: one page per vendor sheet (the carrier's four, then the module's
# one), in the vendor's order; "summary" and "parts" fill the sheet's box on the
# contents page; a sheet with "index" (power, nets, parts) is a page of tables
# the generator writes from netlist.yaml, after the drawing.
# root: the contents page's heading and the panels of its right-hand column;
# revisions: the history the contents page prints (the last one is in every
# title block). short: what a part is, in the parts list and the power tree.
# power_tree: its boxes, [column, row], and arrows, each a connection
# netlist.yaml has (the generator refuses any other); "NET@2" draws a net twice.

paper: A2
title_block:
  title: M5Stack Cardputer-Adv (K132-Adv)
  company: "Kleidos boards: connectivity documented from the vendor's public documentation"
  comments:
    - "Sources: M5Stack Cardputer-Adv v1.0 and Stamp-S3 v0.3.3 schematics; README.md"
    - "Values as documented. Layout and symbols: Kleidos boards"
    - "License: MIT. github.com/kleidos-dev/boards"

revisions:
  - {rev: 1, date: "2026-11-17", change: "First drawing in the boards' schematic format: every part, pin and net of the carrier's four sheets and the module's sheet, from the vendor's public documentation."}
  - {rev: 2, date: "2026-11-17", change: "Kleidos additions and corrections K1-K19, listed above: the power path's MOSFETs, supervisor, charge current and 3.3 V, the key scanner's pulls, the amplifier's enable, the codec's address, the module's antenna, LED, USB-C and C114, the ESP32-S3 straps and VDD_SPI."}
  - {rev: 3, date: "2026-11-17", change: "An entry is marked wherever an index page shows its element again; a pin on no net says what it is on the nets page; the title block says the drawing carries entries."}

