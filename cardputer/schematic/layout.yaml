root:
  title: Contents
  heading: "M5Stack Cardputer-Adv (K132-Adv) schematic"
  subheading: "Kleidos boards: every part, pin and net of the carrier and its Stamp-S3A module, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page
        numbers at the bottom right of every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width.
        A dot joins lines; a cross on a pin end means the pin is not connected.
        Pins connect by net labels (the boxed names): pins whose labels carry
        the same name are on one net, on any page.
        [3/C4] after a label: page 3 carries that net too, its label in zone C4
        (column 4, row C of the border). Click it to land on that label.
        No [page/zone]: the net is on this page only.
        Click a part's reference to find its row in the parts list; the row's
        page/zone leads back. A part crossed out in red is not fitted (DNP).
        White: parts and their references. Grey: values, pin names, pin numbers.
        A dashed frame is a block of the circuit, titled at its top left.
        An amber K3 marks a Kleidos addition or correction: it leads to its
        row below.
    - title: Notes
      text: |
        Every part, pin and net of the Cardputer-Adv, with the values the vendor
        documents: connectivity documented from the vendor's public documentation,
        with Kleidos additions and corrections listed on page 1 (M5Stack's
        Cardputer-Adv schematic v1.0 and Stamp-S3 schematic v0.3.3, the docs
        pages, the datasheets and bench records each entry cites; README.md and
        netlist.yaml beside this file). Layout and symbols are this project's.
        No footprints, no PCB, no part numbers beyond the documented ones.
        Values are as the vendor prints them (10KΩ, 10K/1%, 22uF), but where an
        entry below says otherwise. A value of NC means not fitted: that part
        is marked DNP.
        Pages 2 to 5 are the carrier's four sheets, page 6 the module's.
        Both number their parts from 1, so the module's are numbered +100
        here (its U1 is U101, its M1, the module's pins, is M101).
        The module's pins land on the carrier's sockets P1 and P2. A net
        they share takes the carrier's name (GPIO8 on the module is G8).
        GI and GO are the vendor's names for the Grove pair (GPIO1, GPIO2).
        Nets the vendor left unnamed carry names of ours (U2_FB, SD_CS...).
        Zones: numbered columns and rows A-H, 50 mm apart, printed in the border.

sheets:
  - file: carrier_main.kicad_sch
    name: Power, sockets and ports
    summary: "Carrier sheet 1: the charger, battery, power switch and power path, the 5 V boost and 3.3 V buck, the module's sockets, the reset and G0 buttons, the microSD socket, the Grove port, the FPC expansion connector and the IR emitter."
    parts: "U1 TP4057, J1 J8 battery, Q1-Q3 LP3218DT1G, SW1, U3 CN809J, U2 SY7088, U4 SY8089, P1 P2 module sockets, BTN1 BTN2, J3 microSD, J2 Grove, SW2, FPC1, IR1"
    pwr_flags: [GND]
    blocks:
      - title: Charger
        rows:
          - [U1, {col: [R1, C1, R5, C6]}]
      - title: Battery, power switch and power path
        rows:
          - [J1, J8, {col: [C7]}, Q2, Q3]
          - [SW1, {col: [R9]}, U3, Q1, {col: [R7, D1, C2]}]
          - [{col: [R8, R12, C10]}]
      - title: 5 V boost
        rows:
          - [U2, {cols: [[R2, L1, C4, C5], [R4, R6, C3, D2]]}]
      - title: 3.3 V buck
        rows:
          - [U4, {cols: [[L2, R11, R13], [C11, C12, C8, C9]]}]
      - title: Module sockets
        rows:
          - [P1, P2]
      - title: Reset and G0 buttons
        rows:
          - [{cols: [[BTN1, D4, R15], [BTN2, D5, R18]]}]
      - title: microSD
        rows:
          - [J3, {cols: [[R19, R20, R21, R22, C18], [D9, D10, D11, D12, D13]]}, {col: [J5, J6]}]
      - title: Grove port
        rows:
          - [J2, SW2, {cols: [[R3, R10, C14], [D6, D7, D8]]}]
      - title: FPC expansion connector
        rows:
          - [FPC1]
      - title: IR emitter
        rows:
          - [IR1, {col: [R14]}]
  - file: keyboard.kicad_sch
    name: Keyboard
    summary: "Carrier sheet 2: the TCA8418RTWR key scanner on the I2C bus, its column resistors and the 56 keys in a matrix of seven rows and eight columns."
    parts: "U9 TCA8418RTWR, R27-R34, S1-S56"
    blocks:
      - title: Key scanner
        rows:
          - [U9, {cols: [[R35, R36, R37, R38, C21], [R27, R28, R29, R30], [R31, R32, R33, R34]]}]
      - title: "Keys, as the vendor lays them out: four rows of 14 (matrix rows ROW0-ROW6, columns Y0-Y7)"
        rows:
          - [{cols: [[S1, S15, S29, S43], [S2, S16, S30, S44], [S3, S17, S31, S45], [S4, S18, S32, S46],
                     [S5, S19, S33, S47], [S6, S20, S34, S48], [S7, S21, S35, S49], [S8, S22, S36, S50],
                     [S9, S23, S37, S51], [S10, S24, S38, S52], [S11, S25, S39, S53], [S12, S26, S40, S54],
                     [S13, S27, S41, S55], [S14, S28, S42, S56]]}]
  - file: audio_imu.kicad_sch
    name: Motion sensor and audio
    summary: "Carrier sheet 3: the BMI270 motion sensor, the ES8311 codec and its supply, the microphone, the NS4150B amplifier and speaker connector, the headphone jack and its detect switch."
    parts: "U7 BMI270, U6 ES8311, U8 MSM381A3729H9BPC, U5 NS4150B, J4 speaker, J7 PJ-342, Q4 2N7002T"
    pwr_flags: [AGND]
    blocks:
      - title: Motion sensor
        rows:
          - [U7, {col: [R43, FB7, C25, C27]}]
      - title: Audio codec
        rows:
          - [U6, {cols: [[R24, C26, C31, R26], [C22, C23, C24], [C28, C29, C30]]}]
      - title: Microphone
        rows:
          - [U8, {col: [R41, C33]}]
      - title: Amplifier and speaker
        rows:
          - [U5, {cols: [[R16, C13, R17, C15], [R23, C16, C17, FB3], [FB1, FB2, C19, C20]]}, J4]
      - title: Headphone jack and detect
        rows:
          - [J7, Q4, {cols: [[R25, R40, R42], [R39, D3, C32]]}]
  - file: ext.kicad_sch
    name: EXT header
    summary: "Carrier sheet 4: the 14-pin 2.54 mm EXT header."
    parts: "P3 HDR-SMD_14P-P2.54"
