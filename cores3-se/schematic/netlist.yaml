kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. A bench path is under this folder; firmware is the Kleidos firmware, by path and symbol;
  # README.md ("Kleidos additions and corrections") gives each source in full.
  - id: K1
    kind: addition
    what: "The BM8563 U4 answers at I2C address 0x51."
    element: {i2c: U4}
    source:
      type: datasheet
      cite: "BM8563 datasheet, address A2h"
  - id: K2
    kind: addition
    what: "The touch panel's FT6336U answers at 0x38."
    element: {i2c: CTP1}
    source:
      type: bench
      cite: "bench/2026-11-17-i2c-scan.md"
  - id: K3
    kind: addition
    what: "LCD1's panel: 2.0-inch 320x240 IPS, ILI9342C driver."
    element: {part: LCD1}
    source:
      type: vendor-doc
      cite: "K128-SE docs (2024), pp. 1, 5, 9"
  - id: K4
    kind: addition
    what: "LCD1 pin 7 (SPI_MISO, GPIO35) is the panel's D/C."
    element: {pin: LCD1.7}
    source:
      type: vendor-doc
      cite: "K128-SE docs (2024), pp. 8-9"
  - id: K5
    kind: addition
    what: "RTC alarm or timer on AXP_WAKEUP powers the board on."
    element: {net: AXP_WAKEUP}
    source:
      type: bench
      cite: "Kleidos firmware docs/hardware/introspection/axp2101.md, power-on source 0x20, 2026-10-07"
  - id: K6
    kind: addition
    what: "U7 is 8 MB (64 Mbit) quad-SPI PSRAM."
    element: {part: U7}
    source:
      type: vendor-doc
      cite: "K128-SE docs (2024), p. 1"
  - id: K7
    kind: addition
    what: "FLASH_VCC is 3.3 V: GPIO45 strap 0, no eFuse override."
    element: {rail: FLASH_VCC}
    source:
      type: bench
      cite: "bench/2026-11-17-efuse-strap-flash-psram.md"
  - id: K8
    kind: addition
    what: "GPIO45: no external pull, strap 0 (VDD_SPI 3.3 V)."
    element: {gpio: GPIO45}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Table 3-1"
  - id: K9
    kind: addition
    what: "GPIO46: no external pull; its pull-down holds strap 0."
    element: {gpio: GPIO46}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Table 3-1"
  - id: K10
    kind: addition
    what: "GPIO0: also the chip's weak pull-up; high boots flash."
    element: {gpio: GPIO0}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, Table 3-1"
  - id: K11
    kind: addition
    what: "GPIO3: JTAG-source strap, read if STRAP_JTAG_SEL set."
    element: {gpio: GPIO3}
    source:
      type: datasheet
      cite: "ESP32-S3 datasheet v2.2, 3.4"
  - id: K12
    kind: addition
    what: "U10 RSTN: low resets; internal 100 kohm pull-down."
    element: {pin: U10.23}
    source:
      type: datasheet
      cite: "AW9523B datasheet V1.5, pin 23"
  - id: K13
    kind: addition
    what: "VCC_BL: fed from DC-DC 1 inside, 0.5-3.3 V over I2C."
    element: {rail: VCC_BL}
    source:
      type: datasheet
      cite: "AXP2101 datasheet V1.0, DLDO1"
  - id: K14
    kind: addition
    what: "BUS_5V is 5.03 V: R11 15K / R12 4.7K, 1.2 V FB."
    element: {rail: BUS_5V}
    source:
      type: datasheet
      cite: "SY7088 datasheet, FB pin"
  - id: K15
    kind: addition
    what: "U14 current limit: about 1 A (60 kohm / R17 60K)."
    element: {part: U14}
    source:
      type: datasheet
      cite: "ME1502 datasheet V02, pin 3"
  - id: K16
    kind: addition
    what: "U17 current limit: about 1 A (60 kohm / R44 60K)."
    element: {part: U17}
    source:
      type: datasheet
      cite: "ME1502 datasheet V02, pin 3"
  - id: K17
    kind: addition
    what: "U18 current limit: about 2 A (60 kohm / R45 30K)."
    element: {part: U18}
    source:
      type: datasheet
      cite: "ME1502 datasheet V02, pin 3"
  - id: K18
    kind: addition
    what: "U19 current limit: about 2 A (60 kohm / R46 30K)."
    element: {part: U19}
    source:
      type: datasheet
      cite: "ME1502 datasheet V02, pin 3"
  - id: K19
    kind: addition
    what: "U2 output is open collector; R4 pulls ESP_BOOT up."
    element: {pin: U2.4}
    source:
      type: datasheet
      cite: "LMV331 datasheet SLCS136V, Features"
