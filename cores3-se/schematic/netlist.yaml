rails:   # nominal: the voltage the net's name states (3V3, 1V8, 5V), USB's 5 V for VUSB
         # and VBUS, a Li-ion cell for VBAT (the AXP2101 is a single-cell Li-ion PMU,
         # by its datasheet's title); "not printed" where neither the name nor the
         # print gives one (an AXP2101 output whose voltage is set over I2C)
  VUSB:
    nominal: "5 V"
    from: J1
    what: "USB-C VBUS (printed VCC) and J6 pin 1; U17 drives it from BUS_OUT for USB OTG."
    pages: [2, 6]
  VBUS:
    nominal: "5 V"
    from: "U18, U19"
    what: "The AXP2101's VBUS input (pin 37), from VUSB through U18 or from BUS_OUT through U19."
    enable: "U18 by USB_OTG_EN, U19 by BUS_OUT_EN, both low"
    pages: [1, 6]
  VBAT:
    nominal: "Li-ion cell"
    from: J5
    what: "Battery connector J5 pin 2: the AXP2101 BAT pin (33) and M5-Bus pin 30."
    pages: [1, 5]
  AXP_PS:
    nominal: "VBUS or VBAT"
    from: U1
    what: "AXP2101 VSYS (pin 34): its regulator inputs, the SY7088 boost, the AW88298; C124 220uF."
    pages: [1, 2, 4, 6]
  VDD_3V3:
    nominal: "3.3 V"
    from: U1
    what: "AXP2101 DC-DC 1 (LX1, L1, FB1): the ESP32-S3, AW9523B, LMV331, AW88298 IOVDD, LCD, touch and the signal pull-ups (not R1, R15 on RTC_VDD or R29 on BUS_OUT)."
    pages: [1, 2, 3, 4, 5]
  VCC_3V3:
    nominal: "3.3 V"
    from: U1
    what: "AXP2101 DC-DC 3 (LX3, L3, FB3): M5-Bus pin 12."
    pages: [1, 5]
  VDD_1V8:
    nominal: "1.8 V"
    from: U1
    what: "AXP2101 ALDO1 (pin 18): the AW88298 DVDD."
    pages: [1, 4]
  VDDA_3V3:
    nominal: "3.3 V"
    from: U1
    what: "AXP2101 ALDO2 (pin 19): the ES7210 supplies."
    pages: [1, 4]
  VDDCAM_3V3:
    nominal: "3.3 V"
    from: U1
    what: "AXP2101 ALDO3 (pin 16): only C6; the greyed-out camera takes it on the print."
    pages: [1]
  VDD_3V3_SD:
    nominal: "3.3 V"
    from: U1
    what: "AXP2101 ALDO4 (pin 15): the microSD socket U11."
    pages: [1, 5]
  AVDD:
    nominal: "not printed"
    from: U1
    what: "AXP2101 BLDO1 (pin 12): only C13, C126; the greyed-out camera takes it on the print."
    pages: [1, 5]
  DVDD:
    nominal: "not printed"
    from: U1
    what: "AXP2101 BLDO2 (pin 14): only C12, C127; the greyed-out camera takes it on the print."
    pages: [1, 5]
  VCC_BL:
    nominal: "0.5-3.3 V, set over I2C"
    from: U1
    what: "AXP2101 DLDO1/DC1SW (pin 20), supplied inside the chip from DC-DC 1: the LCD backlight, LCD1 pin 9."
    pages: [1, 5]
  RTC_VDD:
    nominal: "not printed"
    from: U1
    what: "AXP2101 VRTC (pin 28): LED1 through R1, the R15 pull-up, and the BM8563 through D8."
    pages: [1, 2]
  RTC_BAT:
    nominal: "not printed"
    from: R16
    what: "BM8563 VDD (pin 8): RTC_VDD through D8 1N5819 and R16 100R; BAT1 not fitted."
    pages: [2]
  FLASH_VCC:
    nominal: "3.3 V"
    from: U5
    what: "ESP32-S3 VDD_SPI (pin 29): flash U6 and PSRAM U7; 3.3 V because the GPIO45 strap reads 0 (no external pull) and no eFuse forces it."
    pages: [3]
  VDDP_3V3:
    nominal: "3.3 V"
    from: L4
    what: "VDD_3V3 through L4 2.0nH: the ESP32-S3 VDD3P3 pins (2, 3)."
    pages: [3]
  BUS_5V:
    nominal: "5.03 V"
    from: U3
    what: "U3 SY7088 boost from AXP_PS through L5; R11 15K / R12 4.7K on FB set 1.2 V x (15/4.7 + 1) = 5.03 V. Feeds U14."
    enable: "BOOST_EN (AW9523B P1_7) through R13 47R"
    pages: [2, 6]
  BUS_OUT:
    nominal: "5 V"
    from: U14
    what: "U14 from BUS_5V: M5-Bus pin 28, Grove J3 pin 3. Fed in there, it reaches VBUS through U19."
    enable: "BUS_OUT_EN (AW9523B P0_1): high U14 on, low U19 on"
    pages: [1, 5, 6]
  AW_PVDD:
    nominal: "not printed"
    from: U8
    what: "The AW88298 boost output (PVDD, VBST), from AXP_PS through L6."
    pages: [4]
  VBIAS_MIC:
    nominal: "not printed"
    from: U9
    what: "ES7210 MICBIAS12 (pin 24): the microphones through L7 and L8."
    pages: [4]
  GNDA:
    nominal: "0 V"
    from: R22
    what: "Audio ground of the ES7210 and the microphones, joined to GND through R22 0R."
    pages: [4]

i2c:
  bus: {sda: "I2C_SYS_SDA (GPIO12)", scl: "I2C_SYS_SCL (GPIO11)", pullups: "R20 (SDA) and R32 (SCL), 2.2k/1% to VDD_3V3"}
  devices:
    - {ref: U1, part: AXP2101, address: "0x34", source: "printed on page 1 (\"I2C ADDR(7bit): 0x34\")"}
    - {ref: U8, part: AW88298, address: "0x36", source: "printed on page 4"}
    - {ref: CTP1, part: "FT6336U (on the touch panel)", address: "0x38", source: "bench 2026-11-17 (scan), CIPHER 0x64 read 2026-11-11; vendor docs"}
    - {ref: U9, part: ES7210, address: "0x40", source: "printed on page 4"}
    - {ref: U4, part: BM8563, address: "0x51", source: "BM8563 datasheet (write address A2h); bench 2026-11-17"}
    - {ref: U10, part: AW9523B, address: "0x58", source: "printed on page 5"}
  also_on_bus: M5-Bus pins 17 (SDA) and 18 (SCL), the touch connector CTP1 pins 3 and 4

