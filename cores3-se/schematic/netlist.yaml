#
# M5Stack CoreS3-SE (K128-SE): every component, every pin and the net it is
# on, as the vendor's published schematic shows them. Facts only: what
# connects where and through what. The drawing in this folder
# (cores3-se.kicad_sch) is generated from this file; README.md says how, and
# how the two are checked against each other.
#
# Read from: the six printed sheets of the PDF below that hold parts, and the
# netlist Altium wrote into the same PDF's bookmarks (Components and Nets ->
# Pins, per sheet), which every connection here matches. Values come from the
# printed sheets, except where an entry of "kleidos" (below) adds or corrects one. The parts the print greys out (Altium's compile mask:
# the camera connector, the MPU6886, the BMI270 and BMM150 of sheet 7) are in
# no bookmark netlist and are not here; README.md lists them.
#
# Conventions:
# - "page" is the page of the vendor's PDF the part is printed on (1-6);
# - pins are the vendor's pin numbers (or names, where the vendor's symbol
#   names its pins: J1's VBUS, A5...);
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "renamed" with the name Altium generated for it;
# - NC is a pin the schematic leaves unconnected (a no-connect cross, or a
#   pin alone on a net Altium named after it);
# - a named net with one pin (CAM_D2...) is a label the print draws on that
#   pin with nothing else on it on the SE: the camera it was named for is not
#   part of this board's netlist;
# - what the print does not show, or shows wrongly, and a primary source makes
#   certain (a datasheet, the vendor's other documents, a bench probe) is an
#   entry of "kleidos" at the end of this file, marked on the drawing and
#   listed on page 1.

board: cores3-se
source:
  title: CoreS3-SE schematic, Sch_M5_CoreS3_SE_v1.0 (Altium, seven A4 sheets, printed 2025-06-03)
  url: https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/498/Sch_M5_CoreS3_SE_v1.0.pdf
  listed_at: https://docs.m5stack.com/en/core/CoreS3%20SE
  read_from: https://web.archive.org/web/20260513112150/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/498/Sch_M5_CoreS3_SE_v1.0.pdf
  read_note: The vendor host refused connections from the machine that wrote this file on 2026-11-17; the Wayback Machine copy (captured 2026-05-13) was read instead.
  sha256: ff105808b6073ab487c63e0af776418a58bcf386c2b63f97e3083f5698847e2f
  checked: 2026-11-17
  pages:
    1: AXP2101 power management, reset and power keys, charge LED, battery connector (sheet A2-AXP)
    2: Boot strap comparator, USB-C, 5 V boost, BM8563 real-time clock (sheet A3-PSU)
    3: ESP32-S3, flash, PSRAM, 40 MHz crystal, RF path (sheet A4-ESP32S3)
    4: AW88298 amplifier, ES7210 audio ADC, two microphones, echo reference (sheet A5-AUDIO)
    5: AW9523B I/O expander, M5-Bus, LCD and touch connectors, microSD, Grove port A (sheet A6-GPIO)
    6: Power path load switches, bulk capacitors, mounting holes (sheet A7-POWER_PATH)
    7: BMI270 and BMM150 (sheet A8-ETC), all greyed out, in no netlist
  not_drawn: "The print greys out, and the bookmark netlist leaves out, the camera connector J2 (AFC34-S24FIA-00) with X2, C101, C114, C115, R31, R37, C77, C78 (page 5); the MPU6886 U16 with C80, C98, C100 (page 2); and all of page 7 (BMI270 U15, BMM150 U20, R50, C40, C43, C47, C79 and two unnamed 15K resistors). They are not part of the SE's design and not in this file."
  also_read:
    - url: https://docs.m5stack.switch-science.com/en/core/CoreS3%20SE
      mirror_of: https://docs.m5stack.com/en/core/CoreS3%20SE
      used_for: the link to the schematic, the pin map the GPIO table agrees with
      checked: 2026-11-16
    - url: https://media.distrelec.com/Web/Downloads/_t/ds/K128-SE_eng_tds.pdf
      title: M5CoreS3 SE (K128-SE) documentation page as PDF, update time 2024-05-24 (M5Stack)
      used_for: the BM8563 (0x51) and FT6336U touch controller (0x38) I2C addresses, which the schematic does not print
      checked: 2026-11-16

