#
# How the CoreS3-SE schematic is drawn: the symbol each part takes, our own
# symbols, and the sheets, blocks and rows the parts sit in. The facts (values,
# pins, nets) are in netlist.yaml; _shared/kicad_schematic.py joins the two.
#
# parts: a part takes the symbol its prefix names under _by_prefix unless it has
# a row of its own. "pins" maps our symbol's pin number to the vendor's pin
# (a list when one of our pins stands for several of the vendor's, "-" when the
# vendor has no such pin). "angle" turns the symbol (90: a vertical two-pin part
# lies flat).
# rows: each row of a block is laid left to right; an item is a reference,
# {col: [...]} for a column of two-pin parts, {cols: [[...], [...]]} for several,
# or {text: ...}.
# sheets: one drawing page per printed sheet of the vendor's PDF that holds
# parts (its sheets 1-6), in the vendor's order; "summary" and "parts" fill the
# sheet's box on the contents page; a sheet with "index" (power, nets, parts) is
# a page of tables the generator writes from netlist.yaml, after the drawing.
# root: the contents page's heading and the panels of its right-hand column;
# sheet_box: the height of a drawing page's box there, and the step to the next.
# revisions: the history the contents page prints (the last one is in every
# title block). short: what a part is, in the parts list and the power tree.
# power_tree: its boxes, [column, row], and arrows, each a connection
# netlist.yaml has (the generator refuses any other); "NET@x" draws a net twice.

paper: A3
title_block:
  title: CoreS3-SE (K128-SE)
  company: "Kleidos boards: connectivity documented from the vendor's public documentation"
  comments:
    - "Sources: M5Stack Sch_M5_CoreS3_SE_v1.0 (2025-06-03), docs; README.md"
    - "Values as documented. Layout and symbols: Kleidos boards"

revisions:
  - {rev: 1, date: "2026-11-17", change: "First drawing in the approved format: every part, pin and net of the SE's netlist, from the vendor's public documentation."}
  - {rev: 2, date: "2026-11-17", change: "Kleidos additions K1-K19, listed above, from datasheets, the vendor's docs page and bench probes."}
  - {rev: 3, date: "2026-11-17", change: "An entry is marked wherever an index page shows its element again; a pin on no net says what it is on the nets page; the title block says the drawing carries entries."}
  - {rev: 4, date: "2026-11-19", change: "The Kleidos drawing sheet, its mark in the title block."}

# A label on a single pin is how the vendor's print leaves the camera's nets on
# the SE (CAM_D2... on ESP32-S3 pins, CAM_RST on the AW9523B): drawn, named,
# with nothing else on them. KiCad's ERC warns on each; README.md says why the
# check is off.
erc_ignore: [isolated_pin_label]

grounds:
  GND: kleidos:GND
  GNDA: kleidos:GNDA

