  - file: power.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from USB-C, the M5-Bus and the battery to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
