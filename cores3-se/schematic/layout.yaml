root:
  title: Contents
  heading: "M5Stack CoreS3-SE (K128-SE) schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  sheet_box: [24.13, 27.94]
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page numbers at the bottom
        right of every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width. A dot joins lines; a cross
        on a pin end means the pin is not connected. Pins connect by net labels (the boxed names):
        pins whose labels carry the same name are on one net, on any page.
        [3/C4] after a label: page 3 carries that net too, its label in zone C4 (column 4, row C of
        the border). Click it to land on that label. No [page/zone]: the net is on this page only.
        Click a part's reference to find its row in the parts list; the row's page/zone leads back.
        A part crossed out in red is not fitted (DNP). White: parts and their references. Grey:
        values, pin names, pin numbers. A dashed frame is a block of the circuit, titled at its top
        left. An amber K3 marks a Kleidos addition or correction; click it for its row below.
    - title: Notes
      text: |
        Every part, pin and net of the CoreS3-SE's netlist, with the values the vendor documents:
        connectivity documented from the vendor's public documentation, with Kleidos additions and
        corrections listed on page 1 (M5Stack's Sch_M5_CoreS3_SE_v1.0 schematic, 2025-06-03, and
        its docs page, cited in README.md and netlist.yaml beside this file). Layout and symbols are
        this project's. No footprints, no PCB, no part numbers beyond the documented ones.
        Pages 2 to 7 are the vendor's sheets 1 to 6, in order. The parts the vendor's print greys
        out (camera connector, MPU6886, BMI270, BMM150) are not in the SE's netlist and are not
        drawn. Values are as the vendor prints them (10K/1%, 22uF 6.3V). A value of NC means not
        fitted: those parts are marked DNP. Reference designators are the vendor's; BAT1 is printed
        BAT1/NC. Nets the vendor left unnamed carry names of ours (AXP_LX1, BOOT_RC...).
        Zones: columns 1-8 and rows A-F, 50 mm apart, printed in the border.

sheets:
  - file: pmu.kicad_sch
    name: Power management
    summary: "Vendor sheet 1: the AXP2101 with its DC-DC and LDO outputs, the reset and power keys, the charge LED and the battery connector."
    parts: "U1 AXP2101, J5 battery, S1 reset key, S2 power key, LED1, D7"
    pwr_flags: [GND]
    blocks:
      - title: AXP2101 power management
        rows:
          - [U1, {cols: [[C1, C9, C4, L2, C3], [C2, C14, C19, C10, C20]]}]
      - title: DC-DC outputs
        rows:
          - [{cols: [[L1, C8], [L3, C15]]}]
      - title: LDO and RTC outputs
        rows:
          - [{cols: [[C5, C6, C7, C11], [C12, C13, C17, C16]]}]
      - title: Battery, TS divider, wake-up
        rows:
          - [J5, {col: [R29, R30, R15]}]
      - title: Reset and power keys
        rows:
          - [{cols: [[S1, S2], [R38, R39, C18, C97], [D1, D2]]}]
      - title: Charge LED and 3.3 V clamp
        rows:
          - [LED1, {col: [R1, D7]}]
  - file: psu.kicad_sch
    name: Boot strap, USB-C, boost, RTC
    summary: "Vendor sheet 2: the comparator that holds GPIO0 at power-up, the USB-C receptacle and header, the SY7088 5 V boost, the BM8563 clock."
    parts: "U2 LMV331, J1 USB-C, J6, U3 SY7088, U4 BM8563, Y1, BAT1 (not fitted)"
    blocks:
      - title: Boot strap comparator
        rows:
          - [U2, {cols: [[R2, C23, D3, R5], [C22, R3, D5, R7, R8], [R4, LED2, R10, C21]]}]
      - title: USB-C
        rows:
          - [J1, {cols: [[R6, R9, D4, D6], [R25, R47, C123]]}]
          - [J6]
      - title: 5 V boost
        rows:
          - [U3, {cols: [[L5, C24, C25, C26], [R11, R12, R13, R14], [C29, C27, C28]]}]
      - title: Real-time clock
