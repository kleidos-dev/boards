          - [U4, {cols: [[Y1, C30, C32], [D8, R16, BAT1, C33, C34]]}]
  - file: soc.kicad_sch
    name: ESP32-S3
    summary: "Vendor sheet 3: the ESP32-S3 with its flash and PSRAM, the 40 MHz crystal, the RF path to the chip antenna, the I2C pull-ups and the supply decoupling."
    parts: "U5 ESP32-S3, U6 GD25Q128/W25Q128, U7 ESPSRAM, X1 40 MHz, ANT1 PROANT440, J4 IPEX"
    blocks:
      - title: ESP32-S3
        rows:
          - [U5]
      - title: Flash and PSRAM
        rows:
          - [U6, {col: [C35, C36]}]
          - [U7, {col: [C37, C38]}]
      - title: 40 MHz crystal
        rows:
          - [X1, {col: [R33, C44, C51]}]
      - title: RF path
        rows:
          - [ANT1, J4, {cols: [[C68, C69, C86], [R35, R36, L9, C121]]}]
      - title: Supply decoupling
        rows:
          - [{cols: [[L4, C110, C122], [C31, C39, C41, C42, C119], [C45, C46, C48, C49, C50, C120]]}]
      - title: I2C pull-ups, UART and LCD_CS resistors
        rows:
          - [{cols: [[R20, R32], [R48, R49]]}]
  - file: audio.kicad_sch
    name: Audio
    summary: "Vendor sheet 4: the AW88298 amplifier, the ES7210 audio ADC, the two microphones and the echo reference taken from the speaker lines."
    parts: "U8 AW88298, U9 ES7210, U12 U13 MSM381A3729H9BPC"
    pwr_flags: [GNDA]
