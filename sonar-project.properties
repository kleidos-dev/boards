# SPDX-License-Identifier: MIT
#
# SonarQube Cloud project configuration for boards. The CI job that reads it
# is "📊 SonarCloud" in .github/workflows/check.yml. Scanner reference:
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

# --- Project identification ---
# One SonarQube Cloud organization per GitHub owner, its key the owner's login;
# each project's key is <organization>_<repository>, the form the import flow
# generates and every jmrplens project already uses (jmrplens_phonometry, ...).
sonar.organization=kleidos-dev
sonar.projectKey=kleidos-dev_boards
sonar.projectName=boards

# --- Layout ---
# The code: the builders and checks under _shared/, the StickS3's own build
# script, and the one tool of this repository's agent skills (the skills are
# this repository's source, AGENTS.md). Named explicitly so the drawings, the
# data, the models and the schematics never count as code.
sonar.sources=_shared,sticks3/build_sticks3_glb.py,.claude/skills/visual-reference-svg-reconstruction/tools
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# What sits inside a source root but is not this repository's code:
# _shared/kicad/ is the Kleidos KiCad kit, byte copies of the brand
# repository's kicad/ (held to its KIT.json), analysed there; and
# _shared/fixtures/ is the checks' test board, data that
# _shared/face_fixture.py writes. .github/commit-check/ (the commit-message
# gate synced from kleidos-dev/agents) is outside the source roots.
sonar.exclusions=_shared/kicad/**,_shared/fixtures/**

# --- Language ---
# The newest Python version SonarQube Cloud lists as supported; CI runs 3.15
# (check.yml), so raise this when the docs list it.
sonar.python.version=3.14

# --- Coverage ---
# The Cobertura report the "🧪 Tree checks and tests" job writes with relative
# paths (.coveragerc: relative_files = True, required on GitHub Actions) and
# hands to the SonarCloud job as the "coverage" artifact. It covers the tests
# that job runs (all but the board models', which run only when a model's
# inputs change), so main's coverage does not depend on which jobs a push
# started.
sonar.python.coverage.reportPaths=coverage.xml

# No sonar.issue.ignore.*, no coverage.exclusions and no cpd.exclusions to move
# a number: an issue is fixed with a real change or left open, and coverage is
# raised with tests (the Kleidos rule since 2026-07-12).
