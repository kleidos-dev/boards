kleidos:   # Kleidos additions to and corrections of the vendor's print: each marked on the drawing and listed
  # on page 1. A bench path is under this folder; the datasheets are cited in full under source.also_read
  # and in README.md ("Kleidos additions and corrections"); improvements.md holds the triage.
  - id: K1
    kind: addition
    what: "U2 PWRON has a built-in 100 kohm pull-up to APS."
    element: {net: PWR_KEY}
    source:
      type: datasheet
      cite: "AXP192 v1.1, p. 18, pin 23"
  - id: K2
    kind: addition
    what: "U4's open-drain INT presses PWR_KEY via C401: RTC wake."
    element: {net: RTC_INT}
    source:
      type: bench
      cite: "bench/2026-11-17-rtc-int-to-power-key.md"
  - id: K3
    kind: addition
    what: "VESP_3V3: DC-DC1 set to 3.30 V (register 26H reads 0x68)."
    element: {rail: VESP_3V3}
    source:
      type: bench
      cite: "bench/2026-11-17-dcdc1-setpoint.md"
  - id: K4
    kind: addition
    what: "SYS_INT: open drain, U2 IRQ and U7 INT; R2 is fitted."
    element: {net: SYS_INT}
