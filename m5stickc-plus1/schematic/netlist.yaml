#
# M5StickC Plus 1.1 (K016-P): every component, every pin and the net it is on,
# as the vendor's published schematic shows them, with the Kleidos additions
# and corrections listed under "kleidos" (each with its source, marked on the
# drawing and listed on page 1). Facts only: what connects where and through
# what. The drawing in this folder (m5stickc-plus1.kicad_sch)
# is generated from this file; README.md says how, and how the two are checked
# against each other.
#
# Read from: the one printed page of the PDF below, and the netlist Altium
# wrote into the same PDF's bookmarks (Components and Nets -> Pins), which
# every connection here matches. Values come from the printed page only.
#
# Conventions:
# - pins are the vendor's pin numbers (the USB-C receptacle's as A5, VBUS...;
#   the MOSFETs' as D, G, S);
# - net names are the vendor's; a net the vendor left unnamed gets a name of
#   ours, listed under "renamed" with the name Altium generated for it;
# - NC is a pin the schematic leaves unconnected (Altium gives each such pin a
#   net of its own, NetU2_3 and so on);
# - two parts carry no designator in the print and take ours: the
#   ESP32-PICO-D4 (printed U?) is U1, the battery connector (printed Li_Ion,
#   no reference) is J3.

board: m5stickc-plus1
source:
  title: StickC-Plus (K016-P) schematic, one page (Altium sheet StickC_SCH_Rebuild_V3010.SchDoc, exported 2025-11-04)
  url: https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/669/k016-p-StickC-Plus-sche.pdf
  listed_at: https://docs.m5stack.com/en/core/StickC-Plus
  read_from: https://web.archive.org/web/20260421142825/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/669/k016-p-StickC-Plus-sche.pdf
  read_note: The vendor host did not answer from the machine that wrote this file on 2026-11-17; the Wayback Machine copy (captured 2026-04-21) was read instead. It is the file board.json cites, byte for byte.
  sha256: da0717dc357e0480f0eb4e174f2a93db6a3d00b2e0b70deed5f295a9757943cb
  checked: 2026-11-17
  revision: The print states no board revision. It carries R401 and C401 (the RTC interrupt coupled to the power key), and the docs page's change log dates the sleep and wake-up functions to 2021.12 ("version changed to v1.1"); it is the only schematic the docs page publishes.
  pages:
    1: The whole board (blocks PMU, ESP32-PICO, IMU, RTC, CH552, USB TYPE-C, GP0/EN/UART, LED/IR, 5VOUT_BOOST, POWER/BUTTONS, GROVE, I2S_MIC, IPS_LCD and the pads)
  also_read:
    - url: https://docs.m5stack.switch-science.com/en/core/StickC-Plus
      mirror_of: https://docs.m5stack.com/en/core/StickC-Plus
      used_for: the part names (ESP32-PICO-D4, ST7789v2 controller), the PinMap (Button A G37, Button B G39, red LED G10, IR G9, buzzer G2), the change log
      checked: 2026-11-17
    - url: https://web.archive.org/web/20261031011628/https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/core/MPU-6886-000193%2Bv1.1_GHIC_en.pdf
      title: MPU-6886 datasheet DS-000193 v1.1 (TDK InvenSense), linked from the docs page
      used_for: the MPU6886's pin names (the print numbers them only), its I2C address with AD0 low, nCS and the INT pin's open-drain setting (K4, K18)
      checked: 2026-11-17
    - board_json: ../board.json
      used_for: the AXP192 (0x34) and BM8563 (0x51) I2C addresses, from the datasheets it cites (axp192-datasheet-full, bm8563-datasheet)
    - url: https://github.com/m5stack/M5-Schematic/blob/master/Core/AXP192%20Datasheet_v1.1_en_draft_2211.pdf
      title: AXP192 datasheet, revision 1.1, English draft (X-Powers), in M5Stack's M5-Schematic repository (board.json axp192-datasheet-full)
      used_for: PWRON's internal pull-up, PWROK, N_VBUSEN, IRQ, DC-DC1's voltage register (REG26H) and the TWSI address (K1, K3, K4, K5, K16, K23); N_OE (no entry, README)
      checked: 2026-11-17
    - url: https://web.archive.org/web/20261031011628/https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/docs/datasheet/core/BM8563_V1.1_cn.pdf
      title: BM8563 real-time clock datasheet V1.1, as M5Stack hosts it (board.json bm8563-datasheet)
      used_for: the open-drain INT output and the I2C address (K2, K17)
      checked: 2026-11-17
    - url: https://web.archive.org/web/20261002190414/https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/669/esp32-pico_series_datasheet_en.pdf
      title: ESP32-PICO Series Datasheet v1.1 (Espressif), as M5Stack hosts it (board.json esp32-pico-datasheet)
      used_for: VDD_SDIO, the in-package flash pins and the strapping pins (K6 to K13, K19 to K22)
      checked: 2026-11-17
    - url: https://web.archive.org/web/20240404213535/https://wch-ic.com/downloads/file/309.html
      title: WCH CH552 datasheet V1G (the Wayback Machine's capture of 2024-04-04)
      sha256: fcccd350a578416d189bdbee175609dae03210261a5c4491b9b17b71d0a7a5d2
      used_for: the CH552T's TSSOP20 pin names, pin 10 P3.0 (K15); pin 1 P3.2/VBUS1 (no entry, README)
      checked: 2026-11-17
    - path: bench/2026-11-17-sys-int-pull-up-and-drivers.md
      used_for: SYS_INT's pull-up is fitted and both the AXP192 and the MPU6886 pull the net low; the BM8563's INT is not on it (K4)
      checked: 2026-11-17
    - path: bench/2026-11-17-rtc-int-to-power-key.md
      used_for: an RTC countdown presses the power key through C401 and powers the board on from an AXP192 power-off (K2)
      checked: 2026-11-17
    - path: bench/2026-11-17-dcdc1-setpoint.md
      used_for: DC-DC1's voltage register reads 0x68, 3.30 V (K3)
      checked: 2026-11-17
    - path: bench/2026-11-17-usb-bridge-identity.md
      used_for: the bridge enumerates as an FTDI FT232, VID 0x0403, PID 0x6001 (K14)
      checked: 2026-11-17
    - path: bench/2026-11-17-buzzer-gpio2-load.md
      used_for: GPIO2 held high draws no DC load (no transistor-driven buzzer); not an entry, the buzzer's circuit stays open
      checked: 2026-11-17

renamed:
  ANT_FEED: NetC1_2
  AXP_BIAS: NetR5_2
  AXP_LX1: NetL2_1
  AXP_VINT: NetC10_2
  AXP_VREF: NetC16_2
  BOOST_SW: NetL4_2
  CH552_V33: NetC25_2
  ESP_VDD3P3_RTC: NetC40_2
  ESP_VDDA3P3: NetC43_2
  LNA_IN: NetC2_2
  MOS1_D: NetMOS1_D
  MOS1_G: NetMOS1_G
  MOS2_D: NetMOS2_D
  MOS2_G: NetMOS2_G
  RTC_OSCI: NetC12_2
  RTC_OSCO: NetC9_2
  USB_CC1: NetJ2_A5
  USB_CC2: NetJ2_B5

rails:   # nominal: the voltage the net's name or its regulator's part number states (3V3, SGM6603-5.0),
         # USB's 5 V for VBUS_USB and the 5 V input; "not printed" where the schematic sets no voltage
         # (the AXP192 LDOs are set over I2C)
  VBUS_USB:
    nominal: "5 V"
    from: J2
    what: "USB-C VBUS (pin VCC). Feeds the AXP192's VBUS input (pin 31), the CH552T and the gate dividers of MOS1 and MOS2."
    pages: [1]
  VBUS_VIN:
    nominal: "5 V"
    from: PAD6
    what: "Outside 5 V input on the VIN pad. Feeds the AXP192's ACIN (pins 32, 33)."
    pages: [1]
  VBAT_Li_Ion:
    nominal: "Li-ion cell"
    from: J3
    what: "Battery connector (Li_Ion), on the AXP192's BAT (pins 34, 35), which charges it."
    pages: [1]
  VBAT_RTC:
    nominal: "backup cell"
    from: BAT1
    what: "BAT1 (DMS_3R3) on the AXP192's BACKUP (pin 30)."
    pages: [1]
  IPSOUT:
    nominal: "VBUS, VIN or VBAT"
    from: U2
    what: "The AXP192's system output (IPSOUT, pins 38, 39). Feeds its DC-DC and LDO inputs (VIN1-3, LDOIN, APS), the SGM6603 boost and the RTC interrupt's pull-up R401."
    pages: [1]
  VESP_3V3:
    nominal: "3.3 V"
    from: U2
    what: "AXP192 DC-DC1: its switch node LX1 (pin 45) through L2 2.2uH, sensed on DCDC1 (pin 47). Supplies the ESP32-PICO-D4, the MPU6886, the I2C and interrupt pull-ups, the two LEDs and the 3V3 pad."
    pages: [1]
  RTC_VDD:
    nominal: "not printed"
    from: U2
    what: "AXP192 LDO1 (pin 28), also on SYSEN (pin 29). Supplies the BM8563."
    pages: [1]
  LCD_BL_VCC:
    nominal: "not printed"
    from: U2
    what: "AXP192 LDO2 (pin 12). The LCD's backlight anode (LEDA)."
    pages: [1]
  LCD_LOGIC_VCC:
    nominal: "not printed"
    from: U2
    what: "AXP192 LDO3 (pin 11). The LCD's logic supply (VDD)."
    pages: [1]
  MIC_VCC:
    nominal: "not printed"
    from: U2
    what: "AXP192 GPIO0 (pin 19). The microphone's supply."
    pages: [1]
  EXT_VDD:
    nominal: "5.0 V"
    from: U8
    what: "U8 SGM6603-5.0 boost from IPSOUT through L4 4.7uH. The Grove port's 5 V (J1 pin 2) and the 5VOUT pad."
    enable: "EXT_BOOST_EN (AXP192 EXTEN, pin 40), R18 100K to GND"
    pages: [1]

i2c:
  bus: {sda: SYS_SDA (GPIO21), scl: SYS_SCL (GPIO22), pullups: "R4 (SDA) and R3 (SCL), 2.2K to VESP_3V3"}
  devices:
    - {ref: U2, part: AXP192, address: "0x34", source: "not printed: K16, the AXP192 datasheet v1.1, p. 11 and p. 31 (write 68H, read 69H)"}
    - {ref: U4, part: BM8563, address: "0x51", source: "not printed: K17, the BM8563 datasheet V1.1, p. 1 (write A2h, read A3h)"}
    - {ref: U7, part: MPU6886, address: "0x68", source: "not printed: K18, the MPU-6886 datasheet v1.1, p. 25, section 6.2, with AD0 (pin 9) on GND"}

esp32_gpio:   # IO number -> module pin, net, what it does (U1)
  GPIO0: {pin: 23, net: GPIO0, what: "boot strap: internal pull-up and R12; low at reset enters download boot. R12 1K pull-up to VESP_3V3; MOS1 drain through R108 22R (USB bridge); microphone CLK (U3 pin 4); PAD5 through R106 22R; ESD diode D15"}
  GPIO1: {pin: 41, net: ESP32_U0TXD, what: "UART0 TX, to the CH552T's RXD (pin 10) through R25 100R"}
  GPIO2: {pin: 22, net: GPIO2, what: "PAD2; the passive buzzer (vendor docs; its part and drive are not documented); boot strap: internal pull-down, low or floating at reset for download boot"}
  GPIO3: {pin: 40, net: ESP32_U0RXD, what: "UART0 RX, from the CH552T's TXD (pin 9) through R24 100R"}
  GPIO4: {pin: 24, net: "NC"}
  GPIO5: {pin: 34, net: LCD_CS, what: "LCD chip select; boot strap: internal pull-up, SDIO slave timing"}
  GPIO6: {pin: 31, net: "NC"}
  GPIO7: {pin: 32, net: "NC"}
  GPIO8: {pin: 33, net: "NC"}
  GPIO9: {pin: 28, net: GPIO9, what: "IR LED LED1 cathode (anode on VESP_3V3); ESD diode D6"}
  GPIO10: {pin: 29, net: GPIO10, what: "Red LED LED2 cathode (anode on VESP_3V3); ESD diode D7"}
  GPIO11: {pin: 30, net: "NC"}
  GPIO12: {pin: 18, net: "NC"}
  GPIO13: {pin: 20, net: LCD_SCK, what: LCD SPI clock}
  GPIO14: {pin: 17, net: "NC"}
  GPIO15: {pin: 21, net: LCD_MOSI, what: "LCD SPI data; boot strap MTDO: internal pull-up, low at reset silences the boot log"}
  GPIO16: {pin: 25, net: "NC"}
  GPIO17: {pin: 27, net: "NC"}
  GPIO18: {pin: 35, net: LCD_RST, what: "LCD reset; R14 5.1K pull-up to VESP_3V3"}
  GPIO19: {pin: 38, net: "NC"}
  GPIO21: {pin: 42, net: SYS_SDA, what: "I2C SDA (AXP192, BM8563, MPU6886)"}
  GPIO22: {pin: 39, net: SYS_SCL, what: I2C SCL}
  GPIO23: {pin: 36, net: LCD_DC, what: LCD data/command (RS)}
  GPIO25: {pin: 14, net: GPIO25, what: PAD10}
  GPIO26: {pin: 15, net: GPIO26, what: "PAD9 through R105 22R; ESD diode D14"}
  GPIO27: {pin: 16, net: GPIO27, what: "AXP192 N_VBUSEN (pin 6): low lets IPSOUT take VBUS, high stops it; R21 10K pull-down holds it low"}
  GPIO32: {pin: 12, net: GPIO32, what: "Grove J1 pin 3; ESD diode D1"}
  GPIO33: {pin: 13, net: GPIO33, what: "Grove J1 pin 4; ESD diode D2"}
  GPIO34: {pin: 10, net: GPIO34, what: microphone DATA (U3 pin 5)}
  GPIO35: {pin: 11, net: SYS_INT, what: "AXP192 IRQ (pin 48) and MPU6886 INT (pin 12); R2 2.2K pull-up to VESP_3V3"}
  GPIO36: {pin: 5, net: GPIO36, what: "PAD4 through R107 22R; ESD diode D16"}
  GPIO37: {pin: 6, net: GPIO37, what: "Button A (S3), active low; R20 10K pull-up to VESP_3V3"}
  GPIO38: {pin: 7, net: GPIO38, what: PAD3}
  GPIO39: {pin: 8, net: GPIO39, what: "Button B (S2), active low; R11 5.1K pull-up to VESP_3V3; ESD diode D8"}

pmic_gpio:   # AXP192 (U2) GPIOs as the schematic wires them
  GPIO0/LDOio0: {pin: 19, net: MIC_VCC}
  GPIO1: {pin: 18, net: "NC"}
  GPIO2: {pin: 20, net: "NC"}
  GPIO3: {pin: 41, net: "NC"}
  GPIO4: {pin: 42, net: "NC"}

pulls:   # every resistor with one end on a rail or ground and the other on a signal
  - {signal: SYS_INT, up: VESP_3V3, via: R2, value: 2.2K}
  - {signal: SYS_SCL, up: VESP_3V3, via: R3, value: 2.2K}
  - {signal: SYS_SDA, up: VESP_3V3, via: R4, value: 2.2K}
  - {signal: AXP_BIAS, down: GND, via: R5, value: 200K}
  - {signal: ESP32_EN, up: VESP_3V3, via: R8, value: 5.1K}
  - {signal: GPIO39, up: VESP_3V3, via: R11, value: 5.1K}
  - {signal: GPIO0, up: VESP_3V3, via: R12, value: 1K}
  - {signal: USB_CC1, down: GND, via: R13, value: 5.1K}
  - {signal: LCD_RST, up: VESP_3V3, via: R14, value: 5.1K}
  - {signal: EXT_BOOST_EN, down: GND, via: R18, value: 100K}
  - {signal: USB_CC2, down: GND, via: R19, value: 5.1K}
  - {signal: GPIO37, up: VESP_3V3, via: R20, value: 10K}
  - {signal: GPIO27, down: GND, via: R21, value: 10K}
  - {signal: MOS2_G, up: VBUS_USB, via: R101, value: 1K}
  - {signal: MOS2_G, down: GND, via: R102, value: 1K}
  - {signal: MOS1_G, up: VBUS_USB, via: R103, value: 1K}
  - {signal: MOS1_G, down: GND, via: R104, value: 1K}
  - {signal: RTC_INT, up: IPSOUT, via: R401, value: 10K}

