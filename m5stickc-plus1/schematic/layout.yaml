    description: Power-management IC (X-Powers AXP192)
    left: ["32 ACIN", "33 ACIN", "31 VBUS", "-", "34 BAT", "35 BAT", "37 TS", "30 BACKUP", "-",
           "24 BIAS", "25 VREF", "26 VINT", "-", "1 SDA", "2 SCK", "48 IRQ", "-",
           "23 PWRON", "5 PWROK", "6 N_VBUSEN", "4 N_OE", "3 N_RSTO", "27 PWREN", "29 SYSEN", "40 EXTEN",
           "36 CHGLED"]
    right: ["47 DCDC1", "45 LX1", "44 VIN1", "-", "10 DCDC2", "8 LX2", "7 VIN2", "-",
            "17 DCDC3", "15 LX3", "14 VIN3", "-", "38 IPSOUT", "39 IPSOUT", "21 APS", "13 LDOIN", "-",
            "28 LDO1", "12 LDO2", "11 LDO3", "-", "19 GPIO0", "18 GPIO1", "20 GPIO2", "41 GPIO3",
            "42 GPIO4", "43 NC"]
    bottom: ["46 PGND1", "9 PGND2", "16 PGND3", "22 AGND", "49 PAD"]
  ESP32-PICO-D4:
    short: ESP32 SiP module
    description: ESP32-PICO-D4 System-in-Package, 4 MB flash (printed PICO_D4)
    left: ["1 VDDA", "43 VDDA", "46 VDDA", "3 VDDA3P3", "37 VDD3P3_CPU", "4 VDDA3P3", "19 VDD3P3_RTC",
           "26 VDD_SDIO", "-", "2 LNA_IN", "-", "9 EN"]
    bottom: ["49 PAD"]
    right: ["23 IO0", "41 IO1/U0TXD", "22 IO2", "40 IO3/U0RXD", "24 IO4", "34 IO5", "31 IO6/CLK",
            "32 IO7/SD0", "33 IO8/SD1", "28 IO9/SD2", "29 IO10/SD3", "30 IO11/CMD", "18 IO12", "20 IO13",
            "17 IO14", "21 IO15", "25 IO16", "27 IO17", "35 IO18", "38 IO19", "42 IO21", "39 IO22",
            "36 IO23", "14 IO25", "15 IO26", "16 IO27", "12 IO32", "13 IO33", "10 IO34", "11 IO35",
            "5 IO36", "6 IO37", "7 IO38", "8 IO39"]
  MPU6886:
    short: 6-axis IMU
    description: 6-axis IMU (pin names from the MPU-6886 datasheet)
    left: ["13 VDD", "8 VDDIO", "22 nCS", "9 AD0/SDO", "-", "23 SCL/SCLK", "24 SDA/SDI", "12 INT",
           "11 FSYNC", "10 REGOUT"]
    bottom: ["18 GND"]
    right: ["19 RESV", "20 RESV", "1 NC", "2 NC", "3 NC", "4 NC", "5 NC", "6 NC", "7 NC", "14 NC",
            "15 NC", "16 NC", "17 NC", "21 NC"]
  BM8563:
    short: Real-time clock
    description: Real-time clock
    left: ["8 VDD", "5 SDA", "6 SCL", "3 ~{INT}"]
    right: ["1 OSCI", "2 OSCO", "7 CLKOUT"]
    bottom: ["4 VSS"]
  SGM6603:
    short: Boost converter
    description: Synchronous boost converter, 5.0 V (SGM6603-5.0)
    left: ["6 IN", "3 EN"]
    right: ["1 SW", "5 OUT", "4 NC/FB"]
    bottom: ["2 GND"]
  CH552T:
    short: USB-UART bridge MCU
    description: USB microcontroller used as the USB-serial bridge (pin names as printed, pin 10's from the CH552 datasheet, K15)
    left: ["19 VCC", "1 P3.2", "20 V33", "6 RST", "-", "14 P3.6", "15 P3.7", "-", "9 P3.1", "10 P3.0",
