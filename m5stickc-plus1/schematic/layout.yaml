#
# How the M5StickC Plus 1.1 schematic is drawn: the symbol each part takes, our
# own symbols, and the sheets, blocks and rows the parts sit in. The facts
# (values, pins, nets) are in netlist.yaml; _shared/kicad_schematic.py joins
# the two.
#
# parts: a part takes the symbol its prefix names under _by_prefix unless it has
# a row of its own. "pins" maps our symbol's pin number to the vendor's pin
# (a list when one of our pins stands for several of the vendor's, "-" when the
# vendor has no such pin). "angle" turns the symbol (90: a vertical two-pin part
# lies flat).
# rows: each row of a block is laid left to right; an item is a reference,
# {col: [...]} for a column of two-pin parts, {cols: [[...], [...]]} for
# several, or {text: ...}.
# sheets: "summary" and "parts" fill the sheet's box on the contents page; a
# sheet with "index" (power, nets, parts) is a page of tables the generator
# writes from netlist.yaml, after the drawing; "gpio_title" and "pmic_title"
# name the nets page's GPIO tables after this board's parts, and "test_points"
# titles the table of the pads there.
# root: the contents page's heading and the panels of its right-hand column;
# revisions: the history the contents page prints (the last one is in every
# title block). short: what a part is, in the parts list and the power tree.
# power_tree: its boxes, [column, row], and arrows, each a connection
# netlist.yaml has (the generator refuses any other).

paper: A3
title_block:
  title: M5StickC Plus 1.1 (K016-P)
  company: "Kleidos boards: connectivity documented from the vendor's public documentation"
  comments:
    - "Sources: M5Stack K016-P schematic (2025-11-04) and docs; README.md"
    - "Values as documented. Layout and symbols: Kleidos boards"

revisions:
  - {rev: 1, date: "2026-11-17", change: "First drawing: every part, pin and net, from the vendor's public documentation; contents, power tree, nets and signals, parts list, page/zone links that land on the label, no script in the PDF."}
  - {rev: 2, date: "2026-11-17", change: "Kleidos additions and corrections K1-K23, listed above, from the datasheets, the vendor's docs page and four bench records."}
  - {rev: 3, date: "2026-11-17", change: "An entry is marked wherever an index page shows its element again; a pin on no net says what it is on the nets page; the title block says the drawing carries entries."}
  - {rev: 4, date: "2026-11-19", change: "The Kleidos drawing sheet, its mark in the title block."}

grounds:
  GND: kleidos:GND

parts:
  _by_prefix:
    R: {symbol: "kleidos:R", angle: 90, stub: 0}
    C: {symbol: "kleidos:C", angle: 90, stub: 0}
    CX: {symbol: "kleidos:C_Polarized", angle: 90, stub: 0, short: "Capacitor, polarized"}
    L: {symbol: "kleidos:L", angle: 90, stub: 0}
    D: {symbol: "kleidos:D_TVS", stub: 0, short: ESD diode}
    S: {symbol: "kleidos:SW_Push", stub: 0}
    PAD: {symbol: "kleidos:TestPoint", stub: 0, short: Pad}
  LED1: {symbol: "kleidos:LED", stub: 0, pins: {"1": "2", "2": "1"}, short: IR LED}
  LED2: {symbol: "kleidos:LED", stub: 0, pins: {"1": "2", "2": "1"}, short: Red LED}
  MOS1: {symbol: "kleidos:Q_NMOS"}
  MOS2: {symbol: "kleidos:Q_NMOS"}
  Y1: {symbol: "kleidos:Crystal", stub: 0, short: Crystal}
  E1: {symbol: "kleidos:Antenna", short: Antenna}
  BAT1: {symbol: "kleidos:Conn_01x02", short: Backup cell}
  J1: {symbol: "kleidos:Conn_01x04", short: Grove connector}
  J2: {symbol: "m5stickc-plus1:TYPEC", pins: {V: VBUS, G: GND, SH: SHELL}}
  J3: {symbol: "kleidos:Conn_01x02", short: Battery connector}
  U1: {symbol: "m5stickc-plus1:ESP32-PICO-D4"}
  U2: {symbol: "m5stickc-plus1:AXP192"}
  U3: {symbol: "m5stickc-plus1:SPM1423HM4H-B"}
  U4: {symbol: "m5stickc-plus1:BM8563"}
  U5: {symbol: "m5stickc-plus1:LCD"}
  U6: {symbol: "m5stickc-plus1:CH552T"}
  U7: {symbol: "m5stickc-plus1:MPU6886"}
  U8: {symbol: "m5stickc-plus1:SGM6603"}

symbols:
