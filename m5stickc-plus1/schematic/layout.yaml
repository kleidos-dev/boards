    right: ["2 P1.4", "3 P1.5", "4 P1.6", "8 P1.1", "11 P3.3", "12 P3.4", "13 P3.5", "16 P1.3", "17 P1.2"]
    bottom: ["18 GND"]
  LCD:
    short: LCD panel
    ref: U
    description: 1.14 in 135 x 240 TFT LCD panel (ST7789v2), its connection as printed
    left: ["6 SCK", "5 MOSI", "4 RS", "8 CS", "3 RESET", "-", "1 LEDA", "7 VDD"]
    bottom: ["2 GND", "0 PAD"]
  SPM1423HM4H-B:
    short: Digital microphone
    description: Digital MEMS microphone (block I2S_MIC in the print)
    left: ["6 VCC", "4 CLK", "5 DATA", "2 SELECT"]
    bottom: ["1 GND", "3 GND"]
  TYPEC:
    short: USB-C receptacle
    ref: J
    description: "USB-C receptacle (pins as printed; V, G and SH stand for the print's VBUS, GND and SHELL)"
    left: ["V VCC", "A5 CC1", "B5 CC2", "A6 DP1", "B6 DP2", "A7 DN1", "B7 DN2"]
    bottom: ["G GND", "SH SHELL"]

root:
  title: Contents
  heading: "M5StickC Plus 1.1 (K016-P) schematic"
  subheading: "Kleidos boards: every part, pin and net, connectivity documented from the vendor's public documentation"
  panels:
    - title: How to read it
      text: |
        Click a box on the left to open its page. "Contents" and the page numbers at the bottom right of
        every page lead back here and to each page.

        Cyan lines are connections: wires and pin ends, all one width. A dot joins lines; a cross on a pin
        end means the pin is not connected. Pins connect by net labels (the boxed names): pins whose labels
        carry the same name are on one net, on any page. [3/C4] after a label: page 3 carries that net too,
        its label in zone C4 (column 4, row C of the border). Click it to land on that label. No
        [page/zone]: the net is on this page only. Click a part's reference to find its row in the parts
        list; the row's page/zone leads back. White: parts and their references. Grey: values, pin names,
        pin numbers. A dashed frame is a block of the circuit, titled at its top left. An amber K5 marks a
        Kleidos addition or correction: it leads to its row below.
    - title: Notes
      text: |
        Every part, pin and net of the M5StickC Plus 1.1, with the values the vendor documents: connectivity
        documented from the vendor's public documentation, with Kleidos additions and corrections listed on
        page 1 (M5Stack's StickC-Plus K016-P schematic, one page, Altium export of 2025-11-04, and its docs
        page, cited in README.md and netlist.yaml beside this file). Layout and symbols are this project's.
        No footprints, no PCB, no part numbers beyond the documented ones. Values are as the vendor prints
        them (5.1K, 100uF/4V). The schematic documents no part as not fitted, so no part carries a DNP mark.
        Reference designators are the vendor's, not renumbered. Two parts carry none in the print and take
        ours: U1, the ESP32-PICO-D4 (printed U?), and J3, the battery connector (printed Li_Ion). Nets the
        vendor left unnamed carry names of ours (ANT_FEED, AXP_LX1...). The MPU6886's pin names are its
        datasheet's, shortened where it gives several (INT, FSYNC, RESV): the print numbers them only.
        The CH552T's pin 10 is named P3.0, the datasheet's name (K15). Zones: columns 1-8 and rows A-F,
        50 mm apart, printed in the border.
sheets:
  - file: power.kicad_sch
    name: Power management
    summary: "The AXP192 with its inputs (USB-C VBUS, the VIN pad, the battery, the backup cell), its DC-DC and LDO outputs, the power key with the RTC wake-up coupling, and the 5 V boost for the Grove port and the 5VOUT pad."
    parts: "U2 AXP192, J3 battery connector, BAT1 backup cell, S1 power key, U8 SGM6603-5.0"
    pwr_flags: [GND]
    blocks:
      - title: AXP192 power management
        rows:
          - [U2, {cols: [[C3, R5, C16, C10, R21], [L2, C5, CX1, C15, C20, C8], [C13, C24, C30, C23, CX2]]}]
      - title: Battery and backup cell
        rows:
          - [J3, BAT1]
      - title: Power key and RTC wake-up
        rows:
          - [S1, {col: [D13, C401, R401]}]
      - title: 5 V boost (Grove and 5VOUT)
        rows:
          - [U8, {cols: [[L4, R18], [C36, C45, C46]]}]
  - file: soc.kicad_sch
    name: ESP32-PICO-D4
    summary: "The ESP32-PICO-D4 with its supply decoupling, RF path and antenna, the enable and GPIO0 pull-ups, the I2C and interrupt pull-ups, buttons A and B, and the IR and red LEDs."
    parts: "U1 ESP32-PICO-D4, E1 antenna, S2 S3 buttons, LED1 IR LED, LED2 red LED"
    blocks:
      - title: ESP32-PICO-D4
        rows:
          - [U1]
      - title: Supply decoupling
        rows:
          - [{cols: [[C38, C39, C41, C44], [C42, C40, C43]]}]
      - title: RF path and antenna
        rows:
          - [E1, {cols: [[L1], [C2, C1]]}]
      - title: Pull-ups (enable, GPIO0, LCD reset, I2C, interrupt)
        rows:
          - [{cols: [[R8, R12, R14], [R4, R3, R2]]}]
      - title: Buttons A and B
        rows:
          - [S3, S2, {col: [R20, R11, D8]}]
      - title: IR and red LEDs
        rows:
          - [LED1, LED2, {col: [D6, D7]}]
  - file: usb.kicad_sch
    name: USB and serial bridge
    summary: "The USB-C receptacle with its CC resistors and ESD diodes, the CH552T USB-serial bridge, the UART series resistors and the two MOSFETs that drive the ESP32's EN and GPIO0 from the bridge while USB power is present."
    parts: "J2 USB-C, U6 CH552T, MOS1 MOS2 CJ2302"
    blocks:
      - title: USB-C receptacle
        rows:
          - [J2, {col: [R13, R19, C4, D3, D4]}]
      - title: CH552T USB-serial bridge
        rows:
          - [U6, {col: [C25, C27, R24, R25]}]
      - title: EN and GPIO0 drive (auto-program)
        rows:
          - [MOS2, {col: [R101, R102, R109]}]
          - [MOS1, {col: [R103, R104, R108]}]
  - file: peripherals.kicad_sch
    name: Sensors, display and connectors
    summary: "The MPU6886 IMU, the BM8563 real-time clock with its crystal, the LCD panel's connection, the PDM microphone, the Grove port and the pads with their series resistors and ESD diodes."
    parts: "U7 MPU6886, U4 BM8563, Y1 32.768 kHz, U5 LCD, U3 SPM1423HM4H-B, J1 Grove, PAD1-PAD10"
    blocks:
      - title: IMU
        rows:
          - [U7, {col: [C28, C29, C21]}]
      - title: Real-time clock
        rows:
          - [U4, {col: [Y1, C12, C9, C11]}]
      - title: LCD panel
        rows:
          - [U5, {col: [C18]}]
      - title: Microphone
        rows:
          - [U3, {col: [C7]}]
      - title: Grove port
        rows:
          - [J1, {col: [D1, D2, C37]}]
      - title: Pads
        rows:
          - [{cols: [[PAD1, PAD2, PAD3, PAD10, PAD6], [PAD4, PAD5, PAD9, PAD7, PAD8], [R107, R106, R105], [D16, D15, D14]]}]
  - file: power_tree.kicad_sch
    name: Power tree and rails
    index: power
    summary: "How power flows from the USB-C, the VIN pad, the battery and the backup cell through the AXP192 to every rail, and each rail's nominal voltage, source and enable. Every box leads to where it is drawn."
  - file: nets.kicad_sch
    name: Nets and signals
    index: nets
    gpio_title: "ESP32-PICO-D4 GPIO (U1)"
    pmic_title: "AXP192 GPIO (U2)"
    test_points: {title: "Pads", value: true, sub: "The ten pads as printed; which header pin each is, is not printed."}
    summary: "Every rail and every net drawn on more than one page, with the page/zone of its labels; the ESP32-PICO-D4 and AXP192 GPIO, the I2C addresses, the pads, every pull-up and pull-down."
  - file: parts.kicad_sch
    name: Parts
    index: parts
    summary: "Every part: its value as printed, what it is, its nets and where it is drawn. A reference on the drawing leads to its row, the row back to it."

power_tree:
  title: Power tree
  pitch: [27.94, 17.78]
  nodes:
    J2: [0, 0]
    VBUS_USB: [1, 0]
    PAD6: [0, 1]
    VBUS_VIN: [1, 1]
    J3: [0, 2]
    VBAT_Li_Ion: [1, 2]
    BAT1: [0, 3]
    VBAT_RTC: [1, 3]
    U2: [2, 2]
    VESP_3V3: [3, 1]
    RTC_VDD: [3, 2]
    LCD_BL_VCC: [3, 3]
    LCD_LOGIC_VCC: [3, 4]
    MIC_VCC: [3, 5]
    IPSOUT: [3, 0]
    U8: [4, 0]
    EXT_VDD: [5, 0]
  edges:
    - [J2, VBUS_USB]
    - [PAD6, VBUS_VIN]
    - [J3, VBAT_Li_Ion]
    - [BAT1, VBAT_RTC]
    - [VBUS_USB, U2]
    - [VBUS_VIN, U2]
    - [VBAT_Li_Ion, U2]
    - [VBAT_RTC, U2]
    - [U2, IPSOUT]
    - [U2, VESP_3V3]
    - [U2, RTC_VDD]
    - [U2, LCD_BL_VCC]
    - [U2, LCD_LOGIC_VCC]
    - [U2, MIC_VCC]
    - [IPSOUT, U8]
    - [U8, EXT_VDD]
  note: "The arrows into U2 are its inputs; the AXP192 also charges the battery on BAT (pins 34, 35) and the backup cell on BACKUP (pin 30). IPSOUT also feeds the AXP192's own DC-DC and LDO inputs (VIN1-3, LDOIN, APS)."
